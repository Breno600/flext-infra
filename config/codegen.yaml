Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    # Per-module scc code-LOC ceiling. Operator instruction 2026-09-07:
    # the former 1000-LOC allowance stands (supersedes the 200 constant).
    loc_cap:
      max_lines: 1000

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # Every fleet binary is selected as latest at setup time; mise resolves
      # each moving selector to the newest published release. Dependency
      # floors remain in pyproject and uv.lock alone owns their resolved
      # Python distributions.
      python_version: "3.13"
      state_directory_name: .flext-runtime
      scratch_namespace: scratch
      pycache_namespace: pycache
      mise_namespace: mise-artifacts
      uv_link_mode: copy
      uv_environments: ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
      # Supply-chain cooldown SSOT shared by uv and generated update policy.
      # 0 disables the window: uv resolves every version published up to now.
      dependency_cooldown_days: 0
      dependency_cooldown_exclusions: []
      dependency_cooldown_overrides: {}
      # Complete tool catalog uncapped by the uv supply-chain cooldown. The
      # codegen model projects the closure of this list with the scaffold
      # requirement owners derived from the build and dev tables; runtime
      # dependency profiles never enter it.
      additional_python_tool_distributions: [actionlint-py, bandit, deptry, flext-tests, hatchling, mypy, pip-audit, pre-commit, pyrefly, pyright, pytest, pytest-testmon, ruff, rumdl, vulture, yamlfix]
      # Global compatibility exceptions become [tool.uv] constraint-dependencies
      # in every project, including projects using the dependency transitively.
      # Keep reasons here; an empty list removes constraints from all projections.
      # flext-y3qpq.4: meltano 4.2.2 (latest) still declares structlog<26,>=25.5.0
      # upstream (revalidated on PyPI 2026-09-09) and the fleet member
      # flext-meltano resolves meltano in the shared fleet lock, so the fleet
      # floor for structlog stays capped at <26: one fleet lock cannot carry
      # both structlog<26 and >=26.1.0 for the same dependency. Do not lift
      # this cap unless meltano upstream drops its own cap; floors derive
      # from deps against this same contract (operator 2026-09-09).
      uv_constraint_dependencies: ["structlog<26"]
      # Moving selectors consumed by generated .mise.toml and CI. The fleet
      # runs unlocked: setup converges on the newest published release.
      # Override these YAML keys only. Never edit .mise.toml. Never run
      # `mise lock`. Never pin a SHA.
      uv_version: latest
      kubectl_version: latest
      helm_version: latest
      kind_version: latest
      direnv_version: latest
      taplo_version: latest
      ast_grep_version: latest
      gitleaks_version: latest
      kubeconform_version: latest
      # Projection: .mise.toml [settings] lockfile / locked and [tool_config] locked.
      # false is required: existing lockfiles would pin checksums against latest.
      mise_lockfile: false
      mise_locked: false
      # Projection: .mise.toml [tools] keys. Override the selector here.
      qlty_selector: github:qltysh/qlty
      qlty_version: latest
      node_version: latest
      jscpd_selector: npm:jscpd
      jscpd_version: latest
      waza_selector: github:microsoft/waza
      waza_version: latest
      scc_selector: aqua:boyter/scc
      scc_version: latest
      go_version: latest
      protected_mise_tools:
        - beads
        - gascity
      gascity:
        # The fleet gc is the operator's fork carrying the native-store
        # compatibility correction required by every governed rig.
        # Projection: .mise.toml [tools."<selector>"]. Override here.
        selector: github:marlon-costa-dc/gascity
        # release = always version latest (prerelease tags included).
        # branch = set track: branch and branch: <name> (required, no default main).
        track: release
        version: latest
        # Suffixed release tag; mise only resolves it when told it is a prerelease.
        prerelease: true
        github_attestations: false
        # Selector shapes that identify gc in a mise manifest, so a regenerated
        # .mise.toml cannot silently swap the fleet build for another distribution.
        selector_patterns:
          - gc
          - gascity
          - "*:*/gascity"
      beads:
        # Projection: .mise.toml [tools."<selector>"]. Override here.
        selector: github:marlon-costa-dc/beads
        track: release
        version: latest
        # The fleet bd is the operator's fork carrying the hierarchy-cycle
        # guard required to prevent unbounded list traversal. Its releases use
        # prerelease tags, so mise must be allowed to resolve them.
        prerelease: true
        github_attestations: false
        # Selector shapes that identify this tool in a mise manifest, so a
        # regenerated .mise.toml cannot silently replace the selected fork.
        selector_patterns:
          - bd
          - beads
          - "*:*/beads"
          - "*:*/beads/cmd/bd"
        # The city owns the endpoint; a repository declares only that it
        # inherits one. Both values are rendered into .beads/config.yaml as
        # gc.endpoint_origin / gc.endpoint_status.
        endpoint_origin: inherited_city
        endpoint_status: verified
        # Issue types every governed ledger must know, unioned with each
        # repository's own custom types when the projection is rendered.
        required_custom_types:
          - molecule
          - convoy
          - message
          - event
          - gate
          - merge-request
          - agent
          - role
          - rig
          - session
          - spec
          - convergence
          - step
        # Ledger scalars rendered into .beads/config.yaml. Change them here.
        # Per-repo override of Gas City participation is workspace.yaml
        # `gascity_enabled` (flips dolt.auto-start and omits gc.*). Never edit
        # the projection `.beads/config.yaml`.
        dolt_mode: server
        export_auto: false
        backup_enabled: false
        dolt_disable_event_flush: true

    # actions/checkout submodules mode for every generated workflow.
    # 'false' is the safe default: the workflow GITHUB_TOKEN cannot clone
    # sibling PRIVATE repositories, so 'recursive' aborts the job at checkout
    # with "Repository not found" before any code runs. Only projects that
    # really exercise their subprojects in CI opt in through
    # config/codegen-overrides.yaml.
    checkout_submodules: "false"
    checkout_submodules_overrides: {}

    # Runner packages a distribution's own tests need (Ubuntu apt names),
    # installed by the generated CI before the gates run. A test that drives
    # a real external engine keeps running in CI instead of being skipped;
    # the engine is declared here, once, at the fleet SSOT.
    ci_system_packages:
      flext-cli:
        # tests/test_xlsx_recalc.py: headless LibreOffice recalculation.
        - libreoffice-calc
    # Per-distribution private composed-project auth for CI. The default
    # GITHUB_TOKEN cannot clone sibling private repos; projects that need
    # private submodules declare read-only deploy-key secrets via
    # config/codegen-overrides.yaml, which the generated workflow materializes
    # before `make setup` (which otherwise fails on HTTPS submodule clone).
    ci_private_submodules: {}

    # Actions ride their upstream floating major tag: setup converges on the
    # newest compatible release, never on an immutability SHA or patch pin.
    github_actions:
      checkout:
        repository: actions/checkout
        version: v7
      kind:
        repository: helm/kind-action
        version: v1
      upload-artifact:
        repository: actions/upload-artifact
        version: v4
      cache:
        repository: actions/cache
        version: v4
      configure-pages:
        repository: actions/configure-pages
        version: v6
      upload-pages-artifact:
        repository: actions/upload-pages-artifact
        version: v5
      deploy-pages:
        repository: actions/deploy-pages
        version: v5
      create-github-app-token:
        repository: actions/create-github-app-token
        version: v2

    uv_exclude_dependencies:
      # Standalone CI installs the project editable while sibling flext packages
      # declare the same package via git+https@integration. uv rejects that as
      # conflicting URLs. Scope official exclude-dependencies to the reverse
      # edges only; every other transitive dependency stays in resolution.
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]
      - project: flext-core
        package:
          name: flext-infra
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-tests
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-cli
        dependencies: [flext-core]
      - project: flext-cli
        package:
          name: flext-infra
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-core
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-tests
        dependencies: [flext-cli]
      - project: flext-tests
        package:
          name: flext-infra
        dependencies: [flext-tests]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
      # External consumer organization: standalone repositories governed by
      # conform through their own config/workspace.yaml. A linha de integracao
      # e 'develop', fixada pela ADR-134 do operador, que proibe 'dev' e
      # 'master' como sinonimos. Verificado na API do GitHub em 2026-08-03:
      # cosmos-main, cosmos-charts e cosmos-gitops tem default_branch=develop
      # e nenhum deles publica 'dev' (GET /branches/dev responde 404).
      - name: datacosmos-br
        organization: datacosmos-br
        base_url: https://github.com/datacosmos-br
        branch: develop
      # Personal-account consumer organization: standalone repositories whose
      # canonical remote is the operator's own account. `invest` and `mcb`
      # already declare `provider: marlonsc` in their config/workspace.yaml, so
      # conform must be able to resolve it. Their integration line is `develop`;
      # a repository that integrates elsewhere overrides it in its own
      # `integration` block, as `invest` does with `dev`.
      - name: marlonsc
        organization: marlonsc
        base_url: https://github.com/marlonsc
        branch: develop
    branch_policy:
      technical_branch_patterns:
        - __dolt_remote_info__
        - dolt/*
        - gh-readonly-queue/*
      # FLEXT branch model: main is the produced release (tagged + published to
      # PyPI) and 0.20.0-dev is the future line on hold. Both must carry the
      # current development line, so both are gated. Parked releases (0.10.0-dev,
      # 0.11.0-dev), snapshots and lane branches are inventoried but never gated.
      governed_branch_patterns:
        - main
        - 0.12.0-dev
        - 0.20.0-dev
      # Pushes to these branches trigger the generated CI workflow. The renderer
      # adds the repository's own integration branch to this list; it never
      # hardcodes a fleet branch name.
      ci_trigger_branches:
        - main
        - 0.12.0-dev
        - 0.20.0-dev
      # Ordered names tried against live Git to derive each repository's
      # baseline. The FLEXT fleet integrates on 0.12.0-dev, which is a release
      # name and therefore belongs here rather than inside the package: a
      # constant shipped with flext-infra cannot know a consumer's release line.
      # The conventional names follow so a governed repository outside this
      # fleet — ai-hub publishes `dev` — still resolves without declaring
      # anything.
      integration_branch_preference:
        - 0.12.0-dev
        - develop
        - dev
        - main
    infra_repository:
      distribution: flext-infra
      provider: flext-sh

    profiles:
      - name: workspace
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: gitmodules
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      # Operator 2026-09-08: ruff is the formatting and autofix rule.
      # Every ruff invocation uses --preview. make fmt APPLY=Y also runs
      # ruff check --fix --unsafe-fixes --preview. Never weaken ruff to
      # keep a file; change the code. [tool.ruff] preview: true in
      # tooling.yaml is the same policy projected into pyproject.
      ruff:
        format_check: [--preview, --check]
        format_apply: [--preview]
        lint_check: [--preview, --no-fix]
        lint_fix: [--preview, --fix, --unsafe-fixes]
      # Why (mro-dipb): adaptive testmon GitHub Actions cache policy.
      # save_enabled stays false while storage-limit API returns HTTP 402 /
      # flext-infra sits near the default Actions cache ceiling (QUOTA_HOLD).
      testmon_cache:
        schema_version: 1
        namespace: testmon
        invocation_namespace: pytest
        database_filename: .testmondata
        target_directory: tests
        reports_directory: .reports/tests
        mode: bootstrap
        save_enabled: false
        max_bootstrap_generations: 3
        max_stable_generations: 2
        per_repo_budget_bytes: 536870912
        warning_threshold_percent: 70
        maintenance_threshold_percent: 75
        block_threshold_percent: 80
        allowed_save_refs: [refs/heads/0.12.0-dev]
        key_prefix: testmon-v1
      apply_variable: APPLY
      apply_value: Y
      # Operator decision 2026-09-10 (0.12.0-dev): public verbs APPLY by
      # default. `make gen`, `make test`, and every other declared verb runs
      # with no variables at all; APPLY=N is the explicit opt-out for check
      # mode where the verb supports one (docs fix, conform, audit).
      apply_absent_value: Y
      ci:
        variable: CI
        value: Y
        # local_value (hq-36xk): the local arm of the same ternary. Only the
        # exact `value` disables coverage and narrows CHECK_GATES, so pre-push
        # sets this instead to keep every gate and the complete pytest+coverage
        # run. The templates consumed `make.ci.local_value` while no owner
        # declared it, so no repository could render its pre-commit config.
        local_value: N
        # RULING 2 (rules, not a skip-list): local_check_gates is the ONLY
        # declared set. CI=Y runs its strict complement, derived in
        # MakeCiSpec.check_gates, so the two contexts can never overlap nor
        # leave a gate unowned; an unset CI runs every allowed gate. `format`
        # is not a check gate at all -- it mutates files, so it belongs to
        # make fmt / make fix APPLY=Y only. This supersedes the earlier
        # check_gates_skip list, which could drift out of sync with the set it
        # was meant to complement.
        # RULING 1: CI is ternary (Y/N/absent). CI=Y owns the Review workflow,
        # including full pytest+coverage while attestation is not selected;
        # CI=N owns the complementary local check gates; absent uses testmon
        # for incremental developer runs.
        #
        # The set is the SLOW whole-program type checkers, matching
        # PROJECT_CHECK_GATES_LOCAL_VALUES: those are the gates worth deferring
        # off the fast CI leg, and they are what CI=N exists to own. `lint` is
        # not here -- ruff is cheap, so making CI skip it buys nothing and
        # leaves the fast leg without a linter.
        local_check_gates: [pyrefly, mypy]
      # Why (operator law 2026-08-24): git-hook stages are disabled by default;
      # the workflow below still declares stage membership so re-enabling is a
      # one-key change, case by case. CI owns read-only setup, generation drift,
      # and checks; it never renders an apply/fmt/fix invocation.
      pre_commit: false
      pre_push: false
      workflow:
        # Why: pre-commit runs fmt+fix (mutation) then CI=Y make check (same
        # gates as CI: mypy pyright security markdown smells). This bans
        # broken code from ever being committed. pre-push adds gen+test.
        - {verb: setup, apply: false, contexts: [local, ci]}
        - {verb: gen, apply: true, contexts: [local, pre_push]}
        - {verb: fmt, apply: true, contexts: [local, pre_commit]}
        - {verb: fix, apply: true, contexts: [local, pre_commit]}
        - {verb: check, apply: true, contexts: [local, ci, pre_push, pre_commit]}
        # Review CI proves the complete native gate set. Draft PRs do not select
        # the job, while attestation reuse is selected externally by AI Hub.
        - {verb: test, apply: true, contexts: [local, ci, pre_push]}
      # Artifacts `make clean` removes. Read by Makefile.j2 for the cache
      # sweep and the root-level directory/file lists.
      clean:
        cache_dirs:
          - __pycache__
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - .pyrefly_cache
          - .benchmarks
          - .hypothesis
        root_dirs:
          - .test-tmp
          - .test-runtime
          - build
          - dist
          - htmlcov
          - .reports
        root_files:
          - .coverage
          - .testmondata
        trace_globs:
          - "*.pstats"
      # Branch shapes and PR state that let a push skip the pre-push gate, and
      # the integration branches the merge lock protects. Read by
      # ci.yml.j2 and .pre-commit-config.yaml.j2.
      work_in_progress:
        draft_pr: true
        branch_patterns:
          - "^wip/"
          - WIP
        merge_lock_target_branches:
          - dev
          - develop
          - 0.12.0-dev
      docs:
        api_modules:
          flext-infra:
            - api
            - base
            - base_selection
            - cli
            - constants
            - git
            - models
            - protocols
            - typings
            - utilities
            - worktree
        mutable_actions: [fix]
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
        stale_github_organizations:
          - organization
        github_repos:
          - organization: flext-sh
            repository: flext
            branch: 0.12.0-dev
            local_checkout: ~/flext
          - organization: flext-sh
            repository: flext-core
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-core
          - organization: flext-sh
            repository: flext-infra
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-infra
          - organization: datacosmos-br
            repository: ai-hub
            branch: dev
            local_checkout: ~/.ai-hub
          - organization: datacosmos-br
            repository: cosmos-docgen
            branch: develop
            local_checkout: ~/cosmos-docgen
          - organization: datacosmos-br
            repository: cosmos-main
            branch: develop
            local_checkout: ~/cosmos-main
          - organization: marlonsc
            repository: invest
            branch: main
            local_checkout: ~/invest
      verbs:
        - name: help
          description: Show the complete selector-free public interface.
          requires_apply: false
        - name: setup
          description: Provision the declared environment and hooks.
          requires_apply: false
        - name: deps
          description: Upgrade, lock, and conform every declared dependency.
          requires_apply: true
        - name: build
          description: Build the project distribution artifacts.
          requires_apply: true
        - name: check
          description: Run every configured non-test gate.
          requires_apply: true
        - name: test
          description: Run the complete suite through the persistent testmon cache.
          requires_apply: true
        - name: fmt
          description: Apply ruff format --preview and ruff check --fix --unsafe-fixes --preview. Ruff is the rule; change code, never ruff.
          requires_apply: true
        - name: fix
          description: Apply ruff check --fix --unsafe-fixes --preview plus every other configured safe correction. Ruff is the rule; change code, never ruff.
          requires_apply: true
        - name: fix-enforcement
          description: Apply the safe fix actions declared by the enforcement catalog.
          requires_apply: true
        - name: audit
          description: Inspect ownership, dependency, and generated-state health.
          requires_apply: false
        - name: status
          description: Report the resolved runtime and repository state.
          requires_apply: false
        - name: docs
          description: Generate, repair, build, and validate documentation.
          requires_apply: true
        - name: clean
          description: Remove every declared disposable artifact.
          requires_apply: true
        - name: release-plan
          description: Resolve the release decision through the public protocol.
          requires_apply: true
        - name: release-version
          description: Materialize the planned version.
          requires_apply: true
        - name: release-tag
          description: Tag the verified release commit.
          requires_apply: true
        - name: release-build
          description: Build the release receipt and artifacts.
          requires_apply: true
        - name: publication
          description: Publish only receipt-attested release artifacts.
          requires_apply: true
        - name: gen
          description: Regenerate every managed projection atomically.
          requires_apply: true
        - name: conform
          description: Prove generated projections are at their fixed point.
          requires_apply: true
        - name: initialize
          description: Materialize the declared package initializer graph.
          requires_apply: true
        - name: mod
          description: Apply the declared structural codemods.
          requires_apply: true
        - name: waza
          description: Validate provider-neutral governance semantics with Waza.
          requires_apply: true
        - name: duplication
          description: Run the canonical jscpd duplicate-code gate.
          requires_apply: true
      custom_handler_profile_overrides: {}
      custom_handler_policy:
        filename: custom.mk
        # Custom behavior is one private whole-verb replacement or one lifecycle
        # hook. Selector-specific handlers are prohibited because public verbs are
        # already the complete operation and APPLY=Y is their sole mutation input.
        target_pattern: "^((pre|post)-[a-z][a-z0-9-]*|_custom-[a-z][a-z0-9-]*)$"
        allow_public_targets: false
        allow_toolchain_declarations: false

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - {name: __pycache__, source_scan_ignore: true}
      - {name: __pyrefly_virtual__}
      - {name: .agents}
      - {name: .beads}
      - {name: .benchmarks}
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - {name: .bkp}
      - {name: .cache, source_scan_ignore: true}
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - {name: .claude, source_scan_ignore: true}
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - {name: .direnv, source_scan_ignore: true}
      - {name: .dolt}
      - {name: .dolt_dropped_databases}
      - {name: .doltcfg}
      - {name: .hypothesis}
      - {name: .git, gitignore: false, source_scan_ignore: true}
      - {name: .mypy_cache, source_scan_ignore: true}
      - {name: .omo}
      - {name: .pylance_cache, vscode_exclude: false}
      - {name: .pytest_cache, source_scan_ignore: true}
      - {name: .test-tmp, source_scan_ignore: true}
      - {name: .test-runtime, source_scan_ignore: true}
      - {name: .testmondata, is_dir: false, source_scan_ignore: true}
      - {name: .testmondata-wal, is_dir: false, source_scan_ignore: true}
      - {name: .testmondata-shm, is_dir: false, source_scan_ignore: true}
      - {name: .reports, source_scan_ignore: true}
      - {name: .ropeproject}
      - {name: .ruff_cache, source_scan_ignore: true}
      - {name: .scope}
      - {name: .serena}
      - {name: .sisyphus}
      - {name: .state}
      - {name: .superpowers}
      - {name: .trash}
      - {name: .turbo}
      - {name: .venv, source_scan_ignore: true}
      - {name: .venv.*}
      - {name: "*.egg-info", vscode_exclude: false}
      - {name: build, source_scan_ignore: true}
      - {name: dist, source_scan_ignore: true}
      - {name: node_modules, source_scan_ignore: true}
      - {name: site, watch_exclude: false}
      - {name: target}
      - {name: .pyrefly_cache, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: .tox, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: conftest.py, is_dir: false, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: dist-packages, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: legado, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: site-packages, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: vendor, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      - {name: venv, gitignore: false, vscode_exclude: false, watch_exclude: false, source_scan_ignore: true}
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      # NOTA: .flext-deps foi removido — o cutover para fontes git eliminou o
      # cache, e o gate de actions proibe qualquer referencia ao mecanismo.
      - {name: .flext-sync.lock, is_dir: false, vscode_exclude: false, watch_exclude: false}
      - {name: .sync.lock, is_dir: false, vscode_exclude: false, watch_exclude: false}
      - {name: .planning, vscode_exclude: false, watch_exclude: false}
      - {name: skill-create-output, vscode_exclude: false, watch_exclude: false}
      - {name: .debug-journal.md, is_dir: false, vscode_exclude: false, watch_exclude: false}
      - {name: .mcp.json, is_dir: false, vscode_exclude: false, watch_exclude: false}
      - {name: CLAUDE.local.md, is_dir: false, vscode_exclude: false, watch_exclude: false}

    vscode:
      # Canonical .vscode/settings.json content injected with owner semantics:
      # scalar/list keys and artifact maps are exact; explicitly declared
      # non-artifact maps retain project extensions. Recursive "**" venv search
      # globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.autoFormatStrings: true
        python.analysis.autoImportCompletions: true
        python.analysis.completeFunctionParens: true
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.analysis.findRefsInBackgroundThread: false
        python.analysis.generateWithTypeAnnotation: true
        python.analysis.gotoOverrideCodeLens: false
        python.analysis.includeAliasesFromUserFiles: false
        python.analysis.includeExtraPathSymbolsInSymbolSearch: false
        python.analysis.includeVenvInWorkspaceSymbols: false
        python.analysis.useNearestConfiguration: false
        python.analysis.usePerProjectEnvironments: false
        python.analysis.userFileIndexingLimit: 2000
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.languageServer: Pylance
        python.pyrefly.diagnosticMode: workspace
        python.pyrefly.disableLanguageServices: true
        python.pyrefly.disableTypeErrors: false
        python.pyrefly.syncNotebooks: false
        python.testing.pytestEnabled: false
        python.testing.unittestEnabled: false
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        python.useEnvironmentsExtension: false
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        pyrefly.lspPath: ${workspaceFolder}/.venv/bin/pyrefly
        markdownlint.configFile: .markdownlint.json
        shellcheck.useWorkspaceRootAsCwd: true
        shellcheck.useRepositoryRootAsCwd: true
        git.autoRepositoryDetection: subFolders
        git.detectSubmodules: true
        git.detectSubmodulesLimit: 100
        git.openRepositoryInParentFolders: always
        git.repositoryScanMaxDepth: 2
        githubPullRequests.autoRepositoryDetection: true
        githubPullRequests.ignoreSubmodules: false
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
        ruff.interpreter:
          - ${workspaceFolder}/.venv/bin/python
        ruff.path:
          - ${workspaceFolder}/.venv/bin/ruff
        markdownlint.lintWorkspaceGlobs:
          - "!**/.git/**"
          - "!**/.planning/**"
          - "!**/.reports/**"
          - "!**/.venv/**"
          - "!**/*.code-search"
          - "!**/bower_components/**"
          - "!**/build/**"
          - "!**/dist/**"
          - "!**/node_modules/**"
          - "!**/output/**"
          - "!**/tmp/**"
          - "!**/vendor/**"
          - "**/*.{md,mkd,mdwn,mdown,markdown,markdn,mdtxt,mdtext,workbook}"
        yaml.disableSchemaDetection:
          - "**/.github/workflows/*.yml"
          - "**/.github/workflows/*.yaml"
          - "**/.gitea/workflows/*.yml"
          - "**/.gitea/workflows/*.yaml"
          - "**/.forgejo/workflows/*.yml"
          - "**/.forgejo/workflows/*.yaml"
      map_union_settings:
        "[python]":
          diffEditor.ignoreTrimWhitespace: true
          editor.defaultFormatter: charliermarsh.ruff
          editor.formatOnSave: true
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - base.mk
        - custom.mk
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
        - mkdocs.yml
        - uv.lock
      canonical_root_dotfiles:
        - .gitignore
        - .gitattributes
        - .gitmodules
        - .envrc
        - .env.example
        - .python-version
        - .pre-commit-config.yaml
        - .mise.toml
        - .mcp.json
        - .waza.yaml
        - .sonarcloud.properties
        - sonar-project.properties
      canonical_root_dirs:
        - bin
        - src
        - tests
        - docs
        - examples
        - scripts
        - config
        - ci
        - dist
        - docker
        - dbt_packages
        - ast-grep-rules
      # Per-project-type extra canonical root files; the profile of a project
      # is resolved by matching its name against profile_project_patterns.
      profile_extra_root_files:
        dbt:
          - dbt_project.yml
          - packages.yml
          - profiles.yml
          - package-lock.yml
        meltano:
          - meltano.yml
          - docker-compose.test.yml
          - dbt_project.yml
      profile_project_patterns:
        dbt:
          - flext-dbt-*
        meltano:
          - flext-meltano
          - flext-tap-*
      # Root documentation directories moved under <docs_target>/<name>/.
      move_docs_dirs:
        - api-reference
        - architecture
        - guides
        - releases
        - roadmap
        - standards
        - development
        - improvements
        - refactor
        - refactoring
        - maintenance
        - integration
        - adr
        - diagrams
        - api
        - configuration
        - notebook
        - getting-started
        - troubleshooting
        - testing
        - overview
        - docs-finais
        - authoring
        - ARCHITECTURE
        - OPERATIONS
        - STANDARDS
        - DEVELOPMENT
        - API
        - CODEMAPS
        - RELEASES
        - apresentacoes
        - solutions
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
        - troubleshooting.md
        - quick-start.md
        - overview.md
        - integration.md
        - c4-model.md
        - TODOS.md
        - TODO.md
        - REFACTOR_STATUS.md
        - DOCUMENTATION_UPDATE_SUMMARY.md
        - CONTRACT_BUDGET.md
        - DUPLICATION-DETECTION.md
        - HOOK_WARNINGS.md
        - PLUGIN-ARCHITECTURE.md
        - RULE_MODIFICATION.md
        - TESTING_WARNING_SYSTEM.md
        - FLEXT_0_12_BEADS_LANE_REORGANIZATION_PLAN.md
        - cosmos-docgen_FLEXT_BEADS_LANE_REORGANIZATION_PLAN.md
      # Sample data files moved under <examples_target>/.
      move_example_files:
        - directory.ldif
        - oid_schema.ldif
        - config.json.example
      # Diagram sources moved under <diagrams_target>/.
      move_diagram_globs:
        - "*.puml"
      # Root entries archived into <archive_root>/<project>/ (never deleted).
      # Names match files or directories; globs use fnmatch semantics.
      archive_names:
        - $OUT
        - max
        - "=4.0.0"
        - "=4.0.0,"
        - nohup.out
        - poetry.lock
        - history
        - history.json
        - index.md.bak-legacy-docs-layout
        - dbt_project_migrated.yml
        - processed_directory.ldif
        - output.ldif
        - replace_list.yml
        - maintenance_config.yaml
        - rules.json
        - output
        - logs
        - complete_pipeline_results
        - legado
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Content submodule trees and agent law dirs are out of product-docs relocate.
      # .agents is already skipped via allow_hidden (dotdir); data/ is explicit.
      special_root_dirs:
        - data
      # External reference corpora (same class as docs/references/**).
      reference_root_dirs:
        - external-docs
      # Per-project overrides: extra archives (with the matching .gitignore
      # additions), explicit nested moves, and empty-directory archives.
      # Project-specific entries live in config/codegen-overrides.yaml so
      # codegen.yaml stays an immutable fleet-wide rule set.
      project_overrides: {}

