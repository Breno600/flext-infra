Infra:
  codegen:
    # NOTE(mro-wkii.17.5, agent implement_manifest): declarative SSOT for deterministic project conformance.
    version: 1

    toolchain:
      # Single-source Python minor line. The environment resolves the newest
      # compatible 3.13 patch; no patch is pinned in generated repositories.
      # Derived as computed fields on ToolchainSpec:
      #   python_required_version -> >=3.13,<3.14
      # uv is supplied by the caller environment and is deliberately not pinned.
      # Dependency floors live in pyproject; uv.lock owns resolved versions.
      python_version: "3.13"
      uv_link_mode: copy
      # Supply-chain cooldown: refuse packages newer than this relative window
      # (CWE-829 / uv dependency cooldowns). Projected to every [tool.uv].
      uv_exclude_newer: "7 days"
      uv_exclude_newer_package:
        mypy: "2026-08-15T03:04:00Z"
      # Non-Python toolchain pins consumed by generated .mise.toml and CI.
      kubectl_version: "1.32.0"
      helm_version: "3.19.4"
      kind_version: "0.31.0"
      taplo_version: "0.10.0"
      ast_grep_version: "0.45.0"
      gitleaks_version: "8.30.1"
      tokei_version: "14.0.0"
      qlty_version: "0.642.0"
      mise_version: "2026.7.16"
      # Go runtime for the Go projects in this workspace.
      go_version: "1.26.5"
      # bd is distributed by the governed fork marlon-costa-dc/beads, which owns
      # the fork-only customizations merged --no-ff with the newest upstream
      # gastownhall/beads main. Upstream releases lag the ledger schema these
      # projects run and cannot take fix-forward changes, so an upstream release
      # is never pinned directly. mise installs the published release asset
      # through the github backend, so version and reported_version are the same
      # release tag; checksum is the SHA-256 of the installed binary (verified
      # against the mise-installed release asset).
      beads:
        selector: github:marlon-costa-dc/beads
        version: "1.1.2-dc1"
        reported_version: "1.1.2-dc1"
        checksum: "06f142c0da9868d9fa956a9ca28baab93c5ac2813c2402d44f1e54992359204b"
        # Gas Town Dolt server facts: every FLEXT ledger on this host routes
        # through the Gas Town town server on :3307 (managed by `gt dolt start`).
        # Per-project mode (shared_server: false) means bd honors the per-project
        # port (3307) rather than the legacy machine-wide shared server (:3308).
        # Rendered into .beads/config.yaml and .beads/metadata.json by codegen
        # for ledger owners (workspace-root) and attached standalones (routing only).
        server:
          mode: server
          backend: dolt
          shared_server: false
          host: 127.0.0.1
          port: 3307
          user: root
          auto_commit: "on"
          idle_timeout: "0"
          export_auto: "off"
          types_custom: "agent,role,rig,convoy,slot,queue,event,message,molecule,gate,merge-request"
          types_infra: "agent,role,message"


    # Why (ai-hub-qwoc): the ast-grep project contract. Rules travel inside the
    # installed packages (flext_infra/codemod/rules via the importlib.resources
    # cascade in flext_infra/codemod/discovery.py); conform renders sgconfig.yml
    # from this SSOT only for a repository with its own hand-written rules.
    sgconfig:
      rule_dirs:
        - ast-grep-rules
      test_dirs:
        - ast-grep-rule-tests

    # actions/checkout submodules mode for every generated workflow.
    # 'false' is the safe default: the workflow GITHUB_TOKEN cannot clone
    # sibling PRIVATE repositories, so 'recursive' aborts the job at checkout
    # with "Repository not found" before any code runs. Only projects that
    # really exercise their subprojects in CI opt in through the override map.
    checkout_submodules: "false"
    checkout_submodules_overrides: {}

    # Per-distribution private workspace-member auth for CI. The default
    # GITHUB_TOKEN cannot clone sibling private repos; these projects declare
    # read-only deploy-key secrets that the generated workflow materializes
    # before `make setup` (which otherwise fails on HTTPS submodule clone).
    ci_private_submodules:
      cosmos-main:
        paths:
          - apps/cosmos-charts
          - apps/cosmos-gitops
        deploy_keys:
          - secret: CHARTS_DEPLOY_KEY
            host_alias: github-charts
            submodule: cosmos-charts
            path: apps/cosmos-charts
            ssh_url: git@github-charts:datacosmos-br/cosmos-charts.git
          - secret: GITOPS_DEPLOY_KEY
            host_alias: github.com
            submodule: cosmos-gitops
            path: apps/cosmos-gitops
            ssh_url: git@github.com:datacosmos-br/cosmos-gitops.git

    github_actions:
      checkout:
        repository: actions/checkout
        version: v7.0.1
        sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      setup-python:
        repository: actions/setup-python
        version: v7.0.0
        sha: 5fda3b95a4ea91299a34e894583c3862153e4b97
      setup-uv:
        repository: astral-sh/setup-uv
        version: v9.0.0
        sha: c771a70e6277c0a99b617c7a806ffedaca235ff9
      mise:
        repository: jdx/mise-action
        version: v4.2.4
        sha: 7e36c90d9ab29c415a2384db3006f3ec8a8cc654
      kind:
        repository: helm/kind-action
        version: v1.14.0
        sha: ef37e7f390d99f746eb8b610417061a60e82a6cc
      upload-artifact:
        repository: actions/upload-artifact
        version: v7.0.1
        sha: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      cache:
        repository: actions/cache
        version: v6.1.0
        sha: 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      configure-pages:
        repository: actions/configure-pages
        version: v6.0.0
        sha: 45bfe0192ca1faeb007ade9deae92b16b8254a0d
      upload-pages-artifact:
        repository: actions/upload-pages-artifact
        version: v5.0.0
        sha: fc324d3547104276b827a68afc52ff2a11cc49c9
      deploy-pages:
        repository: actions/deploy-pages
        version: v5.0.0
        sha: cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

    # Managed destinations a project owns as hand-written source. A managed
    # destination outside a project's profile is pruned as an orphan
    # projection, which is right while the path only ever holds a projection.
    # Where the repository genuinely owns the file, the prune deletes real
    # source on every `make gen`. The claim is ignored the moment the file
    # carries the generated header, so retired projections are still pruned.
    managed_destination_ownership:
      # cosmos-charts publishes its own Helm charts to GHCR from conventional
      # commits via helm-semver. That release workflow is not the workspace-root
      # release projection and must survive gen.
      - project: cosmos-charts
        destinations:
          - .github/workflows/release.yml

    uv_exclude_dependencies:
      # Standalone CI installs the project editable while sibling flext packages
      # declare the same package via git+https@integration. uv rejects that as
      # conflicting URLs. Scope official exclude-dependencies to the reverse
      # edges only; every other transitive dependency stays in resolution.
      - project: flext-infra
        package:
          name: flext-tests
        dependencies: [flext-infra]
      - project: flext-core
        package:
          name: flext-infra
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-tests
        dependencies: [flext-core]
      - project: flext-core
        package:
          name: flext-cli
        dependencies: [flext-core]
      - project: flext-cli
        package:
          name: flext-infra
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-core
        dependencies: [flext-cli]
      - project: flext-cli
        package:
          name: flext-tests
        dependencies: [flext-cli]
      - project: flext-tests
        package:
          name: flext-infra
        dependencies: [flext-tests]

    providers:
      - name: flext-sh
        organization: flext-sh
        base_url: https://github.com/flext-sh
        branch: 0.12.0-dev
      # External consumer organization: standalone repositories governed by
      # conform through their own config/workspace.yaml. A linha de integracao
      # e 'develop', fixada pela ADR-134 do operador, que proibe 'dev' e
      # 'master' como sinonimos. Verificado na API do GitHub em 2026-08-03:
      # cosmos-main, cosmos-charts e cosmos-gitops tem default_branch=develop
      # e nenhum deles publica 'dev' (GET /branches/dev responde 404).
      - name: datacosmos-br
        organization: datacosmos-br
        base_url: https://github.com/datacosmos-br
        branch: develop
    branch_policy:
      technical_branch_patterns:
        - __dolt_remote_info__
        - dolt/*
        - gh-readonly-queue/*
      # FLEXT branch model: main is the produced release (tagged + published to
      # PyPI) and 0.20.0-dev is the future line on hold. Both must carry the
      # current development line, so both are gated. Parked releases (0.10.0-dev,
      # 0.11.0-dev), snapshots and lane branches are inventoried but never gated.
      governed_branch_patterns:
        - main
        - 0.12.0-dev
        - 0.20.0-dev
    profiles:
      - name: workspace-root
        environment_scope: root
        setup_scope: root-and-members
        execution_scope: root
        discovery_scope: manifest
      - name: standalone
        environment_scope: self
        setup_scope: self
        execution_scope: self
        discovery_scope: none

    make:
      selector: WHAT
      # Why (mro-dipb): adaptive testmon GitHub Actions cache policy.
      # save_enabled stays false while storage-limit API returns HTTP 402 /
      # flext-infra sits near the default Actions cache ceiling (QUOTA_HOLD).
      testmon_cache:
        schema_version: 1
        mode: bootstrap
        save_enabled: false
        max_bootstrap_generations: 3
        max_stable_generations: 2
        per_repo_budget_bytes: 536870912
        warning_threshold_percent: 70
        maintenance_threshold_percent: 75
        block_threshold_percent: 80
        allowed_save_refs: [refs/heads/0.12.0-dev]
        key_prefix: testmon-v1
      apply_variable: APPLY
      apply_value: Y
      apply_absent_value: N
      ci:
        variable: CI
        value: Y
        # The local form of the same ternary. Mirrors apply_absent_value so no
        # surface spells a bare "N": pre_push declares CI explicitly instead of
        # relying on the token being unset, because a git hook inherits the
        # invoking environment and a stray CI=Y from the caller would otherwise
        # revoke pytest and the type-checker gates on a push.
        local_value: N
        # RULING 2 (rules not skip-list): local_check_gates is the ONLY declared
        # set — the slow whole-program type checkers. CI=N (pre-push) runs
        # exactly this set; CI=Y runs its strict complement derived in
        # MakeCiSpec.check_gates (never a second list); an unset CI runs every
        # allowed gate, always.
        # RULING 1: CI is ternary (Y/N/absent). CI=Y revokes pytest; CI=N runs
        # full pytest+coverage; absent=testmon incremental.
        local_check_gates: [pyrefly, mypy]
        # Wall-clock budget per verb/what/project for each CI form: CI=Y owns
        # the fast gates; measured reality 2026-08-18: full CI=Y gate set
        # (lint pyright security markdown smells) needs ~130-150s wall
        # with current security scan duration, so 300s matches CI=N and
        # gives both tokens the same budget with different gate scopes.
        # CI=N owns the slow whole-program analyses and full pytest (300s each).
        verb_timeout_seconds: 300
        local_verb_timeout_seconds: 300
      work_in_progress:
        # Operator law (mro-g3zl2): pre-push gates skip WIP branches and GitHub
        # draft PRs; merges into dev/develop/0.12.0-dev are blocked for those states.
        draft_pr: true
        branch_patterns:
          - '^wip/'
          - 'WIP'
        merge_lock_target_branches:
          - dev
          - develop
          - 0.12.0-dev

      workflow:
        # Why: pre-commit remains fast and mutation-only; pre-push owns the
        # generated-artifact and read-only validation gates.
        - {
            verb: setup,
            apply: false,
            contexts: [local, ci, pre_commit, pre_push],
          }
        - {
            verb: gen,
            apply: true,
            contexts: [local, ci, pre_commit, pre_push],
          }
        - {
            verb: fmt,
            apply: true,
            contexts: [local, ci, pre_commit, pre_push],
          }
        - {
            verb: fix,
            apply: true,
            contexts: [local, ci, pre_commit, pre_push],
          }
        # R9: markdown gate never skipped — a docs defect is a defect in every context.
        - {
            verb: check,
            apply: false,
            contexts: [local, ci, pre_commit, pre_push],
          }
        # Why (mro-v4p5): CI must not execute pytest. Pre-push resets testmon and
        # then runs WHAT=full, the complete-suite gate: testmon OFF so every test
        # executes, coverage ON so the measured number covers the whole suite.
        # WHAT=all (incremental testmon, --no-cov) stays the local default.
        - {
            verb: test,
            what: cache-clear,
            apply: true,
            contexts: [local, pre_push],
          }
        - { verb: test, what: full, apply: false, contexts: [local, pre_push] }
      bootstrap:
        environment: isolated
        dependency_groups: all
        extras: all
      # Why (mro-clean): stale caches and traces are not cosmetic - they cause
      # FALSE DIAGNOSES. A stale __pycache__ produced a pydantic ValidationError
      # traceback for source that was already correct, and stale .reports made a
      # green suite look failed. `clean` owns the full disposable set as DATA so
      # no recipe hardcodes it and every project cleans identically.
      clean:
        # Directories removed anywhere under the tree.
        cache_dirs:
          - __pycache__
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - .pyrefly_cache
          - .benchmarks
          - .hypothesis
        # Directories removed at the project root only.
        root_dirs:
          - build
          - dist
          - htmlcov
          - .reports
        # Files removed at the project root only.
        root_files:
          - .coverage
          - .testmondata
        # Trace/profile artifacts removed anywhere under the tree.
        trace_globs:
          - "*.pstats"
          - "*.prof"
          - ".coverage.*"
      docs:
        reports_dir: .reports/docs
        cross_project_relative_link_pattern: '^(?:\.\./)+flext-[a-z0-9-]+(?:/|$)'
        stale_github_organizations:
          - organization
        github_repos:
          - organization: flext-sh
            repository: flext
            branch: 0.12.0-dev
            local_checkout: ~/flext
          - organization: flext-sh
            repository: flext-core
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-core
          - organization: flext-sh
            repository: flext-infra
            branch: 0.12.0-dev
            local_checkout: ~/flext/flext-infra
          - organization: datacosmos-br
            repository: ai-hub
            branch: develop
            local_checkout: ~/.ai-hub
          - organization: datacosmos-br
            repository: cosmos-docgen
            branch: develop
            local_checkout: ~/cosmos-docgen
          - organization: datacosmos-br
            repository: cosmos-main
            branch: develop
            local_checkout: ~/cosmos-main
          - organization: marlonsc
            repository: invest
            branch: main
            local_checkout: ~/invest
      verbs:
        - name: help
          default_what: usage
          whats: [usage]
          apply_guarded: false
        - name: setup
          default_what: environment
          whats: [environment]
          apply_guarded: false
        - name: deps
          default_what: check
          whats: [check, lock, upgrade]
          # `lock` and `upgrade` rewrite the lockfile and call _require_apply,
          # so declaring the verb unguarded made them unreachable: the dispatch
          # rejected APPLY=Y while the recipe demanded it.
          apply_guarded: true
          apply_what: upgrade
        - name: build
          default_what: artifacts
          whats: [artifacts]
          apply_guarded: false
        - name: check
          default_what: all
          whats: [all]
          apply_guarded: false
        - name: test
          default_what: all
          # all = incremental testmon run; cache-* maintain .testmondata locally.
          # Incremental subsets never enforce global coverage, because a number
          # computed from an impacted subset is not the suite's coverage.
          # full = the complete-suite gate: testmon OFF, coverage ON. Pre-push
          # runs it so the measured number covers every test.
          # profile = one explicit focused cProfile run (FILE and/or MATCH required).
          # Normal all/full gates run pytest directly so profiling overhead cannot
          # consume the suite's fixed execution budget.
          whats:
            [all, full, profile, cache-status, cache-clear, cache-checkpoint]
          apply_guarded: false
          accepts_apply: true
          apply_what: all
        - name: fmt
          default_what: check
          whats: [check, all, apply]
          apply_guarded: true
          apply_what: apply
        - name: fix
          default_what: check
          whats: [check, all, apply]
          apply_guarded: true
          apply_what: apply
        - name: run
          default_what: default
          whats: [default]
          apply_guarded: false
          accepts_apply: true
          apply_what: default
        - name: status
          default_what: diagnostics
          whats: [diagnostics]
          apply_guarded: false
        - name: clean
          default_what: status
          whats: [status, generated]
          # `clean generated` deletes generated output and calls _require_apply.
          apply_guarded: true
          apply_what: generated
        - name: release
          default_what: status
          # `rel` drives the release orchestrator (validate/version/build/publish)
          # and mutates the tree, so it calls _require_apply. `status` is the
          # read-only fixed-point and stays the default WHAT.
          whats: [status, rel]
          apply_guarded: true
          apply_what: rel
        - name: gen
          default_what: check
          whats: [check, all, apply]
          apply_guarded: true
          apply_what: apply
        - name: work
          default_what: status
          whats: [start, status, land, finish]
          # start/land/finish mutate lane state and call _require_apply;
          # only status is read-only, so it stays the default WHAT.
          apply_guarded: true
          apply_what: land
        - name: mod
          default_what: check
          whats: [check, all, apply]
          # `mod` batch-applies the sgconfig ast-grep rules under the
          # ruff/pyrefly rollback circuit (checkpoint + re-measure); check is
          # the read-only dry-run fixed-point after mutation.
          apply_guarded: true
          apply_what: apply
      custom_handler_policy:
        filename: custom.mk
        # Why (ai-hub-qwoc): the generated Makefile's _dispatch macro routes every
        # unknown WHAT to a `_custom_<verb>_<what>` handler -- that IS the canonical
        # extension mechanism for new WHATs, distinct from pre-/post- lifecycle hooks.
        # The validator must accept both shapes the runtime itself dispatches to, or
        # every project that defines a custom WHAT handler fails `codegen conform`.
        target_pattern: "^((pre|post)-(help|setup|deps|build|check|test|fmt|fix|run|status|clean|release|gen|work|mod)(-[a-z0-9][a-z0-9-]*)?|_custom_(help|setup|deps|build|check|test|fmt|fix|run|status|docs|clean|release|gen|work|mod)_[a-z0-9][a-z0-9_-]*)$"
        allow_public_targets: false
        allow_toolchain_declarations: false
      custom_handler_profile_overrides:
        workspace-root:
          allow_public_targets: true
          allow_toolchain_declarations: true

    # NOTE (mro-jnm1.1 / mro-jnm1.4): SINGLE SSOT for ephemeral/generated
    # resources. VS Code files.exclude/search.exclude (vscode_exclude),
    # files.watcherExclude (watch_exclude), and source_scan.ignored_resources
    # (source_scan_ignore) are DERIVED from this list by CodegenConfigSpec
    # computed fields. Add a tool cache/build dir here only — never in the
    # consuming projections. Ordering reproduces the historical derived maps.
    artifacts:
      - { name: __pycache__, source_scan_ignore: true }
      - { name: __pyrefly_virtual__ }
      - { name: .agents }
      - { name: .beads }
      - { name: .benchmarks }
      # mro-0wuz: archive-not-delete target for the layout engine; the generated
      # .gitignore projection must never track archived loose files.
      - { name: .bkp }
      - { name: .cache, source_scan_ignore: true }
      # mro-j47u: agent worktrees are duplicate repositories, never production input.
      - { name: .claude, source_scan_ignore: true }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; .direnv keeps the legacy vscode/
      # watch/source-scan projections (order-sensitive, after .claude).
      - { name: .direnv, source_scan_ignore: true }
      - { name: .code-review-graph }
      - { name: .codegraph }
      - { name: .dolt }
      - { name: .dolt_dropped_databases }
      - { name: .doltcfg }
      - { name: .hypothesis }
      - { name: .git, gitignore: false, source_scan_ignore: true }
      - { name: .mypy_cache, source_scan_ignore: true }
      - { name: .omo }
      - { name: .pylance_cache, vscode_exclude: false }
      - { name: .pytest_cache, source_scan_ignore: true }
      - { name: .testmondata, is_dir: false, source_scan_ignore: true }
      - { name: .testmondata-wal, is_dir: false, source_scan_ignore: true }
      - { name: .testmondata-shm, is_dir: false, source_scan_ignore: true }
      - { name: .reports, source_scan_ignore: true }
      - { name: .ropeproject }
      - { name: .ruff_cache, source_scan_ignore: true }
      - { name: .scope }
      - { name: .serena }
      - { name: .sisyphus }
      - { name: .state }
      - { name: .superpowers }
      - { name: .trash }
      - { name: .turbo }
      - { name: .venv, source_scan_ignore: true }
      - { name: .venv.* }
      - { name: .worktrees, source_scan_ignore: true }
      - { name: "*.egg-info", vscode_exclude: false }
      - { name: build, source_scan_ignore: true }
      - { name: dist, source_scan_ignore: true }
      - { name: node_modules, source_scan_ignore: true }
      - { name: site, watch_exclude: false }
      - { name: target }
      - {
          name: .pyrefly_cache,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: .tox,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: conftest.py,
          is_dir: false,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: dist-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: legado,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: site-packages,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: vendor,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      - {
          name: venv,
          gitignore: false,
          vscode_exclude: false,
          watch_exclude: false,
          source_scan_ignore: true,
        }
      # mro-jnm1.2: gitignore-only entries absorbed from the removed
      # REQUIRED_GITIGNORE_ENTRIES constant; they feed no other projection.
      # NOTA: .flext-deps foi removido — o cutover para fontes git eliminou o
      # cache, e o gate de actions proibe qualquer referencia ao mecanismo.
      - {
          name: .flext-sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .sync.lock,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - { name: .planning, vscode_exclude: false, watch_exclude: false }
      - {
          name: skill-create-output,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .debug-journal.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: .mcp.json,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }
      - {
          name: CLAUDE.local.md,
          is_dir: false,
          vscode_exclude: false,
          watch_exclude: false,
        }

    vscode:
      # Canonical .vscode/settings.json content injected with merge semantics:
      # scalar/list keys are enforced, map keys are union-merged (project entries
      # are preserved). Recursive "**" venv search globs are forbidden: they make
      # the Python Environments locator (pet) walk entire repository trees and
      # hang interpreter discovery on large monorepos.
      scalar_settings:
        files.autoSave: afterDelay
        python.analysis.diagnosticMode: workspace
        python.analysis.typeCheckingMode: strict
        python.defaultInterpreterPath: ${workspaceFolder}/.venv/bin/python
        python.terminal.activateEnvInCurrentTerminal: true
        python.terminal.activateEnvironment: true
        ruff.configurationPreference: filesystemFirst
        ruff.format.preview: true
        ruff.importStrategy: fromEnvironment
        ruff.lint.preview: true
        ruff.nativeServer: on
        shellcheck.useWorkspaceRootAsCwd: true
      list_settings:
        python-envs.workspaceSearchPaths:
          - ./.venv
          - ./*/.venv
      map_union_settings:
        python.analysis.diagnosticSeverityOverrides:
          reportUntypedBaseClass: none
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv

    # NOTE(mro-0wuz, epic mro-hzox): declarative project-layout SSOT consumed by
    # the layout engine (codegen/layout.py) and the layout quality gate. Every
    # move/archive/gitignore decision derives from this section — the engine
    # carries zero hardcoded layout knowledge. severity=warning keeps the gate
    # report-only; flipping to error makes violations fail the check pipeline.
    layout:
      version: 1
      severity: warning
      # Archive-not-delete root: archived entries land in <archive_root>/<project>/.
      archive_root: .bkp
      docs_target: docs
      examples_target: examples
      diagrams_target: docs/diagrams
      allow_hidden: true
      canonical_root_files:
        - pyproject.toml
        - Makefile
        - base.mk
        - custom.mk
        - README.md
        - LICENSE
        - CHANGELOG.md
        - CONTRIBUTING.md
        - AGENTS.md
        - CLAUDE.md
        - conftest.py
        - mkdocs.yml
        - uv.lock
        - sgconfig.yml
      canonical_root_dotfiles:
        - .gitignore
        - .gitattributes
        - .gitmodules
        - .envrc
        - .env.example
        - .python-version
        - .pre-commit-config.yaml
        - .mise.toml
        - .mcp.json
        - .waza.yaml
        - .sonarcloud.properties
        - sonar-project.properties
      canonical_root_dirs:
        - src
        - tests
        - docs
        - examples
        - scripts
        - config
        - ci
        - dist
        - docker
        - dbt_packages
        - ast-grep-rules
      # Per-project-type extra canonical root files; the profile of a project
      # is resolved by matching its name against profile_project_patterns.
      profile_extra_root_files:
        dbt:
          - dbt_project.yml
          - packages.yml
          - profiles.yml
          - package-lock.yml
        meltano:
          - meltano.yml
          - docker-compose.test.yml
          - dbt_project.yml
      profile_project_patterns:
        dbt:
          - flext-dbt-*
        meltano:
          - flext-meltano
          - flext-tap-*
      # Root documentation directories moved under <docs_target>/<name>/.
      move_docs_dirs:
        - api-reference
        - architecture
        - guides
        - releases
        - roadmap
        - standards
        - development
        - improvements
        - refactor
        - refactoring
        - maintenance
        - integration
        - adr
        - diagrams
        - api
        - configuration
        - notebook
        - getting-started
        - troubleshooting
        - testing
        - overview
        - docs-finais
        - authoring
        - ARCHITECTURE
        - OPERATIONS
        - STANDARDS
        - DEVELOPMENT
        - API
        - CODEMAPS
        - RELEASES
        - apresentacoes
        - solutions
      # Root Markdown documents moved under <docs_target>/.
      move_docs_files:
        - index.md
        - getting-started.md
        - configuration.md
        - development.md
        - architecture.md
        - api-reference.md
        - testing.md
        - troubleshooting.md
        - quick-start.md
        - overview.md
        - integration.md
        - c4-model.md
        - TODOS.md
        - TODO.md
        - REFACTOR_STATUS.md
        - DOCUMENTATION_UPDATE_SUMMARY.md
        - CONTRACT_BUDGET.md
        - DUPLICATION-DETECTION.md
        - HOOK_WARNINGS.md
        - PLUGIN-ARCHITECTURE.md
        - RULE_MODIFICATION.md
        - TESTING_WARNING_SYSTEM.md
        - FLEXT_0_12_BEADS_LANE_REORGANIZATION_PLAN.md
        - cosmos-docgen_FLEXT_BEADS_LANE_REORGANIZATION_PLAN.md
      # Sample data files moved under <examples_target>/.
      move_example_files:
        - directory.ldif
        - oid_schema.ldif
        - config.json.example
      # Diagram sources moved under <diagrams_target>/.
      move_diagram_globs:
        - "*.puml"
      # Root entries archived into <archive_root>/<project>/ (never deleted).
      # Names match files or directories; globs use fnmatch semantics.
      archive_names:
        - $OUT
        - max
        - "=4.0.0"
        - "=4.0.0,"
        - nohup.out
        - poetry.lock
        - history
        - history.json
        - index.md.bak-legacy-docs-layout
        - dbt_project_migrated.yml
        - processed_directory.ldif
        - output.ldif
        - replace_list.yml
        - maintenance_config.yaml
        - rules.json
        - output
        - logs
        - complete_pipeline_results
        - legado
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Content submodule trees and agent law dirs are out of product-docs relocate.
      # .agents is already skipped via allow_hidden (dotdir); data/ is explicit.
      special_root_dirs:
        - data
      # External reference corpora (same class as docs/references/**).
      reference_root_dirs:
        - external-docs
      # Per-project overrides: extra archives (with the matching .gitignore
      # additions), explicit nested moves, and empty-directory archives.
      project_overrides:
        flext-cli:
          archive_names:
            - settings.json
          gitignore_additions:
            - settings.json
        flext-core:
          archive_names:
            - config.json
        flext-tap-oracle-wms:
          archive_names:
