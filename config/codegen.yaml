      ping_example:
        command_name: ping
        help_text: Return the configured health response.
        success_message: pong
        enabled_default: true
        reply: pong
        disabled_reply: disabled
      # The first section is merged AFTER the artifact-SSOT derived patterns by
      # the CodegenConfigSpec.gitignore_sections projection (deduplicated, SSOT
      # wins); declare here only what the SSOT cannot express (file globs,
      # secrets, editor/OS noise).
      gitignore_sections:
        - name: "BLOCK EVERYTHING BY DEFAULT"
          profiles: [workspace]
          patterns:
            - "/*"
            - "/*/"
            - "!/LICENSE"
      # NOTE: governed member directories are NOT declared here. They are
      # derived from the live workspace topology (`config/workspace.yaml`
      # members) by conform._render_gitignore, so declaring a member in the
      # manifest is the single source that makes it trackable. A hardcoded
      # name glob here would be a second, silently-diverging source.
        - name: "WHITELIST: Workspace Directories"
          profiles: [workspace]
          patterns:
            - "!docker/"
            - "!docs/"
            - "!examples/"
            - "!.github/"
            - "!src/"
            - "!tests/"
            - "!typings/"
            - "!libs/"
            - "!.vscode/"
            - "!.claude/"
            - "!.claude-plugin/"
        # Provider surfaces are generated governance artifacts owned by the
        # workspace root, so each provider directory is trackable exactly
        # like .claude/ and .agents/ above.
            - "!.codex/"
            - "!.codex/**"
            - "!.cursor/"
            - "!.cursor/**"
            - "!.gemini/"
            - "!.gemini/**"
            - "!.opencode/"
            - "!.opencode/**"
            - "!/config/"
            - "!.claude/CLAUDE.md"
            - "!.agents/"
            - "!.agents/**"
            - ".agents/skills/*/report.json"
        - name: "Dispatcher-based command surface (Make SSOT)"
          profiles: [workspace]
          patterns:
            - "!scripts/"
            - "scripts/*.py"
            - "scripts/*.sh"
            - "scripts/*.md"
            - "scripts/maintenance/"
        - name: "TRACK: Beads team config; keep Dolt data, runtime state, and JSONL exports local."
          profiles: [workspace, standalone]
          patterns:
            - "!.beads/"
            - ".beads/*"
            - "!.beads/config.yaml"
        # metadata.json is what bd reads to resolve the ledger. Without it
        # bd warns "no beads configuration found" and silently falls back
        # to the default database, so beads created from a clean clone land
        # in a throwaway store. In workspace and standalone
        # the file holds only facts already declared in the generated
        # config.yaml (backend/dolt_mode/dolt_database) -- no secret and no
        # per-machine value -- so it is safe to track. Members keep it
        # ignored: their embedded-mode file carries a per-machine
        # project_id UUID.
            - "!.beads/metadata.json"
        # The canonical ledger identity (the [project] id). Conform reads
        # it to render the identity-preserving metadata.json; untracked,
        # every fresh clone rendered a metadata without the id and failed
        # the gen check gate against the committed file.
            - "!.beads/identity.toml"
        - name: "Python configuration"
          profiles: [workspace]
          patterns:
            - "!pyproject.toml"
            - "!.taplo.toml"
            - "!pyrefly.toml"
            - "!poetry.lock"
            - "!uv.lock"
            - "!ruff-shared.toml"
        - name: "mise toolchain pinning"
          profiles: [workspace]
          patterns:
            - "!.mise.toml"
            - "!mise.lock"
            - "!mise.version"
            - "!.mise.lock"
            - "!.python-version"
        # Native graphs referenced by mise.lock are required by locked installs.
        # Local lockfiles and their graphs remain per-machine state.
        - name: "mise native dependency graphs"
          profiles: [workspace, standalone]
          patterns:
            - "/.mise-lock-transaction.lock"
            - "!/.mise/"
            - "/.mise/*"
            - "!/.mise/locks/"
            - "!/.mise/locks/**"
            - "/.mise/locks/*.local/"
            - "/mise*.local.lock"
            - "/.mise*.local.lock"
        - name: "Docker configuration"
          profiles: [workspace]
          patterns:
            - "!.dockerignore"
        - name: "Build and automation"
          profiles: [workspace]
          patterns:
            - "!Makefile"
            - "!Makefile.flext-docker"
            - "!*.mk"
        # jscpd detector SSOT consumed by the committed `make duplication`
        # target; the deny-first root cannot swallow it.
            - ".jscpd.json"
        # The generated toolchain config and launcher must reach a clean
        # CI checkout, so the deny-first root cannot swallow them;
        # `make gen` owns their content.
            - "!bin/mise"
            - "!bin/mise.cmd"
            - "!bin/mise-lock-transaction.py"
            - "!bin/mise-lock-converge.py"
        - name: "Documentation"
          profiles: [workspace]
          patterns:
            - "!README.md"
            - "!AGENTS.md"
            - "!codex.md"
            - "!.markdownlint.json"
            - "!.markdownlintignore"
            - "!.prettierrc"
            - "!.prettierignore"
            - "!.shellcheckrc"
        - name: "Git configuration"
          profiles: [workspace]
          patterns:
            - "!.gitignore"
            - "!.gitmodules"
            - "!.gitattributes"
        - name: "direnv environment (no secrets — venv activation only)"
          profiles: [workspace]
          patterns:
            - "!.envrc"
            - "!.envrc.local"
        - name: "Environment templates (NOT .env - keep secrets out!)"
          profiles: [workspace]
          patterns:
            - "!.env.test"
            - "!.env.example"
            - "!.env.template"
        - name: "WHITELIST: Contents Inside Allowed Directories"
          profiles: [workspace]
          patterns:
            - "!docker/**"
            - "!docs/**"
            - "!examples/**"
            - "!.github/**"
            - "!src/**"
            - "!tests/**"
            - "!typings/**"
            - "!libs/**"
            - "!.vscode/**"
            - "!.claude/**"
            - "!.claude-plugin/**"
      # NOTE: member contents are emitted by the same derived section as the
      # member directories themselves (see the note above), so both come from
      # the live workspace topology and can never diverge from each other.
      # `.claude/*` re-blocked the whole directory AFTER the whitelist above
      # had unblocked it, and in gitignore the last matching rule wins — so
      # every governed provider artifact (the skill surfaces) became
      # untrackable. Local session data is named explicitly
      # instead of re-blocking the directory that the whitelist just opened.
        - name: "BLOCK: AI/Agent Local Data (NEVER track these)"
          patterns:
            - ".claude/local/"
            - ".claude/history/"
            - ".claude/todos/"
            - ".claude/statsig/"
            - ".claude/projects/"
            - ".claude/shell-snapshots/"
            - ".claude/worktrees/"
            - ".claude/settings.local.json.bak"
      # Provider surfaces are REAL files, so the ArgoCD symlink hazard that
      # once justified blocking `.agents/` in non-root checkouts no longer
      # applies: the catalog owner materializes them via
      # generate-workspace-config and never as mode-120000 symlinks. Blocking
      # them made governed projections
      # untrackable in exactly the repositories that must carry their own
      # authorization surface.
        - name: "WHITELIST: Governed agent projections (every repository role)"
          profiles: [standalone]
          patterns:
            - "!.agents/"
            - "!.agents/**"
        - name: "WHITELIST: Agent skills owned by the workspace root"
          profiles: [workspace]
          patterns:
            - "!.agents/skills/"
            - "!.agents/skills/**"
        - name: "Skill scan reports (transient, regenerated by skill_validate.py)"
          patterns:
            - ".agents/skills/*/report.json"
      # Why: the Gas City pack runtime writes skill symlinks (`<pack>.<skill>`,
      # absolute links into its cache) and an ownership manifest into a
      # registered rig's provider trees whenever it runs. They are runtime
      # state, never source: tracked, they break every consumer that refuses
      # symlinks (the release snapshot validator rejected flext-infra's own
      # build on `.agents/skills/core.gc-agents`). Only Gas City packs project
      # dotted skill names; governed skills are kebab-case directories.
      # Why: a provider tree carries two different kinds of thing and only
      # one of them belongs to the consuming repository. Rules, skills,
      # Rules, skills, commands and agent definitions are catalog projections
      # -- the generated bytes are authoritative, customized only through a
      # config override at their owner, and tracked so a clone reproduces them
      # exactly. Per-machine configuration is not: hook wiring, governance
      # manifests and local agent settings reference machine-absolute paths of
      # whoever last ran the catalog generator, so they reach a checkout
      # as runtime state and are never recorded in any workspace. Every
      # machine-written settings/hooks surface and its digest sidecar is
      # blocked by name. No profiles key: this holds for every role.
        - name: "Agent hooks and machine-local config (runtime state, never source)"
          # settings.json projections are portable governance and stay
          # trackable; settings.local.json and the digest sidecars wire
          # machine-absolute paths, so they are named here. This block follows
          # the provider-tree whitelists and the last matching gitignore rule
          # wins.
          patterns:
            - ".github/hooks/"
            - "*/.hooks.json.agents-governance.json"
            - ".claude/*.agents-governance.json"
            - ".gemini/*.agents-governance.json"
            - ".claude/settings.local.json"
        - name: "Private local config overrides"
          patterns:
            - "/config/codegen-overrides.local.yaml"
        - name: "Gas City skill projections (runtime state, never source)"
          patterns:
            - ".agents/skills/.gc-skill-ownership.json"
            - ".agents/skills/core.gc-*"
            - ".agents/skills/gascity.*"
            - ".agents/skills/gc.*"
            - ".claude/skills/.gc-skill-ownership.json"
            - ".claude/skills/core.gc-*"
            - ".claude/skills/gascity.*"
            - ".claude/skills/gc.*"
            - ".codex/skills/.gc-skill-ownership.json"
            - ".codex/skills/core.gc-*"
            - ".codex/skills/gascity.*"
            - ".codex/skills/gc.*"
      # A registered rig also receives the Gas City runtime
      # directory (events, gate slots, scripts pinned to the city's absolute
      # path, per-session settings) and hosts its lane checkouts under
      # `<rig>/worktrees/<lane>`. Both are per-machine runtime state carrying
      # machine-absolute paths; tracked copies broke every other checkout.
        - name: "Gas City rig runtime and lane worktrees (runtime state, never source)"
          patterns:
            - ".gc/"
            - "/worktrees/"
      # A project-scoped Cursor MCP document carries a socket path resolved on
      # the machine that generated it, and the hooks runtime keeps mutable
      # scheduling state under .cursor/hooks/state: both are runtime state,
      # never source; hook and skill definitions stay versioned above.
        - name: "Machine-local MCP projection and hooks runtime state (never source)"
          patterns:
            - "/.cursor/mcp.json"
            - "/.cursor/hooks/state/"
      # None of these are root source. config/build-constraints.txt is
      # rendered by the release policy phase from
      # config.Infra.release.build_constraints; repositories never carry it.
      # *.bak are backup residue (ignore guards against interrupted runs).
        - name: "RESIDUE: never track backups or repo-local policy copies"
          profiles: [workspace, standalone]
          patterns:
            - "*.bak"
            - "config/build-constraints.txt"
        - name: "Aider AI data"
          patterns:
            - ".aider/"
            - ".aider.conf.yml"
            - ".aider.chat.history.md"
            - "**/.aider/"
      # `.cursor/` moved to the governed provider whitelist above: it now
      # carries generated hooks/skills that must be versioned. Only assistants
      # with no governed surface stay blocked here.
        - name: "Other AI assistants"
          patterns:
            - ".copilot/"
            - ".codeium/"
        - name: "Oracle dump files"
          patterns:
            - "**/*.dmp"
            - "**/*.DMP"
        - name: "Oracle logs"
          patterns:
            - "**/*.trc"
            - "**/*.aud"
        - name: "Oracle wallet files"
          patterns:
            - "**/cwallet.sso"
            - "**/ewallet.p12"
            - "**/tnsnames.ora"
            - "**/sqlnet.ora"
        - name: "Oracle test/reference data directories"
          patterns:
            - "**/oracle_data/"
            - "**/oracle_dump/"
            - "**/oracle_export/"
            - "**/oracle_import/"
            - "**/expdp_*/"
            - "**/impdp_*/"
        - name: "Python artifacts inside allowed directories"
          patterns:
            - "**/__pycache__/"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/*.pyd"
            - "**/*.so"
            - "**/*.egg"
            - "**/*.egg-info/"
            - "**/dist/"
            - "**/build/"
            - "**/.eggs/"
        - name: "Skill validation temporary reports"
          patterns:
            - "baseline.json"
            - "report.json"
            - "fix-report.json"
            - "*.rej"
        - name: "Python caches inside allowed directories"
          patterns:
            - "**/.mypy_cache/"
            - "**/.ruff_cache/"
            - "**/.pytest_cache/"
            - "**/.hypothesis/"
            - "**/.tox/"
            - "**/.nox/"
            - "**/.benchmarks/"
        - name: "Coverage reports inside allowed directories"
          patterns:
            - "**/htmlcov/"
            - "**/.coverage"
            - "**/coverage.json"
            - "**/.coverage.*"
            - "**/coverage.xml"
            - "**/*.cover"
        - name: "Docs verb report artifacts inside docs trees"
          patterns:
            - "**/docs/generate-report.md"
            - "**/docs/generate-summary.json"
            - "**/docs/fix-report.md"
            - "**/docs/fix-summary.json"
            - "**/docs/audit-report.md"
            - "**/docs/audit-summary.json"
        - name: "Virtual environments inside allowed directories (should never be committed)"
          patterns:
            - "**/.venv"
            - "**/.venv/"
            - "**/venv/"
            - "**/env/"
            - "**/ENV/"
            - "**/.virtualenv/"
        - name: "Native build artifacts inside allowed directories"
          patterns:
            - "**/*.exe"
            - "**/*.exe~"
            - "**/*.dll"
            - "**/*.dylib"
            - "**/*.test"
            - "**/*.out"
        # Anchored: only a root-level Go vendor tree is ignorable. Unanchored
        # `vendor/` also matched a vendored package inside src/ (flext-cli
        # src/flext_cli/vendor), and hatchling honours .gitignore, so the
        # published wheel silently shipped without it.
            - "/vendor/"
        - name: "Node.js inside allowed directories"
          patterns:
            - "**/node_modules/"
            - "**/npm-debug.log"
            - "**/yarn-error.log"
            - "**/.npm/"
            - "**/.yarn/"
        - name: "IDE and editor files inside allowed directories"
          patterns:
            - "**/.idea/"
            - "**/*.iml"
            - "**/.vscode/*.code-workspace"
            - "**/.vscode/internal.invalid.json"
            - "**/*.swp"
            - "**/*.swo"
            - "**/*~"
            - "**/.*.sw?"
        - name: "OS files inside allowed directories"
          patterns:
            - "**/.DS_Store"
            - "**/Thumbs.db"
            - "**/Desktop.ini"
        - name: "Temporary and log files inside allowed directories"
          patterns:
            - "**/*.log"
            - "**/*.tmp"
            - "**/*.temp"
            - "**/tmp/"
            - "**/temp/"
            - "**/.tmp/"
        - name: "Build and quality tool artifacts inside allowed directories"
          patterns:
            - "**/.qlty/*"
            - "**/.meltano/"
            - "**/.serena/"
        - name: "Backup files inside allowed directories"
          patterns:
            - "**/*.bak"
        # A safety cycle that backs a file up more than once appends its own
        # suffix (`x.bak.1`, `x.bak.20260824`), which `**/*.bak` does not match.
        # Adopted from the lane PRs that had added it to the generated
        # .gitignore of sixteen repositories; the pattern belongs here, where
        # every repository inherits it.
            - "**/*.bak.*"
            - "**/*.bkp"
            - "**/*.bkp?"
            - "**/*.backup"
            - "**/*.orig"
            - "**/*.md.backup"
            - "**/archived/"
        - name: "Autofix rejection artifacts (run_skill_autofix.sh rollback output)"
          patterns:
            - "**/*.rej-*.bak"
            - "**/*.rej-*.rej"
        - name: "Database files inside allowed directories"
          patterns:
            - "**/*.db"
            - "**/*.sqlite"
            - "**/*.sqlite3"
        - name: "Compiled files inside allowed directories"
          patterns:
            - "**/*.class"
            - "**/*.o"
            - "**/*.obj"
            - "**/*.a"
        - name: "Archive files inside allowed directories (usually shouldn't be in git)"
          patterns:
            - "**/*.zip"
            - "**/*.tar"
            - "**/*.tar.gz"
            - "**/*.tgz"
            - "**/*.rar"
            - "**/*.7z"
        - name: "Environment files with actual secrets"
          patterns:
            - ".env"
            - ".internal.invalid"
            - ".env.production"
            - ".env.development"
            - "**/.env"
        - name: "Credentials and keys"
          patterns:
            - "*.key"
            - "*.pem"
            - "*.p12"
            - "*.pfx"
            - "credentials.json"
            - "**/credentials.json"
            - "secrets.yaml"
            - "secrets.yml"
            - "**/.credentials*"
        - name: "ALLOW: Preserve Empty Directories"
          patterns:
            - "!**/.gitkeep"
        - name: "Ensure these are NEVER committed, even if explicitly added"
          patterns:
            - ".milvus/"
            - ".claude-data/"
            - ".devcontainer/.host-gitsettings"
            - ".devcontainer/.env"
            - ".github/*.rej"
        - name: "--- codegen conform: tracked owner inputs ---"
          patterns:
            - "!base.mk"
      # This final policy re-ignores .beads/* for every profile, so the
      # workspace exception for metadata.json is re-stated in a
      # workspace-scoped section immediately after it (last rule wins).
      # Members are deliberately NOT covered: their embedded-mode
      # metadata.json carries a per-machine project_id UUID.
        - name: "FINAL BEADS TRACKING POLICY"
          patterns:
            - "!.beads/"
            - ".beads/*"
            - ".beads/.*"
            - "!.beads/config.yaml"
            - ".beads/proxieddb/"
            - ".dolt/"
            - "*.db"
            - ".beads-credential-key"
            - ".worktrees/"
            - "legado/"
        - name: "Beads ledger identity (workspace and standalone)"
          profiles: [workspace, standalone]
          patterns:
            - "!.beads/metadata.json"
        # The canonical ledger identity: conform reads it to render the
        # identity-preserving metadata.json on fresh checkouts. Without
        # the exception the render loses the project id and the gen
        # check gate drifts on every clean clone.
            - "!.beads/identity.toml"
        - name: "codegen module-standardizer reject artifacts (ADR-005 §9)"
          patterns:
            - "*.tpl.rej"
        - name: "--- codegen conform: generated runtime ignores ---"
          patterns:
            - ".direnv/"
            - ".reports/"
            - ".venv"
            - ".venv/"
            - ".bin/"
        # Repo-root bin/: only the mise bootstrap pair is tracked; every
        # other entry (venv shims, local symlinks) is machine-local and
        # gets rewritten by `make setup`, so tracking it makes the docs
        # byte-identical verification fail on a clean runner.
        # A deny-all allowlist (`/*/`) excludes the bin/ directory itself,
        # and git never descends into an excluded directory, so the two
        # negations below cannot re-include the pair without this line.
            - "!/bin/"
            - "/bin/*"
            - "!/bin/mise"
            - "!/bin/mise.cmd"
            - "!/bin/mise-lock-transaction.py"
            - "!/bin/mise-lock-converge.py"
            - ".tools/"
            - "__pycache__/"
            - "base.mk"
            - "!.pre-commit-config.yaml"
    templates:
      root: project
      entries:
        - source: base/.github/ci-template/ci.yml.j2
          destination: .github/ci-template/ci.yml
          profiles: [workspace]
          delegate: render
        - source: base/.github/copilot-instructions.md.j2
          destination: .github/copilot-instructions.md
          profiles: [workspace]
          delegate: render
        - source: base/.github/dependabot.yml.j2
          destination: .github/dependabot.yml
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.github/prompts/flext-aggressive-scale-refactor.prompt.md.j2
          destination: .github/prompts/flext-aggressive-scale-refactor.prompt.md
          profiles: [workspace]
          delegate: render
        - source: base/.github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md.j2
          destination: .github/prompts/flext-strict-jsonvalue-session-continuation.prompt.md
          profiles: [workspace]
          delegate: render
        - source: base/.github/scripts/check-beads-policy.sh.j2
          destination: .github/scripts/check-beads-policy.sh
          profiles: [workspace]
          delegate: render
        - source: base/.github/scripts/check-cqrs-compliance.sh.j2
          destination: .github/scripts/check-cqrs-compliance.sh
          profiles: [workspace]
          delegate: render
        - source: base/.github/scripts/validate-git-hook.sh.j2
          destination: .github/scripts/validate-git-hook.sh
          profiles: [workspace, standalone]
          delegate: render
      # Multi-environment CI base: reusable ci-matrix workflow + per-distro
      # clean-machine images validating bootstrap and make verbs everywhere.
        - source: base/.github/workflows/ci-matrix.yml.j2
          destination: .github/workflows/ci-matrix.yml
        # The manual dispatch matrix is projected to EVERY
        # repository (root and members alike); dispatch-only, never bound
        # to the integration line.
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.github/workflows/ci.yml.j2
          destination: .github/workflows/ci.yml
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.pre-commit-config.yaml.j2
          destination: .pre-commit-config.yaml
          profiles: [workspace, standalone]
          delegate: render
        - source: base/LICENSE.j2
          destination: LICENSE
          profiles: [workspace, standalone]
          delegate: render
      # The release build phase snapshots the
      # Gitleaks policy before the first artifact build, and renders the
      # hash-pinned build backend for `uv build --require-hashes` directly
      # from config.Infra.release.build_constraints (no repository copy).
        - source: base/config/gitleaks-release.toml.j2
          destination: config/gitleaks-release.toml
          profiles: [workspace, standalone]
          delegate: render
      # Repository-owned audit policy is validated from workspace.yaml,
      # rendered per project, and parsed into DocsAuditPolicySpec by the auditor.
        - source: base/docs/docs_config.json.j2
          destination: docs/docs_config.json
          profiles: [workspace, standalone]
          delegate: render
        - source: base/gitignore.j2
          destination: .gitignore
          profiles: [workspace, standalone]
          delegate: render
        - source: base/python-version.j2
          destination: .python-version
          profiles: [workspace, standalone]
          delegate: render
        - source: base/qlty.toml.j2
          destination: .qlty/qlty.toml
          profiles: [workspace, standalone]
          delegate: render
        - source: base/sonarcloud.properties.j2
          destination: .sonarcloud.properties
          profiles: [workspace, standalone]
          delegate: render
        - source: base/env.example.j2
          destination: .env.example
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.mise.toml.j2
          destination: .mise.toml
          profiles: [workspace, standalone]
          delegate: render
        - source: base/markdownlint.json.j2
          destination: .markdownlint.json
          profiles: [workspace, standalone]
          delegate: render
        - source: base/markdownlintignore.j2
          destination: .markdownlintignore
          profiles: [workspace, standalone]
          delegate: render
        - source: base/prettierrc.j2
          destination: .prettierrc
          profiles: [workspace, standalone]
          delegate: render
        - source: base/prettierignore.j2
          destination: .prettierignore
          profiles: [workspace, standalone]
          delegate: render
      # Ledger routing config: rendered only for repositories that own a
      # ledger. The workspace root owns a shared ledger when a gitlink's
      # Every repository renders its own `.beads` configuration; the shared
      # ledger is reached by the declared city endpoint, never by a link.
        - source: base/beads-config.yaml.j2
          destination: .beads/config.yaml
          requires_beads: true
          profiles: [workspace, standalone]
          delegate: render
      # Static repository-local storage, database, and endpoint projection.
        - source: base/beads-metadata.json.j2
          destination: .beads/metadata.json
          requires_beads: true
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.envrc.j2
          destination: .envrc
          profiles: [workspace, standalone]
          delegate: render
        - source: base/.github/workflows/docs.yml.j2
          destination: .github/workflows/docs.yml
        # The workflow runs `uv sync`, and this projection installs uv first.
        # Restricting it to the workspace left members with a stale copy
        # without the Install uv step, and the job died on "uv: command not found".
          profiles: [workspace, standalone]
          delegate: render
      # Release automation is opt-in per distribution. Repositories without an
      # explicit declaration have this generated workflow retired by conform.
        - source: base/.github/workflows/release.yml.j2
          destination: .github/workflows/release.yml
          profiles: [workspace, standalone]
          delegate: render
          requires_release_protocol: true
        - source: base/tests/fixtures/ci/docker/ubuntu.Dockerfile.j2
          destination: tests/fixtures/ci/docker/ubuntu.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
        - source: base/tests/fixtures/ci/docker/debian.Dockerfile.j2
          destination: tests/fixtures/ci/docker/debian.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
        - source: base/tests/fixtures/ci/docker/fedora.Dockerfile.j2
          destination: tests/fixtures/ci/docker/fedora.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
        - source: base/tests/fixtures/ci/docker/alpine.Dockerfile.j2
          destination: tests/fixtures/ci/docker/alpine.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
        - source: base/tests/fixtures/ci/docker/arch.Dockerfile.j2
          destination: tests/fixtures/ci/docker/arch.Dockerfile
          profiles: [workspace, standalone]
          delegate: render
        - source: base/bin/mise-lock-transaction.py.j2
          destination: bin/mise-lock-transaction.py
          profiles: [workspace, standalone]
          delegate: render
        - source: base/bin/mise-lock-converge.py.j2
          destination: bin/mise-lock-converge.py
          profiles: [workspace, standalone]
          delegate: render
        - source: base/Makefile.j2
          destination: Makefile
        # The generic conform engine is the single Makefile owner for every
        # profile; every profile renders the same local verb bodies. A
        # project never owns a verb: customisation lives exclusively in
        # custom.mk, through pre-/post-verb hooks, and may not redefine one.
          profiles: [workspace, standalone]
          delegate: render
        - source: base/custom.mk.j2
          destination: custom.mk
          profiles: [workspace, standalone]
          delegate: render
        - source: base/pyproject.toml.j2
          destination: pyproject.toml
          profiles: [workspace, standalone]
          delegate: render
      # New-project declaration is serialized once from WorkspaceManifestSpec.
      # Existing-tree conform reads this file as input and never overwrites it.
        - destination: config/workspace.yaml
          profiles: [workspace, standalone]
          delegate: manifest
      # Repository-local Beads identity. conform requires this file to
      # exist before it can plan, so a scaffolded project that never
      # rendered it could not be conformed at all.
        - source: base/config/beads.yaml.j2
          destination: config/beads.yaml
          requires_beads: true
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/api.py.j2
          destination: "src/{package_name}/api.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/cli.py.j2
          destination: "src/{package_name}/cli.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/__main__.py.j2
          destination: "src/{package_name}/__main__.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/base.py.j2
          destination: "src/{package_name}/base.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/models.py.j2
          destination: "src/{package_name}/models.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/typings.py.j2
          destination: "src/{package_name}/typings.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/protocols.py.j2
          destination: "src/{package_name}/protocols.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/constants.py.j2
          destination: "src/{package_name}/constants.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/utilities.py.j2
          destination: "src/{package_name}/utilities.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/_config.py.j2
          destination: "src/{package_name}/_config.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/_settings.py.j2
          destination: "src/{package_name}/_settings.py"
          profiles: [workspace, standalone]
          delegate: render
        - source: base/src/py.typed.j2
          destination: "src/{package_name}/py.typed"
          profiles: [workspace, standalone]
          delegate: render
      # Domain behavior is generated in services, not base.py.
        - source: base/src/services/ping.py.j2
          destination: "src/{package_name}/services/ping.py"
          profiles: [workspace, standalone]
          delegate: render
      # Runtime config is app-owned and loaded
