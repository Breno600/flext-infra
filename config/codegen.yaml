            - assets
        cosmos-main:
          keep_root_files:
            - ECOSYSTEM.md
            - SECURITY.md
            - ONBOARDING.md
            - LICENSE-3RD-PARTY.md
            - LICENSE.quick-reference.md
            - QODER.md
            - mkdocs.yaml
            - Makefile.check
            - config.yaml
