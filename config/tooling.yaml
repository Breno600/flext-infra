Infra:
  tooling:
    # Canonical validated tooling and suppression-policy SSOT.
    raw-check-receipt-suffix: .raw.log
    tools:
      bandit:
        # Each exception exists only with the operator ruling that authorized
        # it and its reason. Bandit reads no per-path exception, so the
        # security gate audits the files an entry matches in their own
        # invocation that skips only the entry's tests; every other file keeps
        # every test. Repositories declare no exception of their own.
        authorized-exceptions:
          - tests: [B404, B603]
            files:
              - src/flext_cli/_utilities/processes.py
              - src/flext_cli/_utilities/runtime.py
              - src/flext_core/**/*.py
            authority: operator-ruling-2026-10-08-subprocess-test-imports
            reason: >-
              Only the u.Cli.run process owner in flext-cli and the flext-core
              source may import and spawn subprocess; every other module runs
              processes through u.Cli.run. The codemod rule
              ban-subprocess-outside-run-owner bans subprocess everywhere
              else, with the same owner scope.
      codespell:
        check-filenames: true
        ignore-words-list: crate,nd
      # Non-linter tool sections are config-owned as well.
      deptry:
        known-first-party: [flext_core]
        pep621-dev-dependency-groups: [dev]
      hatch:
        allow-direct-references: true
      markdown:
        # rumdl exits 1 on any violation and 2 on an error: a repair verb
        # completes with findings under this status; any other fails it.
        findings-exit-codes: [1]
        rules:
          default: true
          MD001: false
          # MD013 prose and code lengths are THE markdown line contract for
          # both rumdl surfaces: `rumdl check` (markdown gate, `make fix`) and
          # `rumdl fmt` (markdown-format gate, `make fmt`) read this one rule
          # set through the generated .markdownlint.json. Headings use
          # MD013.heading_line_length because no tool can reflow a heading.
          #
          # Wrapping is hand-owned, not tool-owned: rumdl's normalize reflow
          # joins a hand-wrapped paragraph into one line and cannot re-split
          # lines containing inline-code spans. With reflow off, nobody
          # rewrites an author's breaks, and MD013 stays the check-only line
          # contract: a genuinely long line is a finding the author fixes by
          # wrapping.
          MD013:
            line_length: 88
            heading_line_length: 200
            code_block_line_length: 88
            tables: false
            reflow: false
          MD022: false
          MD023: false
          MD024: { siblings_only: true }
          MD025: false
          MD031: false
          MD033: { allowed_elements: [br, details, summary, kbd] }
          MD036: false
          MD040: false
          MD041: false
          MD042: false
          MD046: false
          MD050: { style: consistent }
          MD051: false
          MD057: false
          MD060: false
          MD076: false
        exclude:
          # AGENTS.md is a tool-managed projection (tracker and agent setup
          # blocks): gating generated output is a projection defect.
          # CLAUDE.md is its symlink and would rewrite the projection through
          # the link.
          - AGENTS.md
          - CLAUDE.md
          # GEMINI.md is the same tool-managed instruction-pointer projection
          # (generate-workspace-config); prose-wrap always rewraps its exact
          # rendered pointer and the law-surface validator then fails closed.
          - GEMINI.md
          - .kilo/**
          - .omo/**
          # ZCode session artifacts (plan files) are machine-local scratch,
          # never a live docs or markdown-gate surface.
          - .zcode/**
          - .tmp/**
          - .claude/**
          - .vscode/**
          - .serena/**
          - .snapshots/**
          - .benchmarks/**
          - .hypothesis/**
          # CHANGELOG.md files are release-please output: their bullets embed
          # compare/commit URLs that cannot reflow under the line budget, and
          # hand-wrapping them is overwritten by the next release render
          # (operator authorization 2026-10-03).
          - CHANGELOG.md
          # Codegen-managed docs projections (make gen / docs generate): the
          # renderer's output is canonical as emitted — a formatter rewriting
          # them fights the codegen fixed point and the conform gate flags
          # the drift both ways (merge-admin 2026-10-07, root evidence).
          - docs/docs_config.json
          - docs/architecture/architecture_config.json
          - .mypy_cache/**
          - .pytest_cache/**
          - .ruff_cache/**
          - .venv/**
          - __pycache__/**
          - node_modules/**
          - .reports/**
          - dist/**
          - build/**
          - htmlcov/**
          - legado/**
          - .github/**
          - site/**
          # target/ is a fully generated build tree (mise/rust-style outputs):
          # formatting generated output is a projection defect.
          - target/**
          # Provider-surface projections and tracker runtime state: never a
          # lint/format surface.
          - .agents/**
          - .gemini/**
          - .beads/**
          # Gen-emitted table projections whose emitter lives outside the
          # codegen surface; MD058 (blank lines around tables) is upstream of
          # the projection and cannot be repaired at the projection itself.
          - docs/knowledge-index.md
          - docs/architecture/communities/index.md
          # External CRG tool output: pipe-separated rows (MD075) and long JSON
          # lines (MD013) originate from code-review-graph, not hand-authored docs.
          - docs/architecture/crg-reports/**
          # Generated api-reference and project-catalog projections (make gen /
          # docs generate): the renderer's output is canonical as emitted, so
          # no formatter rewrites generated docs and the codegen fixed point
          # stays stable.
          - docs/api-reference/generated/**
          # Historical evidence documents (plans, handoffs, frozen law text):
          # their formatting is frozen evidence per operator law 11 —
          # reformatting rewrites the record. Frozen as evidence, never
          # re-rendered.
          - docs/plans/2026-09-14-stabilization-handoff/previous-handoff-source.md
          - docs/plans/2026-09-22-pipeline-integracao-continua-plano.md
          - docs/plans/2026-09-22-rope-generator-stabilization/02-achados-codegen.md
          - docs/plans/2026-09-23-handoff-mypy-stabilization-e-integracao.md
          - docs/plans/2026-09-25-v8-flext-service-base/05-phases.md
          - docs/plans/2026-09-25-v8-flext-service-base/07-sessions-guide.md
          - docs/standards/consumption-law.md
          - docs/projects/generated/**
      ruff:
        # Ruff exits 1 on findings; a repair verb completing with remaining
        # findings continues under this status while any other failure stops it.
        findings-exit-codes: [1]
        extend-exclude:
          # Historical evidence trees (.archive/**) hold archived session
          # artifacts, never live source: they are evidence-only material
          # (operator law 11) and stay outside the lint scope of every
          # projected member.
          - "**/.archive/**"
          # Generated source trees (codegen artifacts with generated_source)
          # are appended by the projection from that one key, never listed.
          # Provider-owned AI Hub hook projections live under the tool-home
          # dot directories (.agents/.claude/.codex/.cursor/.gemini ...); the
          # operators rule (fleet learned constraint) keeps ~/.* code outside
          # the lint scope, and these hooks are distributed tool-home state,
          # not member source.
          - "**/.agents/aihub-hooks/**"
          - "**/.claude/aihub-hooks/**"
          - "**/.codex/aihub-hooks/**"
          - "**/.cursor/aihub-hooks/**"
          - "**/.gemini/aihub-hooks/**"
        # Lint covers every tracked Python surface; `.gitignore` alone decides
        # visibility (respect-gitignore below), never a copied exclude list.
        # tests, examples, and scripts are dev/tooling source roots (see `src`
        # below), not installed packages: they hold namespace/command modules
        # loaded by path (e.g. the scripts/<verb>/<what> dispatch pattern), so
        # ruff must not demand an __init__.py (INP001) there.
        namespace-packages: [tests, examples, scripts]
        fix: false
        # Ruff exits 1 when it reports violations (2 on an error): a repair
        # verb completes with findings under this status; any other fails it.
        # Operator ruling 2026-10-05: rules the operator never authorized as
        # blocking are informative only. The lint gate keeps reporting these
        # in the gate log, the summary, and the SARIF reports, but their
        # findings never fail the run. Re-measure each entry as the fleet
        # converges and retire the rule from this list when its census
        # reaches zero.
        informative-rules:
          - too-many-arguments
          - too-many-positional-arguments
          - too-many-locals
          - too-many-return-statements
          - too-many-branches
          - too-many-public-methods
          - too-many-statements
          - complex-structure
          - suspicious-subprocess-import
          - subprocess-without-shell-equals-true
        line-length: 88
        preview: true
        respect-gitignore: true
        show-fixes: true
        src: [src, tests, examples, scripts]
        target-version: py313
        format:
          docstring-code-format: true
          indent-style: space
          line-ending: lf
          quote-style: double
          skip-magic-trailing-comma: false
        lint:
          select:
            - ALL
          # make fix never deletes information. The lint
          # repair applies safe fixes only (make.ruff.lint_fix rejects
          # --unsafe-fixes), and these rules are never auto-fixed at all,
          # because their fixes delete a diagnostic print, an assignment, a
          # redefinition, a duplicated key/value/test case or a version block
          # (print once deleted print(..., file=sys.stderr) from a consumer
          # script and turned its failures silent). Ruff keeps reporting them;
          # the author decides. Also guards direct and IDE Ruff runs.
          unfixable:
            - duplicate-value
            - multi-value-repeated-key-literal
            - multi-value-repeated-key-variable
            - outdated-version-block
            - p-print
            - print
            - pytest-duplicate-parametrize-test-cases
            - redefined-while-unused
            - unused-variable
          # OPERATOR LAW 2026-10-05 (direct order, OBLIGATORY, NEVER DISABLED
          # AGAIN): `make fix` ALWAYS applies Ruff's unsafe fixes — the
          # mandatory lint_fix surface carries --unsafe-fix in codegen.yaml
          # and MakeRuffSpec fails validation without it. This list keeps its
          # historical evidence records for the rules whose fixes were proven
          # semantics-preserving while the channel was opt-in; it no longer
          # gates the channel (nothing needs promotion into a channel that is
          # always on). Rules whose fixes would destroy information remain in
          # `unfixable` above — that is rule selection, never disabling the
          # mandatory unsafe channel.
          extend-safe-fixes:
            - relative-imports
            - typing-only-first-party-import
            - camelcase-imported-as-lowercase
          # Every import is absolute: make mod rewrites relative imports and
          # the lazy-init generator renders absolute import statements.
          ban-relative-imports: all
          # Every module carries the copyright notice (CPY001) in the shape the
          # scaffold templates render from the project's declared author and
          # copyright year. The fix recipe writes the module's project-relative
          # path, without its shared suffix, between that sentence and the
          # SPDX line so the notice is not one stamp.
          copyright-notice-rgx: 'Copyright \(c\) \d{4} \S[^\n]*\. All rights reserved\.'
          # Repairs make fix applies after Ruff's own fixes, to findings Ruff
          # reports without a fix: each Ruff rule name maps to one recipe the
          # lint gate derives from the source (docstring sections from the
          # signature, summary and raise statement; summaries from the declared
          # name; the notice from the project's declared author and copyright
          # year; a method that never reads its instance becomes a static
          # method, its signature and decorators edited and its body kept
          # byte for byte; an inline import runs through the import-law engine,
          # operator-ruling-2026-10-08-import-law; a long string literal or
          # comment Ruff format cannot wrap is split without changing the AST).
          fix-recipes:
            missing-copyright-notice: copyright-notice
            undocumented-public-class: summary-docstring
            undocumented-public-method: summary-docstring
            undocumented-public-function: summary-docstring
            docstring-missing-returns: returns-section
            docstring-missing-yields: yields-section
            docstring-missing-exception: raises-section
            no-self-use: static-method
            import-outside-top-level: normalize-imports
            line-too-long: wrap-long-line
          # Phases run in order and Ruff re-reads the tree after each: imports
          # settle first (their rewrite can shorten or lengthen lines), a new
          # summary exposes the sections its function needs, and line wrapping
          # runs last over the final text.
          fix-recipe-phases:
            - [normalize-imports]
            - [summary-docstring, copyright-notice, static-method]
            - [returns-section, yields-section, raises-section]
            - [wrap-long-line]
          # The import law keeps a reverse import read at runtime in place for
          # manual repair, and a line holding no splittable literal or comment
          # keeps its length; those findings stay visible in make check instead
          # of failing make fix (operator ruling 2026-10-01: fix never fails on
          # a residual violation).
          fix-recipe-residual: [normalize-imports, wrap-long-line]
          # Pydantic evaluates model field annotations at runtime, so an
          # import used only in a model annotation is runtime, not typing-only.
          # Ruff follows imported bases only by qualified name: codegen derives
          # every project class base that subclasses a root below into
          # runtime-evaluated-base-classes (tooling_runtime), never a list here.
          flake8-type-checking:
            runtime-evaluated-roots:
              - pydantic.BaseModel
          # Banned API messages are policy data, never template literals.
          banned-api:
            argparse: "Use cli.register_result_command + Pydantic model from flext_cli."
            click:
              "Use flext_cli.cli application, registration, execution, and invocation\
              \ methods."
            rich: "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."
            tabulate: "Use cli.render_table from flext_cli."
            typer: "Use cli.create_app_with_common_params / cli.register_command from flext_cli."
          isort:
            combine-as-imports: true
            force-single-line: false
            split-on-trailing-comma: false
          # Operator ruling 2026-10-01 (docstring convention): docstrings follow
          # the Google convention, the shape the docstring fix recipes render.
          # Ruff then disables the docstring rules that convention does not
          # use, one of each mutually exclusive pair select ALL enables
          # (D203/D211, multi-line-summary-first-line/D213) included, so no run warns about them.
          pydocstyle:
            convention: google
          # Each exception exists only with the operator ruling that authorized
          # it and its reason; Ruff receives the unscoped entries as `ignore`
          # and the scoped ones as `per-file-ignores`. Repositories declare no
          # exception of their own. Operator order 2026-10-05 (latest, direct,
          # merge-admin mandate): TC001-TC004 are ALL BLOCKED — enforced by
          # rule name on every file (the four names live in the select
          # surface, never in an ignore table; the same-day
          # tc001-tc004-off-pydantic disable is superseded), and the scoped
          # lazy-root dunder-init exception below stays the only relief.
          # Pydantic runtime-evaluation is protected by the
          # runtime-evaluated-roots projection, not by disabling the rules.
          authorized-exceptions:
            - rules: [missing-trailing-comma]
              authority: operator-file-gate-verdict-mandate-2026-10-08
              reason: >-
                Ruff's formatter owns trailing comma layout. The official COM812
                documentation recommends removing this redundant lint rule when
                using the formatter; enabling both emits a configuration conflict.
                https://docs.astral.sh/ruff/rules/missing-trailing-comma/
            - files: "tests/test_snapshot_drill.py"
              rules: [import-private-name]
              authority: operator-relocation-mandate-2026-10-06-snapshot-stems
              reason: >-
                The datacosmos-backup snapshot drill exercises the canonical
                use-case stem directly through a fake port; the models family
                module is private by naming, public by contract (the root lazy
                map publishes its class), and the public facades cannot expose
                it without an import cycle through the root package.
            - files: "**/bin/**"
              rules:
                [
                  missing-copyright-notice,
                  docstring-missing-exception,
                  docstring-missing-returns,
                  undocumented-public-method,
                  line-too-long,
                  magic-value-comparison,
                  type-check-without-type-error,
                  print,
                  import-outside-top-level,
                  unused-class-method-argument,
                ]
              authority: operator-order-2026-10-06-make-verbs-green
              reason: >-
                The generated bin bootstrap scripts (mise lock transaction,
                converge) run stdlib-only under env -i before the project
                environment exists: mutex journal recovery and diagnostic
                prints are their documented design (subprocess relief removed
                by operator-ruling-2026-10-08-subprocess-supersedes-all),
                their module docstrings carry the projected copyright and
                SPDX closing lines, and exhaustive
                control-flow exception docstrings do not survive the codegen
                render. Operator order 2026-10-06 (make every verb green)
                authorizes the scoped relief; the rules stay active
                everywhere else.
            - files: "**/xlsx.py"
              rules: [import-outside-top-level]
              authority: operator-ruling-2026-10-05-heavy-adapter-boundary
              reason: >-
                The xlsx/docx/pptx utility boundaries are the typed lazy
                adapters: their renderer submodules import the heavy office
                toolkits at their own module top, so the boundary loads them
                per operation (the class contract documents this). Hoisting
                the first-party import would eager-load openpyxl/docx/pptx
                into every CLI start; the per-operation import is the
                documented design, and the rule stays active everywhere
                else.
            - files: "**/docx.py"
              rules: [import-outside-top-level]
              authority: operator-ruling-2026-10-05-heavy-adapter-boundary
              reason: >-
                See the xlsx.py entry: the same heavy-adapter boundary, one
                ruling.
            - files: "**/pptx.py"
              rules: [import-outside-top-level]
              authority: operator-ruling-2026-10-05-heavy-adapter-boundary
              reason: >-
                See the xlsx.py entry: the same heavy-adapter boundary, one
                ruling.
            - files: "**/flext_core/_models/pydantic.py"
              rules: [any-type, builtin-argument-shadowing, too-many-arguments]
              authority: operator-ruling-2026-10-07-facade-signature-mirror
              reason: >-
                The flext-core pydantic facade's TYPE_CHECKING block mirrors
                pydantic's public ``computed_field``/``model_serializer``
                signatures one-to-one (including the ``repr`` keyword and the
                12-kwarg surface) so consumers get pydantic's exact call
                contract through the facade. Renaming keywords, de-typing with
                object, or collapsing parameters would break the mirrored API
                contract the stubs exist to carry; the admission is bounded to
                this single signature-mirror module.
            - files: "**/framework.py"
              rules: [import-outside-top-level]
              authority: operator-ruling-2026-10-05-heavy-adapter-boundary
              reason: >-
                The CLI framework adapter loads its toolkit wiring lazily at
                application-build time for the same startup-budget reason;
                every other module keeps the top-level import contract.
            - files: "**/_config.py"
              rules: [invalid-function-name]
              authority: operator-ruling-2026-10-05-config-namespace-surface
              reason: >-
                The config namespace surface is law (ADR-005): consumers read
                ``config.<Namespace>.*`` with the namespace spelled as the
                domain noun (``config.Cli``), so the accessor keeps its
                declared casing; the rule stays active for every other
                function name.
            - files: "**/__init__.py"
              rules: [line-too-long]
              authority: operator-ruling-2026-10-05-generated-lazy-init-paths
              reason: >-
                Generated lazy-init initializers render from-import lines
                whose module path alone can exceed the line budget; the line
                cannot wrap. The cure owner is the generator template; until
                it lands, the generated surface stays exempt while hand code
                keeps the budget.
            - files: "**/file_test_helpers.py"
              rules: [line-too-long]
              authority: operator-ruling-2026-10-05-partnn-module-paths
              reason: >-
                The PartNN split names modules by concatenating the project,
                family and part stems, and several generated module paths
                exceed the line budget by themselves, so their from-import
                lines cannot wrap below the budget. The cure owner is the
                PartNN naming scheme; the rule stays active everywhere else.
            - files: "**/flextcliutilitiesfiletesthelpersmixin_part_03.py"
              rules: [line-too-long]
              authority: operator-ruling-partnn-module-path-length
              reason: >-
                See file_test_helpers.py: the same PartNN module-path length
                defect, one ruling.
            - files: "**/test_public_contracts_cov.py"
              rules: [line-too-long]
              authority: operator-ruling-partnn-module-path-length
              reason: >-
                See file_test_helpers.py: the same PartNN module-path length
                defect over the tests/_cases layout, one ruling.
            - files: "**/framework.py"
              rules: [banned-api]
              authority: operator-ruling-2026-10-05-cli-owner-adapter
              reason: >-
                The banned click/typer/rich/tabulate/argparse API governs
                consumer modules so they route through the owning package's
                CLI facade; each CLI owner's framework adapter is the one
                module that exists to bind those libraries directly, so its
                imports are the licensed surface. Every other module stays
                blocked by the same rule.
            # runtime-import-in-type-checking-block — is DISABLED for every
            # file: Ruff must not execute these rules anywhere. Declared by
            # rule name (the fleet's canonical naming format). This supersedes
            # the TC arms of the 2026-10-01 rulings (TC002/TC003 pydantic,
            # TC004/TC001 lazy-root scoped forms) and of the 2026-10-03 ruling
            # (TC001 global): the pydantic hazard those older rulings worked
            # around is moot because the rules never run. One unscoped entry
            # carries all four rules exactly once, without a scoped substitute.
            - rules: [
                typing-only-first-party-import,
                typing-only-third-party-import,
                typing-only-standard-library-import,
                runtime-import-in-type-checking-block,
              ]
              authority: operator-direct-order-2026-10-05-tc001-tc004-off-pydantic
              reason: >-
                Operator ruling 2026-10-05: TC001-TC004 are blocked from
                executing on every file; Ruff receives them as global ignores
                declared by rule name in this single unscoped exception.
                Pydantic evaluates model annotations at runtime; moving their
                required imports into TYPE_CHECKING can break model declaration.
                No model or import workaround substitutes for this prohibition.
                Canonical tracking remains flext-p7bxt and flext-4536i.
            - files: "**/tests/**"
              rules: [ magic-value-comparison, private-member-access, compare-to-empty-string, too-many-public-methods, boolean-positional-value-in-call, pytest-fixture-autouse, mutable-class-default, no-self-use, import-private-name ]
              authority: operator-ruling-2026-10-07-tests-family-consumption
              reason: >-
                Test idioms: assertions compare against literal expected values
                (the magic values ARE the expectations), the tests exercise
                private members of the unit under test, and test classes group
                many public test methods by design. The import-private-name
                relief resolves the operator question pending since
                2026-10-06: the tests consume the families' package-level
                public-named contracts (flext_infra._utilities publishes the
                family's concrete classes; 32 test files consume family
                packages directly), and exposing rope/file-plan internals on
                the fleet facade would leak implementation into the public
                API. Actionable quality rules (complexity, naming,
                documentation) stay active on the tests tree.
            - rules: [missing-required-import, implicit-namespace-package]
              authority: operator-ruling-2026-10-03-import-banners-off-global
              reason: >-
                Operator ruling 2026-10-03: I001 (unsorted-imports) stays
                enforced as the import-order contract; I002
                (missing-required-import) and the isort-only I003 slot are
                DISABLED — required-import banners duplicate the
                absolute-import law (ban-relative-imports: all) and F401
                already governs unused imports. The lazy-root __init__
                exception remains the only lazy form; model_rebuild stays
                forbidden.
            - files: "scripts/**/*.py"
              rules:
                - commented-out-code
                - line-too-long
                - typing-only-first-party-import
              authority: operator-ruling-2026-10-02-promoted-script-surface
              reason: >-
                Promoted command scripts declare TOML metadata headers the
                discovery parser reads literally, so those lines cannot reflow
                under the line budget, and the orchestration glue keeps
                documented-disabled blocks and deferred annotation imports
                inline; the member repository validates this surface
                end-to-end through its own gates.
            - files: "tests/**/*.py"
              rules: [assert]
              authority: universal-core-2026-07-20-test-idiom-s101
              reason: >-
                Pytest assertions are the test contract. Ruff's S101 assert
                restriction applies to runtime code, while tests intentionally
                use Python assert statements to report failed expectations.
            - rules: [camelcase-imported-as-lowercase]
              authority: operator-ruling-2026-10-01-n813-accepted
              reason: >-
                The facade letters are imported as their facade class under
                the letter (FlextInfraConstants as c), so type checkers see a
                class rather than a variable rebind.
            - files: "**/__init__.py"
              rules: [unused-import]
              authority: operator-ruling-2026-10-01-init-declared-letter-f401
              reason: >-
                A package initializer publishes what its modules declare; Ruff
                never removes those imports as unused.
            - files: "**/__init__.py"
              rules: [non-empty-init-module]
              authority: operator-ruling-2026-10-01-ruf067-lazy-init
              reason: >-
                Generated lazy-init package initializers must execute the lazy
                installation, which is not a re-export.

            - files: "scripts/**"
              rules: [ any-type, unused-function-argument, undocumented-public-class, undocumented-public-method, undocumented-public-function, undocumented-public-init, unnecessary-multiline-docstring, blank-line-after-function, missing-blank-line-after-summary, multi-line-summary-first-line, raw-string-in-exception, f-string-in-exception, commented-out-code, shebang-not-executable, boolean-type-hint-positional-argument, boolean-default-value-positional-argument, read-whole-file, write-whole-file, if-exp-instead-of-or-operator, repeated-append, logging-string-concat, non-lowercase-variable-in-function, invalid-module-name, manual-list-comprehension, manual-list-copy, multiple-starts-ends-with, missing-maxsplit-arg, import-private-name, magic-value-comparison, literal-membership, unspecified-encoding, os-path-abspath, os-path-exists, os-path-join, os-path-dirname, builtin-open, path-constructor-current-directory, avoidable-escaped-quote, unsorted-dunder-all, used-dummy-variable, unused-noqa, noqa-comments, print, runtime-cast-value, banned-api, relative-imports, raise-vanilla-args, error-instead-of-exception, verbose-raise ]
              authority: operator-ruling-2026-10-02-mcb-scripts-automation
              reason: >-
                Repository automation helpers (mcb scripts/**, migrated from mcb config/managed-artifacts.yaml when the project per-file declaration surface retired): CLI entrypoints print to stdout and use os.path; the sys.path bootstrap forces module-level imports after executable code. Scoped to scripts/** so shipped source keeps every rule. Subprocess relief removed by operator-ruling-2026-10-08-subprocess-supersedes-all: processes go through u.Cli.run.
            - files: "**/tests/python/**"
              rules: [ raise-vanilla-args ]
              authority: operator-ruling-2026-10-02-mcb-tests-python
              reason: >-
                mcb tests/python exercises the scripts automation end to end (migrated from the retired project per-file surface: TRY003). Subprocess relief removed by operator-ruling-2026-10-08-subprocess-supersedes-all.
            - files: "src/flext_cli/_utilities/processes.py"
              rules: [ suspicious-subprocess-import, subprocess-without-shell-equals-true ]
              authority: operator-ruling-2026-10-08-subprocess-supersedes-all
              reason: >-
                flext-cli owns the child-process lifecycle: this module is the
                Popen machinery that u.Cli.run itself is built on, so the
                ruling's "processes go through u.Cli.run" terminates here and
                cannot apply to the owner without a circular rewire. Bounded
                to the two owner modules; every other caller is rewired.
            - files: "src/flext_cli/_utilities/runtime.py"
              rules: [ suspicious-subprocess-import, subprocess-without-shell-equals-true ]
              authority: operator-ruling-2026-10-08-subprocess-supersedes-all
              reason: >-
                Same owner boundary as processes.py: the streamed-lifecycle
                raw child spawn lives here by design under the u.Cli.run
                facade. Bounded to this module.
            - files: "**/.agents/skills/webapp-testing/scripts/with_server.py"
              rules: [ suspicious-subprocess-import, subprocess-without-shell-equals-true ]
              authority: operator-ruling-2026-10-08-subprocess-supersedes-all
              reason: >-
                Standalone skill bootstrap (webapp-testing) runs before any
                workspace venv exists and cannot import the u.Cli facade; it
                owns its dev-server process lifecycle by design. Bounded to
                this single skill script.
      mypy:
        # Wall-time bound for the bounded Mypy execution (SSOT). A project
        # config/tooling.yaml overlay may only lower it; no environment
        # variable changes it.
        # Operator 2026-10-08: 600s (the documented mypy bound) because 120s
        # killed the bounded run mid-type-check on flext-core (exit=-15) and
        # every large member, so the gate never produced real findings.
        timeout_seconds: 600
        # Pydantic 2 and pydantic.mypy are mandatory (operator 2026-10-05).
        # Missing, empty, and v1 plugin declarations fail validation rather
        # than being silently repaired by schema defaults.
        plugins: [pydantic.mypy]
        # Operator 2026-10-05, flext-8i57m: suspend only these two codes
        # globally, not additional diagnostics. Proven code workarounds for
        # these codes are repaired at their runtime owners, not accommodated.
        disable-error-code: [prop-decorator, call-arg]
        # The canonical facade form imports the parent letter, subclasses it
        # and rebinds the letter (`from flext_core import u`,
        # `class FlextCliUtilities(u)`, `u = FlextCliUtilities`). Mypy 2.3.1
        # rejects that module-level rebind with these codes even under
        # allow_redefinition — `assignment` because the rebound letter's type
        # (the subclass) is by design never the imported alias's type
        # (type[FlextService] vs type[FlextApiServiceBase]); codegen disables
        # them only in the modules it detects in that form
        # (operator-ruling-2026-10-01-facade-rebind-mypy-scope).
        facade-rebind-error-codes: [misc, no-redef, assignment]
        boolean-settings:
          allow_redefinition: true
          namespace_packages: true
          explicit_package_bases: true
          check_untyped_defs: true
          extra_checks: true
          # Analyze source distributions that have real annotations but omit
          # the PEP 561 marker. Rope 1.14 is one such runtime owner; skipping
          # it converts every public boundary into Any and makes its imports
          # fail before our typed protocols can validate them.
          follow_untyped_imports: true
          local_partial_types: true
          no_implicit_reexport: true
          show_traceback: true
          # strict_concatenate is deprecated in mypy 1.20+; extra_checks covers it
          strict_equality: true
          warn_redundant_casts: true
          warn_return_any: true
          warn_unreachable: true
          warn_unused_ignores: true
        string-settings:
          follow_imports: normal
        overrides:
          - modules: [rope.*]
            follow-untyped-imports: true
            justification: >-
              Analyze Rope's installed source without suppressing import-untyped;
              https://mypy.readthedocs.io/en/stable/config_file.html#follow-untyped-imports
      pydantic-mypy:
        init_forbid_extra: true
        init_typed: true
        warn_required_dynamic_aliases: true
      pyright:
        strict-settings:
          pythonPlatform: Linux
          pythonVersion: "3.13"
          typeCheckingMode: strict
        extended-settings:
          reportCallIssue: error
          reportConstantRedefinition: error
          reportIncompatibleMethodOverride: error
          reportInconsistentConstructor: error
          reportMissingImports: error
          reportMissingModuleSource: error
          reportPrivateUsage: error
          reportUnnecessaryCast: error
          reportUnnecessaryComparison: error
          reportUnnecessaryIsInstance: error
          reportUnusedClass: error
          reportUnusedFunction: error
          reportUnusedImport: error
          reportUnusedVariable: error
        path-rules:
          # Source and tracked consumer surfaces are all
          # first-class environments so no analyzer can hide their diagnostics.
          source-dir: src
          project-root: .
          env-dirs: [src, tests, examples, scripts]
          test-like-dirs: [tests, examples, scripts]
          default-excludes:
            - "**/node_modules"
            - "**/__pycache__"
            - "**/__pyrefly_virtual__/**"
            - "**/.mypy_cache"
            - "**/.ruff_cache"
            - "**/.pytest_cache"
            - "**/.*"
            - .git
            - .reports
            - vendor
            - .venv
            - "**/.venv"
            - "**/.venv/**"
            - "**/venv"
            - "**/venv/**"
            - "**/site-packages"
            - "**/site-packages/**"
            - "**/dist-packages"
            - "**/dist-packages/**"
          root-typings-paths: []
          project-typings-paths: []
          ignored-diagnostic-globs: []
          diagnostic-path-overrides: []
          source-report-private-usage: error
          test-like-report-private-usage: error
          other-report-private-usage: error
      coverage:
        source: [src]
        show-missing: true
        skip-covered: false
        precision: 2
        exclude-also:
          - "if _t.TYPE_CHECKING:"
          - "if TYPE_CHECKING:"
          - "if typing.TYPE_CHECKING:"
        omit:
          - "*/dependency_injector/providers.pyx"
          # Declaration-layer Protocol facades have no runtime behavior to cover.
          - "*/protocols.py"
          - "*/_protocols/*"
      pyrefly:
        disable-project-excludes-heuristics: true
        python-version: "3.13"
        use-ignore-files: false
        # prop-decorator suspension lives in the MYPY ruling surface above
        # (ruling-disable-error-codes): the pyrefly release the non-producer
        # repositories resolve does not know the code and rejects it as an
        # unknown variant, so a pyrefly-side suspension cannot be fleet-wide.
        strict-errors:
          # --- type safety ---
          - bad-argument-count
          - bad-argument-type
          - bad-assignment
          - bad-class-definition
          - bad-context-manager
          - bad-dunder-all
          - bad-function-definition
          - bad-index
          - bad-instantiation
          - bad-keyword-argument
          - bad-match
          - bad-param-name-override
          - bad-raise
          - bad-return
          - bad-specialization
          - bad-typed-dict
          - bad-typed-dict-key
          - bad-unpacking
          - deprecated
          - implicit-abstract-class
          - implicit-any
          - implicit-import
          - implicitly-defined-attribute
          - inconsistent-inheritance
          - inconsistent-overload
          - invalid-annotation
          - invalid-argument
          - invalid-decorator
          - invalid-inheritance
          - invalid-literal
          - invalid-overload
          - invalid-param-spec
          - invalid-pattern
          - invalid-self-type
          - invalid-super-call
          - invalid-type-alias
          - invalid-type-var
          - invalid-type-var-tuple
          - invalid-variance
          - invalid-yield
          - missing-argument
          - missing-attribute
          - missing-import
          - missing-module-attribute
          - missing-override-decorator
          - missing-source
          - missing-source-for-stubs
          - no-access
          - no-matching-overload
          - not-a-type
          - not-async
          - not-callable
          - not-iterable
          - not-required-key-access
          - open-unpacking
          - protocol-implicitly-defined-attribute
          - read-only
          - redefinition
          - redundant-cast
          - redundant-condition
          - unannotated-attribute
          - unannotated-parameter
          - unannotated-return
          - unbound-name
          - unexpected-keyword
          - unexpected-positional-argument
          - unknown-name
          - unnecessary-comparison
          - unnecessary-type-conversion
          - unreachable
          - unresolvable-dunder-all
          - unsafe-overlap
          - unsupported
          - unsupported-delete
          - unsupported-operation
          - untyped-import
          - unused-coroutine
          - unused-ignore
          - variance-mismatch
          - inconsistent-overload-default
        project-exclude-globs:
          - "**/__pycache__"
          - "**/__pyrefly_virtual__/**"
          - "**/node_modules"
          - "**/.venv/**"
          - "**/site-packages/**"
          - "**/typings/**"
          - "**/venv/**"
          - "**/vendor/**"
          - ".venv/**"
          - "typings/**"
          - "vendor/**"
        path-rules:
          source-dir: src
          project-root: .
          env-dirs: [src, tests, examples, scripts]
          root-typings-paths: []
          project-typings-paths: []
          workspace-include-children: false
          workspace-include-child-env-dirs: []
          # Empty: scripts/ owns scripts/__init__.py, so every script module
          # resolves as `scripts.*` with the repo root as CWD. Adding "." or
          # "scripts" here makes the same file reachable under a second module
          # name, which mypy reports as source-file-found-twice. scripts/ is
          # analyzed because `files` names it, not because the search path
          # does.
          project-shared-search-paths: []
      pytest:
        # Scaffold and modernizer consume one complete pytest model. A case that
        # does not fit case-timeout-seconds is a test defect to optimize; the
        # aggregate run-timeout-seconds independently terminates an incomplete
        # full suite.
        case-timeout-seconds: 10
        # Slow marks are a narrow integration-harness budget, not permission
        # for an unbounded test. Cases that exceed it require owner repair.
        slow-timeout-seconds: 30
        # The run budget covers the budgeted phase only; items carrying this
        # native pytest marker run in their own phase, each within
        # slow-timeout-seconds (pytest-timeout marker), selected with the
        # native -m expression.
        slow-marker: slow
        # A local suite that cannot finish within run-timeout-seconds is a
        # performance defect. The generated process wall is derived from this
        # value and the termination grace by the typed model; no second timeout
        # source exists.
        run-timeout-seconds: 120
        run-timeout-overrides:
          # `make profile-test` on 2026-09-30 selected 3354 cases in 26.04s;
          # the 120s entry clock stopped the suite after 112 cases/25.62s.
          # This measurement ceiling permits a complete cold profile before
          # tightening the limit to the observed full-suite runtime.
          flext-infra: 1200
          # cosmos-charts cold suite measured on a 12-core local runner:
          # the 120s entry clock SIGTERM'd the suite at 51% (~235s projected
          # full runtime; the member CI completes inside the fleet default on
          # its runners). This measurement ceiling permits a complete cold
          # local run of the 241-case suite.
          cosmos-charts: 600
          # algar-oud-mig budgeted suite measured on 2026-10-03 (operator
          # exception docs/guides/testing.md: the global budget is 180s):
          # the 124s entry clock SIGTERM'd the suite at 64% (~194s projected
          # full runtime) once every OUD-bound case started owning a per-test
          # LDAP namespace (worker+run token, teardown included). This
          # measurement ceiling covers the documented operator budget plus
          # the namespace lifecycle overhead before the measured
          # parallel-worker ceiling lands.
          algar-oud-mig: 300
          # cosmos-docgen slow phase measured on 2026-10-06: the full-slow
          # selection (~44 real-work cases: isolated-workspace builds, deck
          # and document renders, subprocess resolvers) reaches ~150s wall on
          # a cold testmon database, so the 120s entry clock SIGTERM'd the
          # phase with 43 cases green. This measurement ceiling permits a
          # complete cold slow phase; the budgeted phase completes inside the
          # fleet default.
          cosmos-docgen: 600
        termination-grace-seconds: 2
        # One failure stops the invocation. The next run starts from the
        # corrected owner instead of accumulating a backlog of unrelated
        # failures.
        max-failures: 1
        enforcement-plugin: flext_tests_enforcement
        asyncio-default-fixture-loop-scope: function
        progress-args: [--verbose]
        report-args: [-ra, --durations=25, --durations-min=0.001, --tb=short]
        diagnostic-args: [-rA, --durations=0, --tb=long, --showlocals]
        # One worker makes maxfail exact: no second in-flight case can fail
        # after the first failure has stopped the invocation.
        parallel-workers: 1
        # Per declared-project worker ceilings ([project].name → workers),
        # resolved by the runner over the default above: a consumer whose
        # measured suite cannot fit the single-worker process boundary
        # declares its ceiling here, inside the fleet cycle, instead of
        # patching projections. With workers > 1 maxfail still stops the
        # invocation; in-flight cases may report after the stop, which the
        # declaring consumer accepts by declaring.
        parallel-worker-overrides:
          cosmos-docgen:
            workers: 4
          # The measured ceiling for this suite; higher ceilings regressed the
          # cold run because per-window dispatch overhead dominates.
          flext-infra:
            workers: 4
          # flext-tests slow phase measured 2026-10-02 (load ~7, 20 cores):
          # 34 slow items, 89.4s of call time across 32 of them; every item
          # passes, but each pytester case boots a child pytest with the full
          # facade stack, so the serial phase reached the 120s entry clock at
          # its 33rd item. The cases are host-lock and namespace isolated.
          flext-tests:
            workers: 1
          # CPU-fraction ceilings (cpu_fraction: "n/d") resolve at runtime
          # against the process CPU count.
        # Reserve physical memory for each xdist worker and its child process
        # tree; this bound may reduce the tested ceiling on smaller hosts.
        # Reserve physical memory for each xdist worker and its child process
        # tree; this bound may reduce the tested ceiling on smaller hosts.
        parallel-worker-memory-gb: 2
        # Keep scheduling centralized within the measured worker budget.
        parallel-distribution: load
        # xdist queues the shutdown marker behind each worker's pre-dispatched
        # chunk, so a larger chunk delays the declared max-failures stop until
        # every worker drains its assigned items. One test per dispatch step
        # makes that stop immediate.
        parallel-schedule-chunk: 1
        profile-sort: cumulative
        profile-limit: 50
        profile-suite-filename: pytest.pstats
        profile-process-directory: profiles
        min-version: "8.0"
        python-classes: ["Test*"]
        python-files: ["*_test.py", "*_tests.py", "test_*.py"]
        # Collect once from the canonical test root. The former list ended in
        # `.` and therefore traversed tests, source, docs, examples, scripts,
        # generated reports, and local runtime state a second time. Executable
        # documentation and auxiliary surfaces remain covered by explicit tests
        # and their lint/Markdown gates rather than duplicate pytest discovery.
        test-paths: [tests]
        # pytest applies filterwarnings last-entry-wins; the conform phase +
        # tomlsort alpha-sort filterwarnings, so any override MUST sort AFTER
        # "error" to survive re-conform. Only module::/once:: sort after 'error'
        # ('m'/'o' > 'e'); default::/always::/ignore:: get reordered before it and
        # lose. The entry names FlextMroViolation because FlextSmellViolation is
        # its SUBCLASS: a filter on the child leaves the parent fatal, which is
        # how MRO violations become errors when a regeneration drops the
        # entry. One entry on the parent keeps
        # both VISIBLE-but-non-fatal, matching the non-strict enforcement policy
        # (flext-tests registers default::{category}); all other warnings stay
        # fatal. See flext-core test_enforcement_warning_visibility.
        filter-warnings:
          [
            error,
            "module::flext_core._constants.enforcement.FlextMroViolation",
            "once::pytest.PytestAssertRewriteWarning",
          ]
        standard-markers:
          - "smoke: public-interface smoke tests"
          - "unit: unit tests"
          - "integration: integration tests"
          - "functional: functional behavior tests"
          - "performance: performance and benchmark tests"
          - "slow: slow-running tests"
          - "docker: tests requiring Docker"
          - "oracle: tests requiring the shared Oracle database"
          - "remote: tests requiring remote/external network services"
          - "e2e: end-to-end integration tests"
          - "edge_cases: edge case tests"
          - "stress: stress tests"
          - "resilience: resilience tests"
          - "discovery: catalog and stream discovery tests"
          - "singer: Singer protocol contract tests"
          - "requires_engine: native check engine required by this test"
        # External-token gates never run inside
        # offline verification (`make test`); the runner records their exclusion.
        # `make test-full` first completes that incremental phase, then executes
        # every marker under the same database and deadline. Existing external
        # tests retain their declared environment and authentication requirements.
        external-gate-markers: [remote, docker]
        # CI and pre-commit share make.ci.value;
        # local and pre-push execution retain slow tests. The full phase of
        # `make test-full` includes these markers in every context.
        ci-excluded-markers: [slow]
        # Fixtures declaring local engines or resolution cannot execute in approval.
        ci-excluded-fixtures:
          [resolved_make_templates, detector_project, mod_workspace, smells_project, _clear_make_ci_token]
        standard-addopts:
          - --benchmark-disable
          - --strict-markers
          - --markdown-docs
          - --durations=10
          # --timeout/--session-timeout are runner-owned and derived
          # from case-timeout-seconds/run-timeout-seconds; never restate them here.
      tomlsort:
        all: true
        in_place: true
        process-timeout-seconds: 60
        sort_first: [project, build-system, tool, dependency-groups]
      vulture:
        # Vulture reports keyword-bearing Protocol signature parameters as
        # unused variables at full confidence,
        # even with --ignore-decorators @runtime_checkable. The declaration-only
        # protocol facet is excluded; production models and runtime code remain scanned.
        exclude: ["*/_protocols/*"]
        min-confidence: 100
        paths: [src]
        verbose: false
      yamlfix:
        line_length: 88
        preserve_quotes: true
        whitelines: 1
        section_whitelines: 1
        explicit_start: false

    lazy-init:
      # Canonical import layer order of the FLEXT import law
      # (operator-ruling-2026-10-08-import-law). Lower index = lower layer;
      # ``other`` holds every module whose path names no declared layer.
      # Runtime imports target equal-or-lower layers; a reverse (higher)
      # import is emitted under ``if TYPE_CHECKING:`` per
      # ``reverse_import_mode``, and a reverse runtime use stays a finding.
      import-layer-order:
        - settings
        - config
        - c
        - t
        - p
        - m
        - u
        - other
        - base
        - services
        - api
        - cli
      reverse-import-mode: type_checking
      forward-import-form: absolute
    mod:
      phases:
        # Component toggles for make mod (rule: toggles are data, not flags).
        import-alignment: true
