# Project-local managed-artifact additions for flext-infra itself.
#
# `Infra.tooling` above is the FLEET policy every generated project inherits.
# This block is the same-file project override that conform merges over it for
# THIS repository only, matching how flext-cli and flext-auth declare theirs.
# A path that exists only here belongs in this block, never in the fleet policy:
# declaring it there writes a dead exemption into every project's pyproject.toml.
ManagedArtifacts:
  Ruff:
    per_file_ignores:
      # OPERATOR-AUTHORIZED 2026-08-08 (rope only, private-member-access only).
      # Rope 1.14 and upstream master expose NO public API to register a PEP 695
      # walker handler, so these private slots ARE the library interface.
      # Vendoring the walker and dropping PEP 695 support were the alternatives;
      # the operator rejected both.
      # The access is written LITERALLY and reported honestly: routing it through
      # getattr with a name constant was refused as a disguised suppression. The
      # typing side is genuinely fixed (pep695_ast_walker narrows via TypeGuard
      # and raises when rope changes its internals), so this exemption covers the
      # ruff rule alone. Removing it reports exactly 12 SLF001, all under _rope/.
      src/flext_infra/_utilities/_rope/**/*.py: [private-member-access]
