# A receiver rewrite to ``r[...]`` is safe only when the canonical result
# facade is bound directly from a public FLEXT package in the same module.
id: r-imported-from-flext
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        pattern: r
        stopBy: end
    - has:
        field: module_name
        regex: "^flext(?:_[a-z0-9_]+)?$"
    - not:
        has:
          kind: aliased_import
          stopBy: end
          has:
            pattern: r
            stopBy: end
