# An import statement inside a function body outside an `if TYPE_CHECKING:`
# guard, or a dynamic `importlib.import_module(...)` call in any of its
# spellings (module attribute, aliased module, imported function).
id: inline-or-dynamic-import
language: python
rule:
  any:
    - all:
        - any:
            - kind: import_statement
            - kind: import_from_statement
        - inside:
            kind: function_definition
            stopBy: end
        - not:
            inside:
              kind: if_statement
              stopBy: end
              has:
                field: condition
                regex: "^(?:typing\\.)?TYPE_CHECKING$"
    - pattern: importlib.import_module($$$ARGS)
    - all:
        - pattern: $ALIAS.import_module($$$ARGS)
        - inside:
            kind: module
            stopBy: end
            has:
              stopBy: end
              pattern: import importlib as $ALIAS
    - all:
        - pattern: import_module($$$ARGS)
        - inside:
            kind: module
            stopBy: end
            has:
              stopBy: end
              pattern: from importlib import import_module
