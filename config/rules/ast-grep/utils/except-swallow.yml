# An except clause whose body only passes or continues (optionally beside
# comments and bare constant expressions such as a docstring): the exception
# is swallowed.
id: except-swallow
language: python
rule:
  kind: except_clause
  has:
    kind: block
    all:
      - has:
          any:
            - kind: pass_statement
            - kind: continue_statement
      - not:
          has:
            pattern: $_
            not:
              any:
                - kind: pass_statement
                - kind: continue_statement
                - kind: comment
                - all:
                    - kind: expression_statement
                    - has:
                        any:
                          - kind: string
                          - kind: concatenated_string
                          - kind: integer
                          - kind: float
                          - kind: ellipsis
                          - kind: "true"
                          - kind: "false"
                          - kind: none
