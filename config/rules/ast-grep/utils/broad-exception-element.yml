# One declared exception element that is Exception or BaseException, or that is
# neither a name nor a dotted name (a call, a subscript, ...).
id: broad-exception-element
language: python
rule:
  any:
    - all:
        - kind: identifier
        - regex: "^(?:Exception|BaseException)$"
    - all:
        - pattern: $_
        - not:
            any:
              - kind: identifier
              - kind: attribute
              - kind: tuple
              - kind: parenthesized_expression
              - kind: as_pattern
              - kind: as_pattern_target
