id: ban-dead-init-module
# `valid` MUST NOT match: a package that projects real symbols, or a
# docstring-only module (a docstring is not dead code).
valid:
  - |
    """Package facade."""

    from __future__ import annotations

    __all__ = ["Owner"]
  - |
    __all__ = ["Owner"]
  - |
    """Documented package shell."""
# `invalid` MUST match: a comment-only module or an empty `__all__`.
invalid:
  - |
    # Package shell whose projection was removed.
  - |
    __all__ = []
  - |
    # Retired facade.
    __all__ = [ ]
