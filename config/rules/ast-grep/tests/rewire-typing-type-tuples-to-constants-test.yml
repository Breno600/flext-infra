id: rewire-typing-type-tuples-to-constants
# `valid` MUST NOT match: the constants owner is already read, the name is a
# typing alias or a nested namespace member, another facade owns it, or the
# construct is text rather than code.
valid:
  - matched = isinstance(value, c.SCALAR_TYPES)
  - alias = t.Scalar
  - kinds = t.Cli.MESSAGE_TYPES
  - kinds = u.SCALAR_TYPES
  - HELP = "read t.SCALAR_TYPES through c"
# `invalid` MUST match: a flat isinstance type tuple read through typings.
invalid:
  - matched = isinstance(value, t.SCALAR_TYPES)
  - pair = isinstance(items, t.SEQUENCE_PAIR_TYPES)
  - kinds = t.CONTAINER_AND_COLLECTION_TYPES
