id: ban-octal-mode-literal
valid:
  - |
    chain_guarded(planned, permission_mode=config.Infra.codegen.modes.directory_private)
  - |
    if mode & 0o100:
        executable = True
  - |
    note = "mode 0o644 is only a literal inside a string"
  - |
    from flext_infra._constants import codegen

    specs = codegen.ARTIFACT_SPECS
invalid:
  - |
    chain_guarded(planned, permission_mode=0o700)
  - |
    plan_file(root, relative, rendered, desired_mode=0o644)
  - |
    def plan(root, relative, rendered, mode: int = 0o644) -> None:
        pass
  - |
    write_new(path, b"", 0o600)
