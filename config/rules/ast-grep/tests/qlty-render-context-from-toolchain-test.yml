id: qlty-render-context-from-toolchain
# `valid` MUST NOT match: the destination set that already renders Qlty from the
# fleet toolchain.
valid:
  - |
    def context(destination: str, codegen: Codegen) -> p.Result[p.Model]:
        if destination in {
            ".envrc",
            ".mise.toml",
            ".python-version",
            c.Infra.QLTY_CONFIG_PATH,
        }:
            return r[p.Model].ok(codegen.toolchain)
        return r[p.Model].ok(codegen)
# `invalid` MUST match: the destination set that omits the Qlty configuration.
invalid:
  - |
    def context(destination: str, codegen: Codegen) -> p.Result[p.Model]:
        if destination in {".envrc", ".mise.toml", ".python-version"}:
            return r[p.Model].ok(codegen.toolchain)
        return r[p.Model].ok(codegen)
