id: config-dict-from-constants
# `valid` MUST NOT match: the canonical spelling, or a module that does not
# import `m` (the rewrite would bind nothing; its owner repairs the import).
valid:
  - |
    from flext_ldap import m
    from typing import ClassVar
    class A:
        model_config: ClassVar[m.ConfigDict] = m.ConfigDict(frozen=True)
  - |
    from flext_ldap import c
    from typing import ClassVar
    class B:
        model_config: ClassVar[c.ConfigDict] = c.ConfigDict(frozen=True)
# `invalid` MUST match: the constants spelling in a module that imports `m`.
invalid:
  - |
    from flext_ldap import m
    from typing import ClassVar
    from algar_sample import c
    class C:
        model_config: ClassVar[c.ConfigDict] = c.ConfigDict(extra="forbid", frozen=True)
  - |
    from sample import c, m, p, t
    from typing import ClassVar
    class D:
        model_config: ClassVar[c.ConfigDict] = c.ConfigDict(
            frozen=True,
            extra="forbid",
        )
