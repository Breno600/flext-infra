id: docs-audit-remove-local-external-classifier
# `valid` MUST NOT match: a classifier that delegates to the docs owner.
valid:
  - |
    class FlextInfraUtilitiesDocsAudit:
        @staticmethod
        def docs_is_external(target: str) -> bool:
            """Return whether a docs link target points outside the repository."""
            return FlextInfraUtilitiesDocs.docs_is_external(target)
# `invalid` MUST match: the duplicated local URL classifier.
invalid:
  - |
    class FlextInfraUtilitiesDocsAudit:
        @staticmethod
        def docs_is_external(target: str) -> bool:
            """Return whether a docs link target points outside the repository."""
            lower: str = u.norm_str(target, case="lower").lstrip("<")
            return lower.startswith(("http://", "https://", "mailto:", "tel:", "data:"))
