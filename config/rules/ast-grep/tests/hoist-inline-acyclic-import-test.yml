# The syntactic shape only: the engine admits a finding when the edge
# $MODULE -> $NAME closes no runtime import cycle (context import-cycle, not),
# so cycle-closing imports are dropped at the engine, not by ast-grep.
id: hoist-inline-acyclic-import
valid:
  - from flext_core import r
  - |
    def run():
        if TYPE_CHECKING:
            from flext_core import r
  - |
    def run():
        from . import sibling
  - |
    def run():
        from flext_core import r, u
  - |
    def run():
        from flext_core import r as result
invalid:
  - |
    def run():
        from flext_infra.deps.modernizer import FlextInfraPyprojectModernizer
        return FlextInfraPyprojectModernizer
  - |
    class Owner:
        def run(self):
            from flext_infra import c
            return c
