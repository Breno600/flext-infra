id: ban-compat-alias
valid:
  - "c = FlextConstants"
  - "t = FlextTypes"
  - "p = FlextProtocols"
  - "m = FlextModels"
  - "u = FlextUtilities"
  - "r = FlextResult"
  - "s = FlextService"
  - "config = FlextInfraConfig.fetch_global()"
invalid:
  - "OldService = NewService"
  - "LegacyClient = CanonicalClient"
  # Syntactic match; the engine admits it only when `tm` is absent from the
  # module's __all__.
  - "tm = FlextTestsMatchers"
