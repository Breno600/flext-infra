id: infer-literal-facade-exports
# Under `from __future__ import annotations` (mandated fleet-side) the
# annotation is never evaluated, so rewriting any `__all__:
# t.VariadicTuple[str]` assignment to the un-annotated form is
# behavior-neutral in every scope. Only the already-un-annotated form and
# OTHER annotations stay valid (no rewrite).
valid:
  - '__all__ = ("Sample", "sample")'
  - '__all__: tuple[str, ...] = ("Sample", "sample")'
invalid:
  - '__all__: t.VariadicTuple[str] = ("Sample", "sample")'
  - "__all__: t.VariadicTuple[str] = ('sample',)"
  - '__all__: t.VariadicTuple[str] = ["Sample", "sample"]'
  - '__all__: t.VariadicTuple[str] = ("Sample", name)'
  - '__all__: t.VariadicTuple[str] = ("Sample", *names)'
  - '__all__: t.VariadicTuple[str] = ("Sample", 1)'
  - '__all__: t.VariadicTuple[str] = ("Sample", f"{name}")'
  - '__all__: t.VariadicTuple[str] = ("Sample", b"sample")'
  - '__all__: t.VariadicTuple[str] = exports()'
  - |
    class Sample:
        __all__: t.VariadicTuple[str] = ("Sample", "sample")
  - |
    if enabled:
        __all__: t.VariadicTuple[str] = ("Sample", "sample")
  - |
    __all__: t.VariadicTuple[str] = (
        "second",
        # Retain comments and the supplied export order.
        "first",
    )
