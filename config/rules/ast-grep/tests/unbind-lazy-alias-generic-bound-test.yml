id: unbind-lazy-alias-generic-bound
# Only the lazy `t.Cli.ResultValue` bound matches; unbounded parameters,
# concrete class bounds, and plain annotations of the same chain are valid.
valid:
  - |
    from flext_infra import t

    def make() -> t.Cli.ResultValue:
        return result
  - |
    class Service[TResult](Base):
        """Unbounded declaration."""
  - |
    class Service[TResult: ResultContract](Base):
        """Concrete class bound."""
invalid:
  - |
    from flext_infra import t

    class Service[TResult: t.Cli.ResultValue](Base):
        """Lazy alias bound on a class generic."""
  - |
    from flext_infra import t

    def handler[TParams, TResult: t.Cli.ResultValue](self) -> None:
        """Lazy alias bound on a method generic."""
