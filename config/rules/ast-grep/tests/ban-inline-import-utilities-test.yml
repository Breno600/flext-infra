id: ban-inline-import-utilities
valid:
  - |
    def resolve() -> object:
        from flext_infra import u
        return u.Infra
  - |
    def resolve() -> object:
        from flext_infra import c, u
        return u.Infra
  - |
    def resolve() -> object:
        from flext_infra._utilities import FlextInfraUtilitiesRopeCore
        return FlextInfraUtilitiesRopeCore
invalid:
  - |
    def resolve() -> object:
        from pathlib import Path
        return Path()
  - |
    def resolve() -> object:
        from flext_infra import workspace
        return workspace
