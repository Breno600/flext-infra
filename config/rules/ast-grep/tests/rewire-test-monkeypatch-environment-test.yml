id: rewire-test-monkeypatch-environment
valid:
  - |
    from tests import u

    def test_settings_environment(self) -> None:
        with u.Tests.env_vars_context({
            expiry_key: expiry_minutes,
            algorithm_key: algorithm,
        }):
            settings = Settings()
            tm.that(settings.expiry_minutes, eq=expiry_minutes)
