id: config-dict-type-from-typings
# `valid` MUST NOT match: canonical annotation, out-of-scope member, or a
# value that does not construct through m.ConfigDict(...).
valid:
  # canonical: the annotation names the single owner
  - |
    from flext_ldif import m
    from typing import ClassVar
    class A:
        model_config: ClassVar[m.ConfigDict] = m.ConfigDict()
  # different member (SettingsConfigDict) out of scope
  - |
    from flext_ldif import m, p
    from typing import ClassVar
    class B:
        model_config: ClassVar[p.SettingsConfigDict] = m.SettingsConfigDict()
  # value not constructed through m.ConfigDict(...): no rewrite target is bound
  - |
    from flext_ldif import p
    from typing import ClassVar
    class C:
        model_config: ClassVar[p.ConfigDict] = ConfigDict(frozen=True)
# `invalid` MUST match and rewrite the annotation to m.ConfigDict.
invalid:
  - |
    from flext_ldif import c, m, p
    from typing import ClassVar
    class D:
        model_config: ClassVar[p.ConfigDict] = m.ConfigDict(extra="forbid")
  - |
    from flext_cli import m, p
    from typing import ClassVar
    class E:
        model_config: ClassVar[p.ConfigDict] = m.ConfigDict(frozen=True)
  # the retired owner is caught as well: t stopped exposing ConfigDict
  - |
    from flext_cli import m, t
    from typing import ClassVar
    class F:
        model_config: ClassVar[t.ConfigDict] = m.ConfigDict(frozen=True)
