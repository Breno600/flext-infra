id: remove-cli-captured-process-timeout-parameter
valid:
  - |
    def _finalize_capture(
        handler,
        exit_status,
        signal_list,
        diag_data,
        buf_out,
        buf_err,
        elapsed,
        *,
        is_timed_out,
    ) -> p.Result[p.Cli.CommandBytesOutput]:
        """Build the final command bytes output after process completion (variant A)."""
        step_one = handler._process_exit_result(
            exit_status,
            signal_list,
            diag_data,
            timed_out=is_timed_out,
        )
        return step_one.map(
            lambda item: m.Cli.CommandBytesOutput(
                stdout=bytes(buf_out),
                stderr=bytes(buf_err),
                outcome=item,
                duration=elapsed,
            )
        )
invalid:
  - |
    def _captured_process_result(
        cls,
        cmd: t.StrSequence,
        return_code: int | None,
        received_signals: list[int],
        diagnostics: t.VariadicTuple[str],
        stdout_output: bytearray,
        stderr_output: bytearray,
        duration: float,
        *,
        timed_out: bool,
        timeout_seconds: int | None,
        timeout_exit_code: int,
    ) -> p.Result[p.Cli.CommandBytesOutput]:
        """Attach captured bytes only after the owned process boundary is empty."""
        return cls._process_exit_result(
            cmd,
            return_code,
            received_signals,
            diagnostics,
            timed_out=timed_out,
            legacy_timeout=timeout_seconds is not None,
            legacy_timeout_seconds=timeout_seconds,
            timeout_exit_code=timeout_exit_code,
        ).map(
            lambda outcome: m.Cli.CommandBytesOutput(
                stdout=bytes(stdout_output),
                stderr=bytes(stderr_output),
                outcome=outcome,
                duration=duration,
            )
        )
