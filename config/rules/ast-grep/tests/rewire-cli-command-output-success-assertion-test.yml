id: rewire-cli-command-output-success-assertion
valid:
  - tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - tm.that(output.outcome.raw_return_code, eq=case.exit_code)
  - |
    tm.that(u.Cli.process_succeeded(first.outcome), eq=True)
    tm.that(u.Cli.process_succeeded(second.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="first")
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="second")
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="diagnostic")
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="diagnostic")
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    if condition:
        tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    else:
        tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    observe(output)
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    # Keep the intervening comment.
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    tm.that(output.outcome.raw_return_code, eq=0, msg="diagnostic")
invalid:
  - tm.that(result.value.outcome.raw_return_code, eq=0)
  - tm.that(output.outcome.raw_return_code, eq=0)
  - tm.that(ok_output.outcome.raw_return_code, eq=0)
  - |
    tm.that(u.Cli.process_succeeded(result.value.outcome), eq=True)
    tm.that(result.value.outcome.raw_return_code, eq=0)
  - |
    tm.that(result.value.outcome.raw_return_code, eq=0)
    tm.that(u.Cli.process_succeeded(result.value.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(result.value.outcome), eq=True)
    tm.that(u.Cli.process_succeeded(result.value.outcome), eq=True)
  - |
    tm.that(output.outcome.raw_return_code, eq=0)
    tm.that(output.outcome.raw_return_code, eq=0)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    tm.that(output.outcome.raw_return_code, eq=0)
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(first.outcome), eq=True)
    tm.that(second.outcome.raw_return_code, eq=0)
  - |
    tm.that(first.outcome.raw_return_code, eq=0)
    tm.that(u.Cli.process_succeeded(second.outcome), eq=True)
  - |
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="diagnostic")
    tm.that(output.outcome.raw_return_code, eq=0)
  - |
    tm.that(output.outcome.raw_return_code, eq=0)
    tm.that(u.Cli.process_succeeded(output.outcome), eq=True, msg="diagnostic")
  - |
    if condition:
        tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
        tm.that(output.outcome.raw_return_code, eq=0)
    else:
        tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
  - |
    if condition:
        tm.that(u.Cli.process_succeeded(output.outcome), eq=True)
    else:
        tm.that(output.outcome.raw_return_code, eq=0)
