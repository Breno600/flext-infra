id: namespace-fixability-bool-boundary
# `valid` MUST NOT match: the concrete bool boundary.
valid:
  - |
    def fixable(module: str) -> bool:
        typings_filename: str = c.Infra.TYPINGS_PY
        return Path(module).name != typings_filename
# `invalid` MUST match: membership in a dynamically typed constants tuple.
invalid:
  - |
    def fixable(module: str) -> bool:
        return Path(module).name not in (c.Infra.TYPINGS_PY,)
