# The syntactic shape only: the engine admits a finding when $MODULE is a
# standard-library module (context stdlib-module), so the third invalid case
# is dropped at the engine, not by ast-grep.
id: hoist-inline-stdlib-import
valid:
  - import os
  - |
    def run():
        if TYPE_CHECKING:
            import os
  - |
    def run():
        from . import sibling
  - |
    def run():
        import os, sys
invalid:
  - |
    def run():
        import os
        return os.getcwd()
  - |
    def run():
        from pathlib import Path
        return Path()
  - |
    def run():
        import flext_core
        return flext_core
