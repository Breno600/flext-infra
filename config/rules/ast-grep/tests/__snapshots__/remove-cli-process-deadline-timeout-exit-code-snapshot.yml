id: remove-cli-process-deadline-timeout-exit-code
snapshots:
  ? |
    m.Cli.ProcessDeadline(
        expires_at_monotonic=expires_at,
        termination_grace_seconds=grace,
        timeout_exit_code=124,
    )
  : fixed: |+
      m.Cli.ProcessDeadline(
          expires_at_monotonic=expires_at,
          termination_grace_seconds=grace,
      )

    labels:
    - source: |-
        m.Cli.ProcessDeadline(
            expires_at_monotonic=expires_at,
            termination_grace_seconds=grace,
            timeout_exit_code=124,
        )
      style: primary
      start: 0
      end: 125
