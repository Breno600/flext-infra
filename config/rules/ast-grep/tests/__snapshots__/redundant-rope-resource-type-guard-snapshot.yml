  ? |
    def _resource(project: p.Infra.RopeProject, path: str) -> p.Infra.RopeResource:
        relative = path.lstrip("/")
        resource = project.get_resource(relative)
        if not isinstance(resource, p.Infra.RopeResource):
            message = f"not a Rope resource: {relative}"
            raise TypeError(message)
        return resource
