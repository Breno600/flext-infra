id: ban-inline-import
valid:
  - |
    import json

    def load() -> object:
        return json.loads("{}")
  - |
    def build() -> object:
        from flext_infra._models import FlextInfraModel
        return FlextInfraModel()
  - |
    def resolve() -> object:
        from flext_infra import u
        return u.Infra
  - |
    from typing import TYPE_CHECKING

    if TYPE_CHECKING:
        from pathlib import Path
  - |
    def typed() -> None:
        if TYPE_CHECKING:
            from pathlib import Path
invalid:
  - |
    def load() -> object:
        import json
        return json.loads("{}")
  - |
    def build() -> object:
        from pathlib import Path
        return Path()
  - |
    def shell() -> object:
        from flext_infra import workspace
        return workspace
  - |
    module = importlib.import_module("json")
  - |
    import importlib as loader
    module = loader.import_module("json")
  - |
    from importlib import import_module
    module = import_module("json")
