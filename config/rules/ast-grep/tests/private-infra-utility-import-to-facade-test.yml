id: private-infra-utility-import-to-facade
# `valid` MUST NOT match: the facade import, or a private module import that
# carries no utility or worktree owner class.
valid:
  - from flext_infra import u
  - from flext_infra._utilities.discovery import helper_function
# `invalid` MUST match: a private owner class imported from its module.
invalid:
  - from flext_infra._utilities.discovery import FlextInfraUtilitiesDiscovery
  - |
    from flext_infra._utilities._worktree.guard import (
        FlextInfraWorktreeGuard,
    )
