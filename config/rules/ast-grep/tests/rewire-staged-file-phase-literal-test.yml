id: rewire-staged-file-phase-literal
valid:
  - |
    publish_file_plan(planned, phase=c.Infra.CodegenStagedFilePhase.LAYOUT)
  - |
    track(phase="docs-projection")
invalid:
  - |
    publish_file_plan(planned, phase="layout")
  - |
    stage(phase="version-file")
  - |
    recover(phase="lazy-init")
  - |
    publish_publication(publication, phase="semantic")
  - |
    stage(layout, phase="conform")
  - |
    record(layout, phase="mod-text")
