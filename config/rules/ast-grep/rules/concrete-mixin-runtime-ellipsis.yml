id: concrete-mixin-runtime-ellipsis
language: python
severity: warning
files:
  - "**/src/**/*.py"
  - "src/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  A concrete Mixin runtime method contains only ellipsis and can shadow later
  FLEXT behavior. Put declaration-only signatures in the canonical p.* Protocol;
  otherwise implement or remove the concrete method after semantic FLEXT review.
  Detection only; do not hide the violation behind TYPE_CHECKING.
rule:
  kind: function_definition
  all:
    - any:
        - pattern: |
            def $METHOD($$$PARAMS):
                ...
        - pattern: |
            def $METHOD($$$PARAMS) -> $RETURN:
                ...
    # Chained neighbor scoping: the method's immediate enclosing class must be
    # the Mixin itself. `inside` with default neighbor stop walks function ->
    # class body block -> class definition, so a Protocol nested inside a
    # concrete Mixin (declaration-only methods) is never flagged.
    - inside:
        kind: block
        inside:
          kind: class_definition
          all:
            - has:
                field: name
                regex: "Mixin$"
            - not:
                has:
                  field: superclasses
                  regex: "(Protocol|ABC)"
    - not:
        inside:
          kind: if_statement
          stopBy: end
          has:
            field: condition
            pattern: TYPE_CHECKING
    - not:
        inside:
          kind: decorated_definition
          stopBy: end
          has:
            pattern: "@abstractmethod"
    - not:
        inside:
          kind: decorated_definition
          stopBy: end
          any:
            - has:
                kind: decorator
                pattern: "@overload"
            - has:
                kind: decorator
                pattern: "@typing.overload"
