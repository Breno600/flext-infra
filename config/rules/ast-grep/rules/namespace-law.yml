# FLEXT namespace law as rule data (enforcement catalog ENFORCE-001, -002,
# -003, -007, -011, -014, -080, -099).
#
# Each document matches one file's syntax; what the project means by a name
# is read from its own sources of truth through metadata.context, evaluated
# by the engine (see the context predicates in the rule plan): the own
# package (pyproject), the runtime closure (installed distributions), the
# runtime aliases a package publishes (its generated lazy exports), the
# aliases the own package binds (its modules' __all__), a module's own
# __all__, and the facade family a module belongs to (__all__ of the module
# or of its family package's facade, over the tooling import-layer order).
# No package, alias or file name is listed here, with one sanctioned
# exception: the lazy defining module literal in ENFORCE-099, which mirrors
# the SSOT constant `c.Infra.LAZY_BOOTSTRAP_MODULE` because a static YAML
# rule cannot read the Python constants catalog.

# ENFORCE-001: every symbol lives inside the module's facade class. A module
# body holds that one class, its alias binding, __all__ and imports; a
# function other than the executable `main` entry point, a value binding that
# is not an alias of a name, and any further class are loose objects.
# Typing declarations are ban-manual-typing-alias-outside-typings's. The one
# admitted value binding is the facade's self-typed singleton: the
# class-nesting cutover itself keeps it at module level (it reads the owner
# while the owner is being defined), and the pattern owner publishes it as
# the process-wide facade instance (`from flext_cli import cli, config`).
id: ban-loose-module-object
language: python
severity: error
files:
  - "src/**/*.py"
  - "**/src/**/*.py"
ignores:
  - "**/tests/**"
  - "**/__init__.py"
  - "**/__main__.py"
  - "**/__version__.py"
  - "**/conftest.py"
  - "**/settings.py"
  - "**/_settings.py"
  - "**/typings.py"
  - "**/_typings.py"
  - "**/_exports.py"
rule:
  any:
    - all:
        - kind: function_definition
        - has:
            field: name
            pattern: $NAME
        - not:
            has:
              field: name
              regex: "^main$"
        - any:
            - inside:
                kind: module
            - inside:
                kind: decorated_definition
                inside:
                  kind: module
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        # The facade's self-typed singleton: the binding reads the owner
        # class while it is being defined, so the class-nesting cutover
        # keeps it at module level; it is admitted only when the
        # annotation, the fetch_global receiver and a class this module
        # defines carry one name.
        - not:
            all:
              - has:
                  kind: assignment
                  all:
                    - has:
                        field: type
                        pattern: $OWNER
                    - has:
                        field: right
                        kind: call
                        has:
                          field: function
                          kind: attribute
                          all:
                            - has:
                                field: object
                                kind: identifier
                                pattern: $OWNER
                            - has:
                                field: attribute
                                kind: identifier
                                regex: "^fetch_global$"
              - inside:
                  kind: module
                  has:
                    kind: class_definition
                    has:
                      field: name
                      pattern: $OWNER
        - has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  pattern: $NAME
              - not:
                  has:
                    field: left
                    regex: "^__\\w+__$"
              - has:
                  field: right
                  pattern: $_
                  not:
                    kind: identifier
              - not:
                  has:
                    field: type
                    regex: "^(?:[A-Za-z_][A-Za-z0-9_]*\\.)*TypeAlias$"
              - not:
                  has:
                    field: right
                    kind: call
                    has:
                      field: function
                      regex: "^(?:[A-Za-z_][A-Za-z0-9_]*\\.)*(?:TypeVar|ParamSpec|TypeVarTuple|NewType)$"
    - all:
        - kind: class_definition
        - has:
            field: name
            pattern: $NAME
        - any:
            - all:
                - inside:
                    kind: module
                - follows:
                    stopBy: end
                    any:
                      - kind: class_definition
                      - kind: decorated_definition
                        has:
                          field: definition
                          kind: class_definition
            - inside:
                kind: decorated_definition
                inside:
                  kind: module
                follows:
                  stopBy: end
                  any:
                    - kind: class_definition
                    - kind: decorated_definition
                      has:
                        field: definition
                        kind: class_definition
    # An import-time expression other than the entry-point call.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: call
            pattern: $NAME
            not:
              has:
                field: function
                regex: "(?:^|\\.)main$"
message: >-
  Loose object at module level: nest `$NAME` inside the module's single facade
  class (only that class, its alias, __all__, imports and a `main` entry
  point live at module level).
---
# ENFORCE-002: a runtime alias is imported from the package root, never from
# one of its modules (`from pkg.models import m` binds the module's own
# rebinding, which type checkers resolve as Any). Private module paths are
# ban-private-import's. The relocation rebinds the name from the root.
id: ban-noncanonical-alias-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  relocation: package-root-import
  context:
    MODULE:
      is: facade-package
    NAME:
      is: runtime-alias
      of: MODULE
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    inside:
      kind: import_from_statement
      field: module_name
  inside:
    kind: import_from_statement
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      regex: "\\."
      not:
        regex: "\\._"
message: >-
  Runtime alias `$NAME` imported from module `$MODULE`: import it from the
  package root.
---
# ENFORCE-003: a module-level import binds an alias the own package defines
# from another package. The family implementation packages, base and
# settings modules extend the parent facades and import their aliases by
# design; the facade modules themselves are matched by file family. The
# relocation rebinds the name from the own package.
id: ban-foreign-namespace-source
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/_constants/**"
  - "**/_models/**"
  - "**/_protocols/**"
  - "**/_typings/**"
  - "**/_utilities/**"
  - "**/base.py"
  - "**/_base.py"
  - "**/settings.py"
  - "**/_settings.py"
metadata:
  relocation: own-package-import
  context:
    MODULE:
      - not: own-package
      - is: facade-package
    NAME:
      - is: local-alias
      - not: file-family
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    inside:
      kind: import_from_statement
      field: module_name
  inside:
    kind: import_from_statement
    inside:
      kind: module
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      not:
        regex: "\\."
message: >-
  Alias `$NAME` imported from `$MODULE`, a package that does not own this
  project's `$NAME`: import it from the own package.
---
# ENFORCE-080: the same foreign source as ENFORCE-003, bound by an import
# nested in a function or class body (annotation-only TYPE_CHECKING imports
# never run).
id: ban-foreign-canonical-alias-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/_constants/**"
  - "**/_models/**"
  - "**/_protocols/**"
  - "**/_typings/**"
  - "**/_utilities/**"
  - "**/base.py"
  - "**/_base.py"
  - "**/settings.py"
  - "**/_settings.py"
metadata:
  relocation: own-package-import
  context:
    MODULE:
      - not: own-package
      - is: facade-package
    NAME:
      - is: local-alias
      - not: file-family
rule:
  kind: dotted_name
  pattern: $NAME
  not:
    inside:
      kind: import_from_statement
      field: module_name
  inside:
    kind: import_from_statement
    not:
      inside:
        kind: module
    has:
      field: module_name
      kind: dotted_name
      pattern: $MODULE
      not:
        regex: "\\."
  all:
    - not:
        matches: inside-type-checking-guard
message: >-
  Alias `$NAME` imported from `$MODULE` inside a body: the own package
  re-exports `$NAME`; import it from there.
---
# ENFORCE-099: a consumer imports another facade package through its public
# root only: a module path below the root is the owner's layout. Runtime
# aliases are ENFORCE-002's and private paths ban-private-import's; a root
# import of a name the root does not declare in __all__ is the type
# checkers' private-import-usage finding. The one sanctioned literal is the
# lazy defining module below: every generated consumer initializer imports
# the lazy helpers from it (contract #1362 — the root bootstrap no longer
# publishes those names), and a static YAML rule cannot read the Python
# constants catalog, so the name mirrors the SSOT constant
# `c.Infra.LAZY_BOOTSTRAP_MODULE` (flext-infra
# src/flext_infra/_constants/codegen_lazy.py, value "flext_core.lazy");
# change the two together.
id: ban-consumer-submodule-import
language: python
severity: error
files:
  - "**/*.py"
metadata:
  context:
    MODULE:
      - not: own-package
      - is: facade-package
    NAME:
      not: runtime-alias
      of: MODULE
rule:
  any:
    - kind: dotted_name
      pattern: $NAME
      not:
        inside:
          kind: import_from_statement
          field: module_name
      any:
        - inside:
            kind: import_from_statement
            has:
              field: module_name
              kind: dotted_name
              pattern: $MODULE
              regex: "\\."
              not:
                any:
                  - regex: "\\._"
                  - regex: "^flext_core\\.lazy$"
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_from_statement
              has:
                field: module_name
                kind: dotted_name
                pattern: $MODULE
                regex: "\\."
                not:
                  any:
                    - regex: "\\._"
                    - regex: "^flext_core\\.lazy$"
    - kind: dotted_name
      pattern: $MODULE
      regex: "\\."
      not:
        any:
          - regex: "\\._"
          - regex: "^flext_core\\.lazy$"
      any:
        - inside:
            kind: import_statement
        - inside:
            kind: aliased_import
            field: name
            inside:
              kind: import_statement
      has:
        nthChild: 1
        kind: identifier
        pattern: $NAME
message: >-
  `$MODULE` is a module path below a facade package root: import the names the
  root publishes, from the root.
---
# ENFORCE-007: a runtime alias is bound only by the module that declares it
# in __all__, exactly once, to the facade class that module defines. Each
# branch captures its own variable, so each carries its own context. A name
# declared in __all__ and never bound is the type checkers'
# unsupported-dunder-all finding. An import of the alias is a binding too:
# mypy keeps the imported type and rejects the later assignment.
id: ban-runtime-alias-rebind
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  context:
    UNDECLARED:
      - is: runtime-alias
      - not: module-export
    REBOUND:
      is: runtime-alias
    SHADOWED:
      is: runtime-alias
    ALIAS:
      is: runtime-alias
rule:
  any:
    # Bound after a module-level import of the same name. Listed first: the
    # engine reads the captures of the first matching branch only, and the
    # undeclared branch matches every module-level binding.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $SHADOWED
        - follows:
            stopBy: end
            kind: import_from_statement
            # A field relation reaches only the first imported name; the
            # module path is the statement's first named child.
            any:
              - has:
                  kind: dotted_name
                  not:
                    nthChild: 1
                  has:
                    kind: identifier
                    pattern: $SHADOWED
              - has:
                  kind: aliased_import
                  has:
                    field: alias
                    pattern: $SHADOWED
    # Bound by a module that does not declare it.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $UNDECLARED
    # Bound twice.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            has:
              field: left
              kind: identifier
              pattern: $REBOUND
        - follows:
            stopBy: end
            kind: expression_statement
            has:
              kind: assignment
              has:
                field: left
                pattern: $REBOUND
    # Bound to a name that is not a class this module defines.
    - all:
        - kind: expression_statement
        - inside:
            kind: module
        - has:
            kind: assignment
            all:
              - has:
                  field: left
                  kind: identifier
                  pattern: $ALIAS
              - has:
                  field: right
                  pattern: $TARGET
        - not:
            inside:
              kind: module
              has:
                kind: class_definition
                has:
                  field: name
                  pattern: $TARGET
        - not:
            inside:
              kind: module
              has:
                kind: decorated_definition
                has:
                  field: definition
                  kind: class_definition
                  has:
                    field: name
                    pattern: $TARGET
# A runtime alias is a public identifier; dunders are module protocol.
constraints:
  UNDECLARED:
    regex: "^[^_]"
  REBOUND:
    regex: "^[^_]"
  SHADOWED:
    regex: "^[^_]"
  ALIAS:
    regex: "^[^_]"
message: >-
  Runtime alias bound outside its owner: the module that declares it in
  __all__ binds it once, to the facade class it defines.
---
# ENFORCE-011: a class lives in the facade family its kind belongs to: a
# class extending a model preset in the models family, an enumeration in
# the constants family, a utilities class in the utilities family. The
# family letter is derived from the declaration and compared with the
# family the module belongs to. Protocol classes are
# ban-manual-protocol-outside-protocols's.
id: ban-class-wrong-facade-layer
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/conftest.py"
  - "**/tests/**"
metadata:
  relocation: facade-class
  context:
    FAMILY:
      not: file-family
rule:
  kind: class_definition
  has:
    field: name
    pattern: $NAME
  all:
    - any:
        - inside:
            kind: module
        - inside:
            kind: decorated_definition
            inside:
              kind: module
  any:
    - has:
        field: superclasses
        has:
          pattern: $KIND
          any:
            - kind: attribute
              regex: "^m\\.\\w+$"
            - kind: identifier
              regex: "^(?:Str|Int)?Enum$"
    - has:
        field: name
        pattern: $KIND
        regex: "Utilities$"
transform:
  ENUM:
    replace:
      source: $KIND
      replace: "^(?:Str|Int)?Enum$"
      by: c
  MODEL:
    replace:
      source: $ENUM
      replace: "^m\\.\\w+$"
      by: m
  FAMILY:
    replace:
      source: $MODEL
      replace: "^\\w+Utilities$"
      by: u
message: >-
  Class `$NAME` belongs to the `$FAMILY` facade family; declare it in that
  family's module or package.
