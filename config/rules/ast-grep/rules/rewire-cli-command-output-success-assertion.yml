id: rewire-cli-command-output-success-assertion
language: Python
severity: error
utils:
  raw-success:
    pattern:
      context: tm.that($OUTPUT.outcome.raw_return_code, eq=0)
      selector: expression_statement
  causal-success:
    pattern:
      context: tm.that(u.Cli.process_succeeded($OUTPUT.outcome), eq=True)
      selector: expression_statement
  success-assertion:
    any:
      - matches: raw-success
      - matches: causal-success
rule:
  all:
    - matches: success-assertion
    # Only the first statement owns a same-outcome run, avoiding overlapping fixes.
    - not:
        follows:
          matches: success-assertion
          stopBy: neighbor
    - any:
        - matches: raw-success
        - precedes:
            matches: success-assertion
            stopBy: neighbor
fix:
  template: tm.that(u.Cli.process_succeeded($OUTPUT.outcome), eq=True)
  expandEnd:
    all:
      - matches: success-assertion
      - not:
          precedes:
            matches: success-assertion
            stopBy: neighbor
    stopBy:
      not:
        matches: success-assertion
message: Assert complete causal command success through the public utility facade.
