# ``model_construct`` builds an instance without running validation, moving the
# failure from the boundary to a downstream AttributeError or bad state. The
# removal catalog allows it only behind a documented owner justification, and
# the framework owner (flext-core) is the only authorized tree.
id: ban-model-construct
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "**/flext_core/**"
rule:
  pattern: $RECEIVER.model_construct($$$ARGS)
message: >-
  `model_construct()` skips validation; the removal catalog allows it only with
  a documented owner justification at flext-core. Build through
  `Model.model_validate(...)` (or the constructor) so the boundary stays loud.
---
# `SkipValidation[...]` and `PlainValidator(...)` switch validation off for
# their target. The removal catalog permits them only behind a documented owner
# justification; real constraints (or a missing `t`/`m` alias to close at the
# owner) are the conforming replacement.
id: ban-skip-validation
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "**/flext_core/**"
rule:
  any:
    - pattern: SkipValidation[$T]
    - pattern: "$$$N: SkipValidation[$T]"
    - pattern: PlainValidator($$$ARGS)
message: >-
  `SkipValidation`/`PlainValidator` remove real validation; the removal catalog
  allows them only behind a documented owner justification at flext-core.
  Declare the real constraint as a `t` alias or close the missing member at its
  facade owner.
---
# A `TypeAdapter` constructed inside a function rebuilds its Rust core on every
# call. The parse-once law: non-model JSON/validation goes through the cached
# `t.TypeAdapters` factory (one adapter per type, module-level owner).
id: ban-local-typeadapter
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "**/flext_core/**"
rule:
  pattern: TypeAdapter($$$ARGS)
  inside:
    stopBy: end
    kind: function_definition
message: >-
  A local `TypeAdapter(...)` rebuilds validators per call. Reuse the cached
  `t.TypeAdapters` factory (one adapter per type) or hoist the adapter to its
  module owner.
---
# A caught ValidationError must not vanish into a sentinel: the handler either
# converts through the canonical typed-failure factories (`e.fail_validation`,
# `r.fail*`) or re-raises. Conversion helpers owned by the framework keep their
# explicit documented defaults (flext-core is exempt by ownership). Handlers
# that return None, a literal fallback, or just `pass` erase the boundary
# failure and are the violation this rule reports.
id: ban-validation-error-catch
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "**/flext_core/**"
rule:
  all:
    - kind: except_clause
      has:
        stopBy: end
        kind: identifier
        regex: "^(?:[A-Za-z_][A-Za-z0-9_.]*\\.)?ValidationError$"
    - not:
        has:
          stopBy: end
          kind: identifier
          regex: "^(?:fail_validation|fail|fail_op)$"
    - not:
        has:
          stopBy: end
          kind: raise_statement
message: >-
  Catching ValidationError into a sentinel or silent default erases the
  boundary failure; convert through `e.fail_validation`/`r.fail` with the
  error preserved, or let it escape.
---
# Pydantic surface is reachable only through facades outside layer-0.
# `_settings.py` is the typed, zero-cycle configuration boundary and may import
# pydantic directly; every consumer above it routes through a package facade.
# The v1 import forms are already owned by ban-pydantic-v1-api.yml.
id: ban-direct-pydantic-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "**/flext_core/**"
  - "**/_settings.py"
rule:
  any:
    - pattern: import pydantic
    - pattern: import pydantic.settings
    - pattern: import pydantic_settings
    - pattern: from pydantic import $$$NAMES
    - pattern: from pydantic_settings import $$$NAMES
message: >-
  Pydantic is import-only through facades above layer-0. Route this consumer
  through its package facade (`m`/`t`/`p`/`u`) and close a missing member at
  flext-core instead of importing directly.
---
# Graduation of the provable subset of `ban-json-loads-paired-validate` to an
# automatic rewrite. The outer `.model_validate` is a Pydantic-v2-exclusive
# method, so the receiver is provably a v2 model; with exactly one positional
# argument, `json.loads($RAW)` and `model_validate_json($RAW)` are equivalent
# for the accepted str/bytes inputs. Multi-argument `json.loads(...)` keeps its
# detection-only finding (no mechanical equivalent).
id: fix-json-loads-paired-validate
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  pattern: $$$MODEL.model_validate(json.loads($RAW))
fix: $$$MODEL.model_validate_json($RAW)
message: >-
  `json.loads` paired with `model_validate` double-parses; with a single
  argument the mechanical equivalent is `model_validate_json($RAW)` (one
  Rust-side pass).
---
# Pairing `json.loads` with `model_validate` parses the payload twice and
# loses Pydantic's single Rust-side pass. JSON enters through
# `model_validate_json` / `TypeAdapter` factory with `validate_json` directly.
id: ban-json-loads-paired-validate
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  pattern: $$$MODEL.model_validate(json.loads($$$RAW))
message: >-
  `json.loads` + `model_validate` double-parses the payload. Use
  `Model.model_validate_json(raw)` (or the cached `TypeAdapter` factory
  with `validate_json`) so parsing and validation run in one pass.
