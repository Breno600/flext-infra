# FLEXT codemod: a model_config annotation must name the single owner of
# ConfigDict, which is `m`. Both other spellings crash at import, because
# neither FlextProtocols nor FlextTypes carries the member:
#
#   model_config: ClassVar[p.ConfigDict] = m.ConfigDict(...)   # defect
#   model_config: ClassVar[t.ConfigDict] = m.ConfigDict(...)   # defect
#                       ->
#   model_config: ClassVar[m.ConfigDict] = m.ConfigDict(...)   # canonical
#
# `t` carried ConfigDict until flext-core consolidated ownership onto `m`; the
# annotation is the same facade the construction value already uses, so the
# rewrite never introduces an unbound name.
#
# Idempotent: only the two broken spellings match; a canonical module yields
# zero matches on re-scan. The value must construct through `m.ConfigDict(...)`, so
# the rewritten annotation never introduces an unbound name. SettingsConfigDict
# is out of scope.
id: config-dict-type-from-typings
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  any:
    - pattern: "model_config: ClassVar[p.ConfigDict] = $VAL"
    - pattern: "model_config: ClassVar[t.ConfigDict] = $VAL"
constraints:
  VAL:
    regex: "^m\\.ConfigDict\\("
fix: "model_config: ClassVar[m.ConfigDict] = $VAL"
message: >-
  model_config annotation must be m.ConfigDict, the single owner of the member. Neither p.ConfigDict nor t.ConfigDict exists, so the module crashes at import. The construction value m.ConfigDict(...) is kept.
