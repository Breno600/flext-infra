# Detection-only companion of typing-dict-to-mapping-kv.
#
# Flags a legacy `Dict[K, V]` / `typing.Dict[K, V]` generic whose module does NOT
# bind the typings facade `t`. The canonical form is `t.MappingKV[K, V]`, but a
# blind rewrite here would emit an undefined name (`t`), causing Ruff F821 /
# Pyrefly missing-name. This rule has NO `fix:` on purpose: the `t` import must
# be added first (`from <ns> import ..., t`), after which typing-dict-to-mapping-kv
# rewrites the annotation safely.
#
# Why the split: ast-grep cannot conditionally insert an import in a single
# textual `fix`, and `ruff --fix` only removes unused imports (never adds a
# missing one). So an import-unsafe rewrite is emitted as a detection, per the
# library's "detection only when a generic textual fix would be unsafe" contract.
id: typing-dict-missing-t-import
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  any:
    - all:
        - pattern:
            context: "def f(x: Dict[$K, $V]) -> None: ..."
            selector: generic_type
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - all:
        - pattern:
            context: "ALIAS = Dict[$K, $V]"
            selector: subscript
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - pattern:
        context: "ALIAS = typing.Dict[$K, $V]"
        selector: subscript
  inside:
    stopBy: end
    kind: module
    not:
      has:
        stopBy: end
        matches: t-locally-bound
message: >-
  typing.Dict must become t.MappingKV[K, V], but this module does not import `t`.
  Add the typings import first, then typing-dict-to-mapping-kv rewrites it. No
  auto-fix here to avoid emitting an undefined name (Ruff F821 / Pyrefly).
---
# Family file for the typing.Dict modernization pair: the auto-fixing rewrite
# and its detection-only missing-import companion select the same three
# generic shapes and differ only in the `t` binding guard.
id: typing-dict-to-mapping-kv
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  any:
    - all:
        - pattern:
            context: "def f(x: Dict[$K, $V]) -> None: ..."
            selector: generic_type
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - all:
        - pattern:
            context: "ALIAS = Dict[$K, $V]"
            selector: subscript
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              matches: dict-imported-from-typing
    - pattern:
        context: "ALIAS = typing.Dict[$K, $V]"
        selector: subscript
  inside:
    stopBy: end
    kind: module
    has:
      stopBy: end
      matches: t-locally-bound
fix: "t.MappingKV[$K, $V]"
message: >-
  typing.Dict is retired; the canonical mapping annotation is t.MappingKV[K, V].
