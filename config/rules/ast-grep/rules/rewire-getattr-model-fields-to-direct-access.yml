# A textual replacement cannot distinguish a model from an untrusted argument.
# The semantic model-fields phase preserves the boundary's rejecting branch.
id: rewire-getattr-model-fields-to-direct-access
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  any:
    - pattern: getattr($OBJ, $NAME, $DEFAULT)
    - pattern: getattr($OBJ, $NAME)
constraints:
  NAME:
    regex: "^['\"]model_fields['\"]$"
message: >-
  Validate the model-class receiver before accessing model_fields through the
  semantic model-fields migration. An ambiguous receiver remains a finding.
