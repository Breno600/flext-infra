# The removed _header namespace is never a runtime dependency.
id: rewire-transformer-header-module-call
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
ignores:
  - "**/utilities.py"
rule:
  pattern: $HEADER.$METHOD($$$ARGS)
constraints:
  HEADER:
    regex: "^_header$"
  METHOD:
    regex: "^(?:alias_locally_bound|alias_used|ensure_alias_import|ensure_future_annotations|has_alias_import)$"
fix: u.Infra.$METHOD($$$ARGS)
message: Consume the removed module header namespace through u.Infra.
