# A third-party library with an owning FLEXT facade is imported at runtime
# only by its owner; every other package routes through the owner's facade.
# One document per owning distribution, split per library where the
# enforcement catalog names a library rule; `metadata.owner` names the owning distribution,
# whose own rule plan drops the rule. Imports under `if TYPE_CHECKING:` never
# run and are outside the boundary. Configuration (`_config.py`) and settings
# modules are layer-0 of the c/t/p/m/u chain and import their foundation
# libraries directly.
#
# Detection only: the facade member that replaces a direct use is chosen per
# call site.
id: ban-direct-pydantic-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/_config.py"
  - "**/_settings.py"
metadata:
  owner: flext-core
rule:
  all:
    - any:
        - all:
            - kind: import_statement
            - has:
                stopBy: end
                kind: dotted_name
                regex: "^(?:pydantic|pydantic_core)(?:\\.|$)"
        - all:
            - kind: import_from_statement
            - has:
                field: module_name
                regex: "^(?:pydantic|pydantic_core)(?:\\.|$)"
    - not:
        matches: inside-type-checking-guard
message: >-
  pydantic is owned by flext-core: use m.BaseModel, m.ConfigDict, m.TypeAdapter, u.Field and the other m/t/u facade members, and close a missing member at flext-core.
---
