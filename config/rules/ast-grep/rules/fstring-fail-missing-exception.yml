id: fstring-fail-missing-exception
language: python
severity: error
message: >-
  Interpolating a caught exception into r.fail drops its typed cause. Preserve
  the bound exception explicitly or use a contextual e.fail_* factory.
rule:
  pattern: $R.fail($MESSAGE)
  all:
    - has:
        field: arguments
        has:
          kind: interpolation
          stopBy: end
          has:
            field: expression
            kind: identifier
            pattern: $EXC
    - not:
        has:
          kind: keyword_argument
          stopBy: end
          has:
            field: name
            regex: "^exception$"
    - inside:
        kind: except_clause
        stopBy: end
        has:
          field: value
          kind: as_pattern
          has:
            field: alias
            kind: as_pattern_target
            has:
              kind: identifier
              pattern: $EXC
constraints:
  R:
    regex: '^r(?:\[.+\])?$'
fix: "$R.fail($MESSAGE, exception=$EXC)"
---
id: fstring-fail-missing-exception-review
language: python
severity: error
message: >-
  A caught exception is interpolated into r.fail with additional arguments.
  Preserve the typed exception explicitly while retaining every existing
  argument.
rule:
  pattern: $R.fail($MESSAGE, $NAME=$VALUE)
  all:
    - has:
        field: arguments
        has:
          kind: interpolation
          stopBy: end
          has:
            field: expression
            kind: identifier
            pattern: $EXC
    - not:
        has:
          kind: keyword_argument
          stopBy: end
          has:
            field: name
            regex: "^exception$"
    - inside:
        kind: except_clause
        stopBy: end
        has:
          field: value
          kind: as_pattern
          has:
            field: alias
            kind: as_pattern_target
            has:
              kind: identifier
              pattern: $EXC
constraints:
  R:
    regex: '^r(?:\[.+\])?$'
fix: "$R.fail($MESSAGE, $NAME=$VALUE, exception=$EXC)"
---
id: fstring-fail-missing-exception-positional-review
language: python
severity: error
message: >-
  A caught exception is interpolated into r.fail with positional metadata whose
  contract cannot be inferred mechanically. Use its public keyword and preserve
  the typed exception explicitly.
rule:
  pattern: $R.fail($MESSAGE, $POSITIONAL)
  all:
    - has:
        field: arguments
        has:
          kind: interpolation
          stopBy: end
          has:
            field: expression
            kind: identifier
            pattern: $EXC
    - not:
        has:
          kind: keyword_argument
          stopBy: end
          has:
            field: name
            regex: "^exception$"
    - inside:
        kind: except_clause
        stopBy: end
        has:
          field: value
          kind: as_pattern
          has:
            field: alias
            kind: as_pattern_target
            has:
              kind: identifier
              pattern: $EXC
constraints:
  R:
    regex: '^r(?:\[.+\])?$'
  POSITIONAL:
    not:
      kind: keyword_argument
