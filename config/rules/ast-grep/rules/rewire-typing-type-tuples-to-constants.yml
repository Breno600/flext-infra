id: rewire-typing-type-tuples-to-constants
language: Python
severity: error
files:
  - "**/*.py"
rule:
  pattern: t.$NAME
constraints:
  NAME:
    # ENFORCE-079 places every isinstance type tuple on FlextConstantsGuards
    # (flext-core _constants/guards.py) under the *_TYPES convention, and no
    # typings facade in the fleet declares one: a flat t.<NAME>_TYPES read is a
    # stale consumer of that constant, so the convention selects the rewrite.
    regex: "^[A-Z][A-Z0-9_]*_TYPES$"
fix: c.$NAME
message: >-
  The isinstance type tuples are runtime constants owned by FlextConstantsGuards
  (ENFORCE-079); read them as c.<NAME>, never through the typings facade.
