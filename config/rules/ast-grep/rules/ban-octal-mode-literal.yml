id: ban-octal-mode-literal
language: python
severity: error
files:
  - "src/flext_infra/**"
ignores:
  - "**/tests/**"
  - "**/_constants/**"
  - "**/_models/**"
  - "**/bootstrap.py"
rule:
  kind: integer
  pattern: $MODE
  regex: "^0o(644|600|700|755|664)$"
message: >-
  Mode literal duplicates the config SSOT: read
  config.Infra.codegen.modes (file_default / file_private /
  directory_private / directory_generated) instead of hardcoding an octal
  mode at the call site.
