# Removed module functions migrate to the one public u.Infra owner.
id: rewire-transformer-header-function-call
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
ignores:
  - "**/utilities.py"
rule:
  pattern: $METHOD($$$ARGS)
constraints:
  METHOD:
    regex: "^(?:alias_locally_bound|ensure_future_annotations)$"
fix: u.Infra.$METHOD($$$ARGS)
message: Consume module-header functions through u.Infra.
