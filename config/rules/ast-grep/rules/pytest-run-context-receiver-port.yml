# Only the profiling receipt observer in the existing runner is migrated.
# The Pydantic payload, optional default and call sites remain unchanged.
# p is already bound by the runner's TYPE_CHECKING import; never inject a
# runtime models/protocols import or rewrite arbitrary Callable annotations.
id: pytest-run-context-receiver-port
language: python
severity: error
files:
  - "src/flext_infra/validate/_pytest_runner/execution.py"
utils:
  pytest-runner-method-body:
    kind: block
    inside:
      kind: class_definition
      has:
        field: name
        regex: "^FlextInfraPytestRunnerExecution$"
rule:
  all:
    - pattern:
        context: "def f(*, run_context_receiver: Callable[[m.Infra.PytestRunContext], None] | None = None): ..."
        selector: typed_default_parameter
    - inside:
        kind: parameters
        inside:
          kind: function_definition
          has:
            field: name
            regex: "^(execute|_execute_testmon)$"
          inside:
            any:
              - matches: pytest-runner-method-body
              - kind: decorated_definition
                inside:
                  matches: pytest-runner-method-body
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          pattern: |
            if TYPE_CHECKING:
                from flext_infra import p
fix: "run_context_receiver: p.Infra.PytestRunContextReceiver | None = None"
message: >-
  Inject the named pytest receipt port through p.Infra, preserving the existing
  PytestRunContext payload and optional observer semantics. The protocol is
  declared in FlextInfraProtocolsCheck and exposed by the generated facade MRO.
