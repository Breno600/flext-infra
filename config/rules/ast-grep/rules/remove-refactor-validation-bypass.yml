# Remove callers' ability to bypass the single mandatory refactor validation path.

id: remove-refactor-validation-selector
language: Python
severity: error
rule:
  all:
    - kind: keyword_argument
    - has:
        field: name
        regex: "^(?:apply_safety|gates)$"
    - inside:
        any:
          - pattern: $SERVICE.refactor_project($$$ARGS)
          - pattern: $SERVICE.refactor_file($$$ARGS)
          - pattern: $SERVICE.refactor_files($$$ARGS)
        stopBy: end
fix: ""
message: Refactor validation has one mandatory path; remove the bypass selector.
