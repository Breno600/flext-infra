# Canonical FLEXT import-form law (operator spec 2026-10-06): the facade
# letters of one package bind in ONE root-combined statement —
# `from flext_core import c, m, p, t, u`. The facade-file form
# (`from flext_core.typings import t`), the alias-split form
# (`from flext_core import typings as t`) and the relative form are all
# noncanonical. Subpackage facades (`from flext_infra.refactor.typings import
# t`) are a module's own family surface, not a package letter, and stay out
# of scope here.
#
# The engine repairs what it captures through the shared relocation cascade
# (`import-normalization`): the same canonical pass fix-namespace,
# fix-accessors and the make mod loop run over every governed source file,
# merging each parent block's letters in the declared layer order
# c, t, p, m, u and demoting a letter the module's own layer may not bind
# eagerly to its point of use.
id: import-letter-noncanonical-form
language: python
severity: error
files:
  - "src/**/*.py"
  - "**/src/**/*.py"
ignores:
  - "**/__init__.py"
metadata:
  relocation: import-normalization
rule:
  any:
    # Facade-file form: the letter bound through the family facade module.
    - all:
        - kind: import_from_statement
        - regex: "^from\\s+flext_\\w+\\._?(constants|typings|protocols|models|utilities)\\s+import\\s+[cmptu](\\s*,\\s*[cmptu])*\\s*$"
    # Alias-split form: the family module aliased to its letter.
    - all:
        - kind: import_from_statement
        - regex: "^from\\s+flext_\\w+\\s+import\\s+(constants|typings|protocols|models|utilities)\\s+as\\s+[cmptu]\\s*$"
    # Relative form: the letter bound through a relative facade module.
    - all:
        - kind: import_from_statement
        - regex: "^from\\s+\\.+_?(constants|typings|protocols|models|utilities)\\s+import\\s+[cmptu](\\s*,\\s*[cmptu])*\\s*$"
message: >-
  Bind the package's facade letters in one root-combined statement
  (`from <pkg> import c, m, p, t, u`); the engine merges the forms this rule
  captures into it.
