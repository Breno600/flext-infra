# pyproject and lock metadata is parsed once, by the canonical metadata and
# TOML utilities (flext-core project metadata, flext-cli TOML); flext-infra
# source consumes their typed results and never parses TOML itself. Imports
# under `if TYPE_CHECKING:` never run and are outside the boundary.
#
# Detection only: the replacement utility is chosen per call site.
id: ban-infra-metadata-parser-import
language: python
severity: error
files:
  - "**/src/flext_infra/**/*.py"
rule:
  all:
    - any:
        - all:
            - kind: import_statement
            - has:
                stopBy: end
                kind: dotted_name
                regex: "^tomllib(?:\\.|$)"
        - all:
            - kind: import_from_statement
            - has:
                field: module_name
                regex: "^tomllib(?:\\.|$)"
    - not:
        matches: inside-type-checking-guard
message: >-
  flext-infra never parses TOML metadata directly: route pyproject and lock
  reads through the canonical metadata and TOML utilities.
