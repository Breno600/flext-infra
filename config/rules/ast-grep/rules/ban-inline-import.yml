# Imports are module-level facts. An import statement inside a function body
# (outside an `if TYPE_CHECKING:` guard) and a dynamic
# `importlib.import_module(...)` call hide a dependency from the module graph.
#
# Package initialisers and the lazy-export owner (`flext_core/lazy.py`) load
# modules by design and are out of scope. Private utility members are scoped by
# the sibling document below: a member of a still-assembling `u` facade binds
# its own package's facade letters at the method point of use
# (ban-infra-utility-module-self-facade-import), and that one import shape is
# the only function-local import they may hold.
#
# Detection only: hoisting an import can create an initialisation cycle, so the
# move is decided by the rope import phase, not by a token rewrite.
id: ban-inline-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/flext_core/lazy.py"
  - "**/beartype/**"
  - "**/_utilities/**"
rule:
  matches: inline-or-dynamic-import
message: >-
  Inline or dynamic import: declare the dependency at module level.
---
id: ban-inline-import-utilities
language: python
severity: error
files:
  - "**/_utilities/**/*.py"
ignores:
  - "**/__init__.py"
rule:
  all:
    - matches: inline-or-dynamic-import
    - not:
        regex: "^from\\s+flext_[a-z_]+\\s+import\\s+[cmptu](?:\\s*,\\s*[cmptu])*$"
message: >-
  Inline or dynamic import in a utility member: only the package's own facade
  letters are bound at the method point of use.
---
# Repair of ban-inline-import for standard-library imports: a stdlib module
# cannot form an initialisation cycle with project code, so the engine moves
# the statement to the module import block (relocation module-import). The
# imported module is captured as $MODULE and the engine admits the finding
# only when it belongs to the interpreter's standard library
# (context stdlib-module, read from sys.stdlib_module_names).
id: hoist-inline-stdlib-import
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/__init__.py"
  - "**/flext_core/lazy.py"
  - "**/beartype/**"
  - "**/_utilities/**"
metadata:
  relocation: module-import
  context:
    MODULE:
      is: stdlib-module
rule:
  all:
    - any:
        - all:
            - kind: import_statement
            - has:
                pattern: $MODULE
                any:
                  - kind: dotted_name
                  - kind: aliased_import
            - not:
                has:
                  nthChild: 2
                  pattern: $_
        - all:
            - kind: import_from_statement
            - has:
                field: module_name
                kind: dotted_name
                pattern: $MODULE
    - inside:
        kind: function_definition
        stopBy: end
    - not:
        matches: inside-type-checking-guard
message: >-
  A standard-library import inside a function body belongs to the module
  import block; the engine hoists it.
