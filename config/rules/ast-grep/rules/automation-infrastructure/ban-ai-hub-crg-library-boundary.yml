id: ban-infra-ai-hub-crg-library-import
language: Python
severity: error
files:
  - "src/flext_infra/**/*.py"
message: Use AI Hub only through its selected external runtime surface; never import AI Hub or CRG libraries into flext-infra.
rule:
  any:
    - all:
        - kind: import_from_statement
        - regex: '^from\s+(?:ai_hub|crg|code_relationship_graph)(?:\.|\s)'
    - all:
        - kind: import_statement
        - regex: '^import\s+(?:[^#\n]*,\s*)?(?:ai_hub|crg|code_relationship_graph)(?:\.|\s|,|$)'
---
id: ban-infra-ai-hub-crg-dynamic-library-import
language: Python
severity: error
files:
  - "src/flext_infra/**/*.py"
message: Dynamic library loading cannot bypass the external AI Hub runtime boundary.
rule:
  any:
    - pattern: __import__($MODULE)
    - pattern: importlib.import_module($MODULE)
constraints:
  MODULE:
    regex: '^["\x27](?:ai_hub|crg|code_relationship_graph)(?:\.|["\x27])'
---
id: ban-infra-crg-function-implementation
language: Python
severity: error
files:
  - "src/flext_infra/**/*.py"
message: CRG behavior belongs to the optional AI Hub runtime; flext-infra cannot implement CRG functions.
rule:
  all:
    - kind: function_definition
    - regex: '(?i)^(?:async\s+)?def\s+[a-z0-9_]*crg[a-z0-9_]*\s*\('
---
id: ban-infra-crg-class-implementation
language: Python
severity: error
files:
  - "src/flext_infra/**/*.py"
message: CRG behavior belongs to the optional AI Hub runtime; flext-infra cannot implement CRG classes.
rule:
  all:
    - kind: class_definition
    - regex: '(?i)^class\s+[a-z0-9_]*crg[a-z0-9_]*\s*(?:\(|:)'
