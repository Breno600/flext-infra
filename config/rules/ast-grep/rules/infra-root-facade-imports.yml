id: rewire-infra-constants-submodule-import-to-root-facade
language: Python
severity: error
files:
  - "src/flext_infra/**/*.py"
  - "tests/**/*.py"
rule:
  pattern: from flext_infra.constants import c
fix: from flext_infra import c
message: >-
  Import the typed root facade `c` from flext_infra; the
  flext_infra.constants submodule rebinds `c` over the imported
  flext-cli facade, which type checkers resolve as Any.
---
