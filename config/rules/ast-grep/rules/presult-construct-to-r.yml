id: presult-construct-to-r-ok
language: python
severity: error
message: >-
  p.Result[T] is an annotation protocol, not a constructor. Construct with the
  concrete r[T] alias while retaining p.Result[T] as the return contract.
rule:
  pattern: p.Result[$T].ok($$$A)
  inside:
    kind: module
    stopBy: end
    has:
      matches: r-imported-from-flext
      stopBy: end
fix: "r[$T].ok($$$A)"
---
