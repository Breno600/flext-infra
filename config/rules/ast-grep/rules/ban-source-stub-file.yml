# Source type hints are the single source of truth: a hand-written `.pyi`
# stub inside a package source tree competes with the module it shadows.
# Delete the stub and keep the hints in the module.
id: ban-source-stub-file
language: python
severity: error
files:
  - "**/src/**/*.pyi"
rule:
  kind: module
message: >-
  A hand-written .pyi stub in a package source tree duplicates the module's
  own type hints; delete it and keep the hints in the module.
