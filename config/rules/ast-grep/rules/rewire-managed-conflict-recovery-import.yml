# Remove the retired concrete owner after every caller uses the u.Infra facade.
id: rewire-managed-conflict-recovery-import
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
  - "flext-infra/tests/**/*.py"
ignores:
  - "**/__init__.py"
rule:
  pattern: from flext_infra.codegen.managed_conflicts import FlextInfraCodegenManagedConflicts
fix: from flext_infra import u
message: Remove the deleted managed-conflict implementation import.
