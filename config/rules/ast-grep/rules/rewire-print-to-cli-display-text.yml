# Recomposition of the CLI modernizer's print rewrite onto `make mod`.
#
# The retired transformer selected the call with `ast` and then produced the
# replacement by running `re.sub(r"\bprint\b", ...)` / `re.sub(r"\bu\.Cli\.print\b", ...)`
# over the node's own source text. Here the AST node is both the selection and
# the replacement unit, so the same literal inside a docstring, a string
# constant, or a comment is structurally unreachable.
#
# Gated on `cli` being bound from flext_cli in the same module — the declarative
# form of the transformer's `_cli_symbol` bookkeeping. A module that has no
# output owner is left to Ruff T201 rather than rewritten to an unbound name;
# `make fix` never auto-fixes T201 (tooling.yaml `unfixable`), so that print is
# reported, never deleted.
#
# Diagnostics are rewired, never deleted (flext-itpd1.5): Ruff's T201 fix once
# deleted `print(..., file=sys.stderr)` from a consumer script and turned its
# failures silent. The call keeps exactly one positional argument (a splat has
# no single-argument translation) and may carry only keywords the CLI display
# owner already honours: `file=sys.stderr` / `file=sys.stdout` move the text to
# `cli.display_text`, the one CLI display owner, and a literal `flush` is
# implied because the owner flushes every write. `end`, `sep`, a file handle or
# a computed `flush` have no faithful translation, and a comment inside the call
# would be dropped by the rewrite, so those calls stay T201 findings. `scripts/`
# is first-class code, covered like `src/` and `tests/`.
id: rewire-print-to-cli-display-text
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
  - "scripts/**/*.py"
rule:
  all:
    - any:
        - pattern: u.Cli.print($ARG)
        - all:
            - kind: call
            - has:
                field: function
                kind: identifier
                regex: ^print$
            - has:
                field: arguments
                kind: argument_list
                all:
                  - has:
                      nthChild: 1
                      pattern: $ARG
                  - not:
                      has:
                        nthChild: 2
                        not:
                          kind: keyword_argument
                  - not:
                      has:
                        kind: keyword_argument
                        not:
                          any:
                            - all:
                                - has:
                                    field: name
                                    regex: ^file$
                                - has:
                                    field: value
                                    any:
                                      - pattern: sys.stderr
                                      - pattern: sys.stdout
                            - all:
                                - has:
                                    field: name
                                    regex: ^flush$
                                - has:
                                    field: value
                                    any:
                                      - kind: "true"
                                      - kind: "false"
            - not:
                has:
                  kind: comment
                  stopBy: end
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          matches: cli-imported-from-flext-cli
constraints:
  ARG:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
fix: cli.display_text($ARG)
message: >-
  A module that binds the flext_cli facade emits user-facing output and
  diagnostics through cli.display_text, never through the print builtin or
  u.Cli.print.
---
# Recomposition of the pattern modernizer's print rewrite onto `make mod`.
#
# The retired transformer rewrote `print(...)` to `logger.info(...)` while the
# CLI modernizer rewrote the same construct to `cli.display_text(...)`; which
# one won depended on the order the two transformers happened to run. The
# contradiction is resolved structurally by the two rules in this file.
#
# The transformer also *injected* `logger = u.fetch_logger(__name__)` when the
# binding was absent. That insertion is not expressible as a textual ast-grep
# fix (the legal module-level insertion point depends on the docstring, shebang
# and `__future__` imports), so this rule requires the binding to exist and
# leaves the remaining case to Ruff T201, which `make fix` reports and never
# deletes. A splat argument has no single-message translation.
id: rewire-print-to-logger-info
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  all:
    - any:
        - pattern: print($ARG)
        - pattern: u.Cli.print($ARG)
    - inside:
        kind: module
        stopBy: end
        all:
          - has:
              stopBy: end
              matches: module-logger-bound
          - not:
              has:
                stopBy: end
                matches: cli-imported-from-flext-cli
constraints:
  ARG:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
fix: logger.info($ARG)
message: >-
  Library code emits diagnostics through the module logger, never through the
  print builtin or u.Cli.print.
