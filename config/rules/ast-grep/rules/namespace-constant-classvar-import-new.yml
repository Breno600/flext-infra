# Adds the module-level `from typing import ClassVar` when a module declaring a
# FlextTestsConstants.Tests constant has no module-level typing import at all
# (flext-gyqu7, 2026-09-23). Anchored on the mandatory
# `from __future__ import annotations` so the import lands in the import block.
#
# Idempotent: once a module-level typing import exists the rule no longer
# matches; namespace-constant-classvar-import then owns adding ClassVar to it.
id: namespace-constant-classvar-import-new
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  all:
    - pattern: "from __future__ import annotations"
    - inside:
        kind: module
        all:
          - has:
              stopBy: end
              matches: pydantic-namespace-constant
          - not:
              has:
                kind: import_from_statement
                has:
                  field: module_name
                  regex: "^typing$"
fix: "from __future__ import annotations\n\nfrom typing import ClassVar"
message: >-
  Modules declaring FlextTestsConstants.Tests constants bind ClassVar at
  module level.
