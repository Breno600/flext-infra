# No string-like header parser locator competes with the u.Infra facade.
id: rewire-transformer-header-service-locator-call
language: Python
severity: error
files:
  - "flext-infra/src/**/*.py"
ignores:
  - "**/utilities.py"
rule:
  pattern: u.Infra.header_parser.$METHOD($$$ARGS)
constraints:
  METHOD:
    regex: "^(?:alias_locally_bound|alias_used|ensure_alias_import|ensure_future_annotations|has_alias_import)$"
fix: u.Infra.$METHOD($$$ARGS)
message: Remove the header parser locator and call u.Infra directly.
