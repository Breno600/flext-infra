# Why: probing single-underscore attributes through getattr/hasattr/setattr
# reaches past the owning facade's public surface (ENFORCE-044 companion;
# recomposed onto make mod per ADR-017 Decision 5 so static scan surfaces the
# same violations the runtime hook emits). Detection-only: each site needs an
# owner decision (declare the attribute publicly or use the facade surface).
id: ban-getattr-private-probe
language: python
severity: warning
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  any:
    - pattern: getattr($O, "$ATTR", $$$REST)
    - pattern: hasattr($O, "$ATTR")
    - pattern: setattr($O, "$ATTR", $$$V)
constraints:
  # One leading underscore then a letter: a private name. Dunders are the
  # public Python data model (__module__, __all__, __annotations__), not a
  # bypass of any owner facade.
  ATTR:
    regex: "^_[A-Za-z]"
message: >-
  Private-attribute probe: getattr/hasattr/setattr on a single-underscore
  name bypasses the owner facade; declare the surface publicly or go through
  the owning module (ENFORCE-044).
