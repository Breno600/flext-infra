id: private-infra-utility-call-to-facade
language: Python
severity: error
rule:
  pattern: $OWNER.$METHOD
constraints:
  OWNER:
    regex: '^FlextInfra(?:Utilities|Worktree)\w+$'
fix: u.Infra.$METHOD
message: Consume infrastructure utilities through u.Infra.
files:
  - "src/flext_infra/worktree.py"
  - "src/flext_infra/base.py"
  - "src/flext_infra/_base_projects.py"
  - "src/flext_infra/workspace/**/*.py"
  - "src/flext_infra/codegen/**/*.py"
  - "src/flext_infra/validate/**/*.py"
  - "src/flext_infra/refactor/**/*.py"
  - "src/flext_infra/transformers/**/*.py"
  - "src/flext_infra/fixers/**/*.py"
  - "src/flext_infra/detectors/**/*.py"
  - "src/flext_infra/deps/**/*.py"
---
id: private-infra-utility-alias-call-to-facade
language: Python
severity: error
rule:
  pattern: ub.$METHOD($$$ARGS)
fix: u.Infra.$METHOD($$$ARGS)
message: Consume infrastructure utilities through u.Infra.
files:
  - "src/flext_infra/base.py"
  - "src/flext_infra/_base_projects.py"
---
id: private-infra-utility-alias-attribute-to-facade
language: Python
severity: error
rule:
  pattern: ub.$ATTRIBUTE
fix: u.Infra.$ATTRIBUTE
message: Consume infrastructure utilities through u.Infra.
files:
  - "src/flext_infra/base.py"
  - "src/flext_infra/_base_projects.py"
---
id: private-infra-utility-import-to-facade
language: Python
severity: error
rule:
  all:
    - kind: import_from_statement
    - regex: '^from\s+flext_infra\._utilities(?:\.[\w.]+)+\s+import\s+[\s\S]*FlextInfra(?:Utilities|Worktree)\w*'
fix: from flext_infra import u
message: Import the public infrastructure utility facade.
files:
  - "src/flext_infra/worktree.py"
  - "src/flext_infra/base.py"
  - "src/flext_infra/_base_projects.py"
  - "src/flext_infra/workspace/**/*.py"
  - "src/flext_infra/codegen/**/*.py"
  - "src/flext_infra/validate/**/*.py"
  - "src/flext_infra/refactor/**/*.py"
  - "src/flext_infra/transformers/**/*.py"
  - "src/flext_infra/fixers/**/*.py"
  - "src/flext_infra/detectors/**/*.py"
  - "src/flext_infra/deps/**/*.py"
