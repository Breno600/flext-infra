# A module-level type alias, TypeAlias annotation or typing factory
# (TypeVar, ParamSpec, TypeVarTuple, NewType) is a typing declaration; outside
# the typings owner it is a second owner of the type vocabulary.
#
# Scope is the module body: a declaration nested in a class or function is the
# enclosing namespace's own member, not a loose module object.
#
# No token fix: relocating the declaration rewires every consumer. The rule
# names the rope relocation that performs the move and captures the declared
# name as $NAME, the input that relocation consumes.
id: ban-manual-typing-alias-outside-typings
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/typings.py"
  - "**/_typings.py"
  - "**/typings/**"
  - "**/_typings/**"
metadata:
  relocation: typing-alias
rule:
  inside:
    kind: module
  any:
    - kind: type_alias_statement
      has:
        field: left
        has:
          kind: identifier
          pattern: $NAME
          stopBy: end
    - kind: expression_statement
      has:
        kind: assignment
        all:
          - has:
              field: left
              pattern: $NAME
          - has:
              field: type
              regex: "^(?:[A-Za-z_][A-Za-z0-9_]*\\.)*TypeAlias$"
    - kind: expression_statement
      has:
        kind: assignment
        all:
          - has:
              field: left
              pattern: $NAME
          - has:
              field: right
              kind: call
              has:
                field: function
                regex: "^(?:[A-Za-z_][A-Za-z0-9_]*\\.)*(?:TypeVar|ParamSpec|TypeVarTuple|NewType)$"
message: >-
  Module-level typing declaration outside the typings owner: declare it in
  typings.py or the typings package.
