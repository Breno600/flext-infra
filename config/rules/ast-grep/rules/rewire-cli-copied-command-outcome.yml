# Preserve the complete causal process outcome when copying command payloads.
id: rewire-cli-copied-command-outcome
language: Python
severity: error
rule:
  all:
    - kind: keyword_argument
    - has:
        field: name
        regex: "^exit_code$"
    - has:
        field: value
        any:
          - pattern: $SOURCE.exit_code
          - pattern: $SOURCE.outcome.raw_return_code
    - inside:
        any:
          - pattern: m.Cli.CommandOutput($$$ARGS)
          - pattern: m.Cli.CommandBytesOutput($$$ARGS)
        stopBy: end
fix: outcome=$SOURCE.outcome
message: Copy the typed process outcome instead of flattening it to an exit code.
