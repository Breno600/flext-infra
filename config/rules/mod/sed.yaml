# Declarative sed-by-list rules for the make mod text phase.
#
# Each entry is one list-driven regex rewrite applied across the governed
# scan surface and explicitly included paths. The engine proves an exact
# expected-count receipt when declared, and reaches a rewrite fixed point
# before the canonical validate gate runs.
#
# rules:
#   - id: example-rule-id          # unique text-rule identifier
#     description: rewrite intent  # optional
#     distributions: [flext-infra] # optional [project].name selector
#     include: ["**/tests/**"]     # optional fnmatch globs
#     exclude: ["**/legado/**"]    # optional fnmatch globs
#     find: "regex pattern"        # required
#     replace: "expansion"         # optional, default empty
#     flags: ["MULTILINE"]         # optional names from CODEMOD_TEXT_FLAG_NAMES
#     expected: 3                  # optional exact finding count receipt

rules:
  - id: codegen-test-ci-branches-from-config
    distributions: [flext-infra]
    description: Derive CI trigger branches from the same branch policy as the renderer.
    include: [tests/utilities.py]
    find: |-
      (?s)            # Why: ci_trigger_branches is no longer config-owned.*?            @staticmethod
                  def synthetic_private_submodules
    replace: |2-
                  @staticmethod
                  def ci_trigger_branches(repository_branch: str) -> t.VariadicTuple[str]:
                      """Derive the repository trigger set from the configured policy."""
                      return tuple(dict.fromkeys((
                          *config.Infra.codegen.branch_policy.ci_trigger_branches,
                          repository_branch,
                      )))

                  @staticmethod
                  def synthetic_private_submodules
  - id: codegen-test-retire-unused-classvar-import
    distributions: [flext-infra]
    description: Remove the import made obsolete by the configured CI branch policy.
    include: [tests/utilities.py]
    find: '^from typing import ClassVar\n'
    replace: ''
    flags: [MULTILINE]
  - id: codegen-test-ci-branch-consumers
    distributions: [flext-infra]
    description: Pass each fixture repository branch to the canonical configured derivation.
    include:
      - tests/unit/codegen/ci_custom_steps_tests.py
      - tests/unit/codegen/test_template_formatter_fixed_point.py
    find: '(?P<prefix>repository_branch="(?P<branch>[^"]+)",\n[ \t]+ci_trigger_branches=)(?P<owner>(?:tests\.)?utilities\.TestsFlextInfraUtilities\.CodegenTestSupport\.Ci)\.CI_TRIGGER_BASELINE_BRANCHES'
    replace: '\g<prefix>\g<owner>.ci_trigger_branches("\g<branch>")'
  - id: codegen-test-public-utility-namespace
    distributions: [flext-infra]
    description: Consume the promoted codegen helper through the canonical test utilities facade.
    include: [tests/unit/codegen/*.py]
    find: '(?<![\w.])(?:tests\.)?utilities\.TestsFlextInfraUtilities\.CodegenTestSupport\.Ci'
    replace: 'u.CodegenTestSupport.Ci'
  - id: codegen-test-public-utility-import
    distributions: [flext-infra]
    description: Replace concrete test-utilities module imports with the public lazy alias.
    include: [tests/unit/codegen/*.py]
    find: '^import tests\.utilities$'
    replace: 'from tests import u'
    flags: [MULTILINE]
  - id: codegen-test-public-utility-import-existing-alias
    distributions: [flext-infra]
    description: Retire the redundant concrete import where u is already present.
    include: [tests/unit/codegen/*.py]
    find: '^(from tests import [^\n]*\bu), utilities$'
    replace: '\g<1>'
    flags: [MULTILINE]
  - id: codegen-test-public-utility-import-new-alias
    distributions: [flext-infra]
    description: Add u to an existing test facade import that only carried utilities.
    include: [tests/unit/codegen/*.py]
    find: '^(from tests import [^\n]*), utilities$'
    replace: '\g<1>, u'
    flags: [MULTILINE]
  - id: codegen-test-retire-shadowed-facade-imports
    distributions: [flext-infra]
    description: Keep the test c/m/t facades after Rope moves their shared helper.
    include: [tests/utilities.py]
    find: '^from flext_infra import FlextInfraUtilities, c, config, m, t$'
    replace: 'from flext_infra import FlextInfraUtilities, config'
    flags: [MULTILINE]
  - id: gate-tool-error-typed-code
    distributions: [flext-infra]
    description: Read the tool-error issue code from the typed outcome instead of the retired literal.
    include: ["tests/**/*.py"]
    find: '"TOOL_ERROR"'
    replace: 'c.Infra.ToolOutcome.ERROR'
  - id: codegen-test-retire-shadowed-utility-import
    distributions: [flext-infra]
    description: Let the test u facade supply inherited production utilities.
    include:
      - tests/unit/codegen/test_release_checkout_credentials.py
      - tests/unit/codegen/test_ci_declared_secrets_contract.py
      - tests/unit/codegen/test_ci_integration_branch_triggers.py
      - tests/unit/codegen/test_ci_package_registry_read.py
      - tests/unit/codegen/test_ci_system_packages.py
    find: '^from flext_infra import ((?:\w+, )*\w+), u$'
    replace: 'from flext_infra import \g<1>'
    flags: [MULTILINE]
  - id: docs-strict-python-fence-ruff-ignores
    distributions: [flext-infra]
    description: Retain only syntax-context docstring and package exceptions for isolated executable fences.
    include: [src/flext_infra/_constants/docs.py]
    find: '^        "(?:D101|D102|D103|D106|PLR2004|S101|T201|T203|ANN001|ANN002|ANN003|ANN201|ANN202|ANN204|ANN205|PLC0415|B018|F821|F811|SLF001|S106|PT004|E402|PLW0127|PLC0414)",\n'
    replace: ''
    flags: [MULTILINE]
  - id: docs-strict-python-fence-rationale
    distributions: [flext-infra]
    description: Explain the bounded exceptions kept for standalone Markdown fence files.
    include: [src/flext_infra/_constants/docs.py]
    find: '(?s)    """Rules ignored for executable docs snippets.*?lazy-export pattern itself teaches\)\."""'
    replace: |2-
          """Only module-docstring and package rules are inapplicable to a
          standalone Markdown fence. All names, behavior, types, and security
          rules remain active and require correction in the authored source."""
  - id: checked-command-output-receipts
    distributions: [flext-infra]
    description: Preserve checked execution while retaining command output in assigned test receipts.
    include:
      - tests/unit/codegen/test_upg_lock_atomic_publication.py
      - tests/unit/codemod/test_apply_renames.py
      - tests/unit/codemod/test_rename_campaign_mod.py
      - tests/unit/codemod/test_rename_preflight.py
    find: '(^[ \t]+(?:observed|output|namespace|consumer)[ \t]*=[ \t]*tm\.ok\(\s*u\.Cli\.)run_checked(?=\()'
    replace: '\g<1>run'
    flags: [MULTILINE]
  - id: docs-pytest-single-suite-deadline
    distributions: [flext-infra]
    description: Replace removed per-project timeout override guidance with the typed suite policy.
    include: [docs/guides/testing.md]
    find: |-
      ^The fleet default test wall and any measured per-project `run-timeout-overrides`
      live in `config/tooling\.yaml`, keyed by the declared `\[project\]\.name`\. The runner
      and generated Make process bound derive their deadlines from that same policy\.
      Use the profile and complete run receipts to size a project override; an
      interrupted selection or suite remains a failed invocation\.$
    replace: |-
      The suite deadline is declared once as `Infra.tooling.tools.pytest.run-timeout-seconds`
      in `config/tooling.yaml`. The typed runner and generated Make process bound
      derive from that policy. Use the profile and complete run receipts to repair
      a slow owner; an interrupted selection or suite remains a failed invocation.
    flags: [MULTILINE]
