[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

[tool.coverage.report]
exclude_also = [
  "if _t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
source = ["src"]
omit = [
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
  "*/_protocols/*",
]

[tool.deptry]
known_first_party = ["flext_core", "flext_infra"]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
package_name = "flext_infra"

[tool.flext.namespace]
scan_dirs = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["/src/flext_infra/**", "/config/**"]

[tool.hatch.build.targets.wheel.sources]
"src/flext_infra" = "flext_infra"
config = "flext_infra/config"

[tool.hatch.build.targets.sdist]
include = ["/src/flext_infra/**", "/config/**"]

[tool.mypy]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
disable_error_code = ["prop-decorator", "call-arg"]
python_version = "3.13"
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
extra_checks = true
follow_untyped_imports = true
local_partial_types = true
namespace_packages = true
no_implicit_reexport = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["rope.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/protos/**",
  "**/site-packages/**",
  "**/typings/**",
  "**/vendor/**",
  "**/venv/**",
  ".venv/**",
  "typings/**",
  "vendor/**",
]
project-includes = ["src/**/*.py*", "tests/**/*.py*"]
python-version = "3.13"
search-path = ["src", "."]
use-ignore-files = false

[tool.pyrefly.errors]
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
