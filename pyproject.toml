[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api.argparse]
msg = "Use cli.register_result_command + Pydantic model from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.click]
msg = "Use flext_cli.cli application, registration, execution, and invocation methods."

[tool.ruff.lint.flake8-tidy-imports.banned-api.rich]
msg = "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."

[tool.ruff.lint.flake8-tidy-imports.banned-api.tabulate]
msg = "Use cli.render_table from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.typer]
msg = "Use cli.create_app_with_common_params / cli.register_command from flext_cli."

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["flext_core", "flext_infra"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/.agents/skills/webapp-testing/scripts/with_server.py" = [
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"**/__init__.py" = ["line-too-long", "non-empty-init-module", "unused-import"]
"**/_config.py" = ["invalid-function-name"]
"**/bin/**" = [
  "docstring-missing-exception",
  "docstring-missing-returns",
  "import-outside-top-level",
  "line-too-long",
  "magic-value-comparison",
  "missing-copyright-notice",
  "print",
  "type-check-without-type-error",
  "undocumented-public-method",
  "unused-class-method-argument",
]
"**/docx.py" = ["import-outside-top-level"]
"**/file_test_helpers.py" = ["line-too-long"]
"**/flext_core/_models/pydantic.py" = [
  "any-type",
  "builtin-argument-shadowing",
  "too-many-arguments",
]
"**/flextcliutilitiesfiletesthelpersmixin_part_03.py" = ["line-too-long"]
"**/framework.py" = ["banned-api", "import-outside-top-level"]
"**/pptx.py" = ["import-outside-top-level"]
"**/test_public_contracts_cov.py" = ["line-too-long"]
"**/tests/**" = [
  "boolean-positional-value-in-call",
  "compare-to-empty-string",
  "import-private-name",
  "magic-value-comparison",
  "mutable-class-default",
  "no-self-use",
  "private-member-access",
  "pytest-fixture-autouse",
  "too-many-public-methods",
]
"**/tests/python/**" = ["raise-vanilla-args"]
"**/xlsx.py" = ["import-outside-top-level"]
"scripts/**" = [
  "any-type",
  "avoidable-escaped-quote",
  "banned-api",
  "blank-line-after-function",
  "boolean-default-value-positional-argument",
  "boolean-type-hint-positional-argument",
  "builtin-open",
  "commented-out-code",
  "error-instead-of-exception",
  "f-string-in-exception",
  "if-exp-instead-of-or-operator",
  "import-private-name",
  "invalid-module-name",
  "literal-membership",
  "logging-string-concat",
  "magic-value-comparison",
  "manual-list-comprehension",
  "manual-list-copy",
  "missing-blank-line-after-summary",
  "missing-maxsplit-arg",
  "multi-line-summary-first-line",
  "multiple-starts-ends-with",
  "non-lowercase-variable-in-function",
  "noqa-comments",
  "os-path-abspath",
  "os-path-dirname",
  "os-path-exists",
  "os-path-join",
  "path-constructor-current-directory",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "read-whole-file",
  "relative-imports",
  "repeated-append",
  "runtime-cast-value",
  "shebang-not-executable",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "unnecessary-multiline-docstring",
  "unsorted-dunder-all",
  "unspecified-encoding",
  "unused-function-argument",
  "unused-noqa",
  "used-dummy-variable",
  "verbose-raise",
  "write-whole-file",
]
"scripts/**/*.py" = [
  "commented-out-code",
  "line-too-long",
  "typing-only-first-party-import",
]
"src/flext_cli/_utilities/processes.py" = [
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"src/flext_cli/_utilities/runtime.py" = [
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"tests/**/*.py" = ["assert"]
"tests/test_snapshot_drill.py" = ["import-private-name"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
sort_first = ["project", "build-system", "tool", "dependency-groups"]

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

[tool.uv]
link-mode = "copy"
constraint-dependencies = ["mypy<2.4.0"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-infra"]

[tool.uv.exclude-dependencies.package]
name = "flext-tests"
[tool.interrogate]
fail-under = 70
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-private = true
ignore-property-decorators = true

[tool.pytest_env]
FLEXT_INFRA_LINT_SNAPSHOT_GATES = "lint"

[tool.radon]
cc_min = "B"
mi_min = "B"
