[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic :: 2",
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = [
  "annotated-types>=0.8.0",
  "beartype>=0.22.9",
  "defusedxml>=0.7.1",
  "dependency-injector>=4.49.1",
  "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
  "GitPython>=3.2.0",
  "jinja2>=3.1.6",
  "libcst>=1.9.0",
  "Markdown>=3.11",
  "mkdocs>=1.6.1",
  "packaging>=26.3",
  "pydantic>=2.14.0,<3",
  "pydantic-settings>=2.15.0",
  "pymdown-extensions>=11.0.1",
  "pytest>=9.1.1",
  "pyyaml>=6.0.3",
  "rope @ git+https://github.com/marlon-costa-dc/rope.git@datacosmos",
  "structlog>=25.5.0",
  "typing-extensions>=4.16.0",
]
description = "FLEXT Infrastructure Tooling - Build automation, code generation, and workspace management"
keywords = ["automation", "codegen", "flext", "infrastructure", "tooling"]
license = "MIT"
name = "flext-infra"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

[project.scripts]
flext-docs = "flext_infra.cli:FlextInfraCli.docs_main"
flext-infra = "flext_infra.cli:main"

[project.urls]
Documentation = "https://github.com/flext-sh/flext-infra/blob/main/README.md"
Homepage = "https://github.com/flext-sh/flext-infra"
Repository = "https://github.com/flext-sh/flext-infra"

[project.entry-points.pytest11]
"flext_infra._pytest_collection" = "flext_infra._pytest_collection:FlextInfraPytestCollection"

[dependency-groups]
