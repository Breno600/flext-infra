id: ban-infra-crg-function-implementation
# `valid` MUST NOT match: a function whose name carries no CRG marker, even when
# its body mentions one.
valid:
  - |
    def build_graph() -> None:
        pass
  - |
    def run() -> None:
        crg_status = 1
# `invalid` MUST match: a function named for CRG behavior, in any case.
invalid:
  - |
    def run_crg() -> None:
        pass
  - |
    async def CrgRefresh() -> None:
        pass
