id: ban-getattr-private-probe
valid:
  - value = getattr(obj, "public_attr", None)
  - present = hasattr(obj, "name")
  - value = getattr(obj, attr_name, None)
  - setattr(obj, "public_attr", value)
  - module_name = getattr(klass, "__module__", "")
  - exports = getattr(module, "__all__", None)
invalid:
  - resolver = getattr(obj, "_get_service_settings_type", None)
  - present = hasattr(handler, "_private_state")
  - setattr(obj, "_cache", value)
  - raw = getattr(source, "_bootstrap_options", None)
