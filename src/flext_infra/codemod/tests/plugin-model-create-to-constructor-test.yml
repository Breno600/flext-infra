id: plugin-model-create-to-constructor
# `valid` MUST NOT match: owners whose `create` is real, or the constructor.
valid:
  - context = FlextContext.create(scope="request")
  - registry = FlextRegistry.create()
  - entity = m.Plugin.Entity(name="demo")
# `invalid` MUST match: a `create` factory the plugin models do not declare.
invalid:
  - entity = m.Plugin.Entity.create(name="demo")
  - registry = FlextPluginPlatform.PluginRegistry.create()
  - registry = u.Plugin.Platform.PluginRegistry.create(plugins)
