id: rewire-print-to-logger-info
valid:
  - |
    from flext_cli import cli
    from flext_infra import u

    logger = u.fetch_logger(__name__)
    print("message")
  - |
    from flext_infra import u

    logger = u.fetch_logger(__name__)
    logger.info("message")
  - |
    print("message")
  - |
    from flext_infra import u

    logger = u.fetch_logger(__name__)
    print("message", flush=True)
