id: ban-infra-utility-module-self-facade-import
# `valid` MUST NOT match: the facade imported at the method point of use, other
# aliases of flext_infra, or another package's `u`.
valid:
  - |
    def run() -> None:
        from flext_infra import u

        u.Infra.run()
  - from flext_infra import c, m
  - from flext_infra.detectors import FlextInfraLspDiagnosticsDetector
  - from flext_cli import u
# `invalid` MUST match: `u` bound from flext_infra at module import time.
invalid:
  - from flext_infra import u
  - from flext_infra import c, m, u
