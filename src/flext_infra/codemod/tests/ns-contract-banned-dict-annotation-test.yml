id: ns-contract-banned-dict-annotation
valid:
  - "attrib: t.MappingKV[str] = payload"
  - "attrib: Mapping[str, str]"
  - "overrides: MutableMapping[str, str] = {}"
  - "def compose(overrides: Mapping[str, int]) -> str: ..."
  - "def gather() -> Mapping[str, int]: ..."
  - "cache: list[dict[str, str]] = []"
invalid:
  - "attrib: dict[str, str] = {}"
  - "attrib: dict[str, str]"
  - "def compose(overrides: dict[str, str]) -> str: ..."
  - "def gather() -> dict[str, int]: ..."
