# ast-grep configuration for skill rule testing
# Reference: https://ast-grep.github.io/guide/test-rule.html
#
# Rule guidance lives in the repository AGENTS.md. These package-owned rule
# fixtures depend on no skill links.

# Every FLEXT project inherits universal rules. Domain/adapter packages use
# `runtime`, so this config is selected only through a consumer's runtime graph.
scope: universal

# ruleDirs: directories containing rule YAML files
# Package-owned rule YAML files are discovered here.
ruleDirs:
  - rules

# utilDirs: global utility rules referenced by rules via `matches: <util-id>`.
# One audited guard (e.g. tm-imported-from-flext) shared by the whole family,
# instead of duplicating the block in every rule (SSOT for codemod guards).
utilDirs:
  - utils

# testConfigs: directories containing test YAML files
# Test files follow naming convention: {rule-id}-test.yml
# Test structure:
#   id: test-{rule-id}
#   rule: {rule-id}
#   language: {language}
#   cases:
#     - id: case-name
#       valid: true/false
#       code: |
#         code snippet to test
testConfigs:
  - testDir: tests
