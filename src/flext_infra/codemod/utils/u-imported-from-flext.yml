# A rewrite that emits ``u.*`` is only F821-safe when the canonical utilities
# facade is bound as the plain name ``u`` in the same module.
#
# Two binding forms qualify, and both are audited here because both bind the
# name: the absolute import from a public FLEXT package
# (``from flext_core import u``), and the package-relative import a FLEXT
# package uses on itself (``from ... import u``, ``from . import u``). The
# relative form is how every module inside flext-infra reaches its own facade,
# so a guard that recognised only the absolute form silently refused to repair
# the whole interior of every FLEXT package (flext-itpd1.3, 2026-09-19).
#
# ``import flext_infra.u`` and ``from x import u as util`` still do not bind
# ``u`` and stay excluded: the emitted text is a fixed ``u.``, so an aliased or
# dotted binding would emit an unbound name.
#
# Sibling of r-imported-from-flext (result facade) and t-locally-bound (typings
# facade): one audited binding guard per facade, referenced with ``matches:``.
id: u-imported-from-flext
language: python
rule:
  kind: import_from_statement
  all:
    - has:
        pattern: u
        stopBy: end
    - any:
        - has:
            field: module_name
            regex: "^flext(?:_[a-z0-9_]+)?$"
        - has:
            kind: relative_import
    - not:
        has:
          kind: aliased_import
          stopBy: end
          has:
            pattern: u
            stopBy: end
