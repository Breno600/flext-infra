# Ban model-construction helpers (operator ruling 2026-09-26).
#
# A Pydantic model owns its own construction. A function whose only job is to
# assemble a model — prepare arguments, optionally branch on its parameters
# (isinstance, `None` defaults), then `return M(...)`, `M.model_validate(...)`
# or `M.model_construct(...)` — is a second construction path beside the model
# itself. It hides the owner, invites divergent defaults, and moves derivation
# out of the model. Construction happens through the model: `M(...)` at the
# call site, `M.model_validate(...)` at the ingress boundary, derived values as
# `@computed_field`, normalization as field validators on the model.
#
# Motivating shape (flext-core V8 S2, exterminated):
#
#     @staticmethod
#     def _service_record(name, value: m.ServiceRegistration | t.RegisterableService)
#         -> m.ServiceRegistration:
#         if isinstance(value, m.ServiceRegistration): return value
#         return m.ServiceRegistration(name=name, service=value, ...)
#
# and test-data factories whose `build()` only assembles a model from defaults.
#
# Detection is SHAPE-BASED and deliberately narrow:
#   * the name marks a constructor helper: `_*record`, `build*`, `create*`,
#     `make*`, `new_*`, `*_factory`, `from_*` (optionally underscore-prefixed);
#   * the return annotation is a model path: `m.A`, `m.A.B`, `m.Ns.A.B`, a
#     `Flext*Models*` class path, or a `Tests*` model class path;
#   * the body's final statement returns the construction of that SAME model
#     (metavariable equality between annotation and constructed class);
#   * the body only prepares arguments: no loop, `with`, `try`, `raise`, or
#     nested definition, and no preparatory statement resolving collaborators
#     through a call chain or observing the filesystem — computation is not
#     construction.
#
# Legitimate homonyms keep their contract: a service operation returning
# `r.ok(M(...))` has a Result annotation and never matches; a `from_*`
# classmethod on the model itself annotated `Self` never matches; a builder
# whose body loops, reads resources, or raises is computing a domain result
# and never matches. The pass-through case (exact argument forwarding) stays
# owned by `ban-pass-through-wrapper`; this rule does not duplicate it.
#
# Detection-only: the replacement deletes the helper and rewires every caller
# to `M(...)`/`M.model_validate(...)`, moving any derivation into the model as
# a computed field or validator. A rewrite cannot choose that placement.
id: ban-model-construction-helper
language: Python
severity: error
rule:
  kind: function_definition
  all:
    - has:
        field: name
        regex: '^_?(build\w*|create\w*|make\w*|new_\w+|from_\w+|\w*_factory|\w*record)$'
    - has:
        field: return_type
        has:
          pattern: $M
    - has:
        field: body
        has:
          kind: return_statement
          nthChild:
            position: 1
            reverse: true
          any:
            - has:
                kind: call
                has:
                  field: function
                  pattern: $M
            - has:
                kind: call
                has:
                  field: function
                  any:
                    - pattern: $M.model_validate
                    - pattern: $M.model_validate_json
                    - pattern: $M.model_construct
    - not:
        has:
          field: body
          has:
            stopBy: end
            any:
              - kind: for_statement
              - kind: while_statement
              - kind: with_statement
              - kind: try_statement
              - kind: raise_statement
              - kind: function_definition
              - kind: class_definition
              - kind: yield
              - kind: await
    # Preparatory statements that resolve collaborators through call chains
    # (`container.dispatcher().unwrap()`) or observe the filesystem
    # (`path.stat()`, `path.read_text()`) make the function a service
    # operation that computes a domain result, not an argument assembler.
    - not:
        has:
          field: body
          has:
            not:
              kind: return_statement
            has:
              stopBy: end
              kind: call
              has:
                field: function
                kind: attribute
                any:
                  - has:
                      field: object
                      kind: call
                  - has:
                      field: attribute
                      regex: '^(stat|lstat|open|read_text|read_bytes|exists|is_file|is_dir|iterdir|glob|rglob)$'
    # A `from_*` alternate constructor declared on a model class itself is the
    # model's own construction surface (method-free declaration layers are a
    # separate law); only `from_*` on non-model owners is a helper here.
    - not:
        all:
          - has:
              field: name
              regex: '^_?from_'
          - any:
              - inside:
                  kind: block
                  inside:
                    kind: class_definition
                    has:
                      field: superclasses
                      regex: '(\bm\.\w+|BaseModel|Model)\b'
              - inside:
                  kind: decorated_definition
                  inside:
                    kind: block
                    inside:
                      kind: class_definition
                      has:
                        field: superclasses
                        regex: '(\bm\.\w+|BaseModel|Model)\b'
constraints:
  # Test doubles (`*Stub`, `*Fake`, ...) are plain classes owned by the
  # ban-test-doubles / ban-test-fakes laws; this rule never duplicates them.
  M:
    all:
      - regex: '^(m(\.[A-Z]\w*){1,3}|Flext\w*Models\w*(\.[A-Z]\w*)*|Tests\w*(\.[A-Z]\w*)*)$'
      - not:
          regex: '(Stub|Fake|Double|Mock|Spy|Dummy)$'
message: >-
  Model-construction helper: `$M` is assembled here instead of through the
  model itself. Delete the helper and construct `$M(...)` (or
  `$M.model_validate(...)` at the boundary) at every caller.
note: >-
  Move derived values into `@computed_field` and normalization into field
  validators on `$M`; rewire every caller in the same cutover.
files:
  - "**/*.py"
