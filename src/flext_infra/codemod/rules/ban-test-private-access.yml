# Dynamic imports of another package's private modules couple tests to internals.
# Pyright reportPrivateUsage owns semantic attribute access, including documented
# external underscore APIs and lexical identity. Static private imports belong
# to ban-private-import; string attribute probes to ban-getattr-private-probe.
# This detection-only rule preserves dynamic import findings for public-boundary
# repairs; it never deletes tests or rewrites their behavior automatically.
id: ban-test-private-access
language: Python
severity: error
files:
  - "**/tests/**/*.py"
  - "**/examples/**/*.py"
  - "**/conftest.py"
rule:
  all:
    - kind: call
    - has:
        field: function
        regex: '^(?:importlib\.)?import_module$'
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: string
          regex: '^[rRbBuU]?["''][\w.]*\._[A-Za-z]\w*(?:\.\w+)*["'']$'
message: >-
  Dynamic import of a private module couples this test to internal construction.
  Preserve the behavioral scenario through the owner's public interface.
