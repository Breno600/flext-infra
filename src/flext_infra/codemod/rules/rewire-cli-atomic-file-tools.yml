# Generic atomic filesystem behavior is owned once by flext-cli u.Cli.
# Tests exercise that public utility owner directly; the service facade must not
# preserve a second pass-through route for the same operations.
id: rewire-cli-atomic-file-tools
language: Python
severity: error
files:
  - "flext-cli/tests/**/*.py"
rule:
  pattern: cli.$METHOD($$$ARGS)
constraints:
  METHOD:
    kind: identifier
    regex: "^atomic_(write_text_file(_guarded)?|write_binary_file_guarded|delete_binary_file_guarded|publish_staged_binary_file_guarded|read_binary_file_state|plan_directory_chain|create_directory_chain_guarded|read_empty_directory_state|create_empty_directory_guarded|delete_empty_directory_guarded|publish_staged_empty_directory_guarded|inventory_physical_tree|cleanup_physical_tree_guarded)$"
fix: u.Cli.$METHOD($$$ARGS)
message: Call the canonical generic atomic filesystem utility owner directly.
