# ai-hub is an optional host runtime, never a Python dependency of flext-infra.
# Runtime augmentation crosses this boundary only through installed commands,
# hooks, MCP routes, or daemons. Git repository primitives remain in u.Infra;
# GitHub provider operations remain in ai-hub.

id: ban-ai-hub-library-boundary
language: Python
severity: error
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '^import\s+.*\bai_hub(?:_client|\.[A-Za-z_][\w.]*)?\b'
    - all:
        - kind: import_from_statement
        - regex: '^from\s+ai_hub(?:_client|\.[A-Za-z_][\w.]*)*\s+import\b'
    - all:
        - kind: import_statement
        - regex: '^import\s+.*\bcode_review_graph(?:\.[A-Za-z_][\w.]*)?\b'
    - all:
        - kind: import_from_statement
        - regex: '^from\s+code_review_graph(?:\.[A-Za-z_][\w.]*)*\s+import\b'
    - all:
        - kind: identifier
        - regex: "(?i)(?:code_?review_?graph|(?:^|_)crg(?:_|$))"
message: >-
  flext-infra must not import ai-hub/CRG libraries or implement CRG wrappers,
  models, constants, gates, or lifecycle. Use an optional public ai-hub
  command, hook, MCP route, or daemon for host-runtime augmentation.
files:
  - "**/src/flext_infra/**/*.py"
