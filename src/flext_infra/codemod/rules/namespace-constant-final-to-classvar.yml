# Test-tier constants declared on a `Tests(FlextTestsConstants.Tests)` namespace
# holder are class constants, never model fields (flext-xercj, 2026-09-23).
#
# The base carries FlextSettings through FlextCliConstants.Cli (ENFORCE-042
# namespace-holder contract), so pydantic treats `NAME: Final[T] = value` as a
# field with a default and raises PydanticDeprecatedSince211 at class creation;
# under `-W error` the whole conftest fails to import. ClassVar is the form
# the holder contract requires (flext-cli 98d942f6).
#
# Idempotent: the rewrite yields `ClassVar[T]`, which this rule never matches.
# The companion import rules bind `ClassVar` in the same pass.
id: namespace-constant-final-to-classvar
language: python
severity: error
files:
  - "src/**/*.py"
  - "tests/**/*.py"
rule:
  all:
    - pattern: "$NAME: Final[$T] = $V"
    - matches: pydantic-namespace-constant
fix: "$NAME: ClassVar[$T] = $V"
message: >-
  A constant on a FlextTestsConstants.Tests namespace holder must be a
  ClassVar; Final makes it a pydantic field with a default.
