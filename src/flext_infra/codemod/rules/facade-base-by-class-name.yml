# Facades inherit through public letters with separate parent/local bindings.
# Detect colliding imports and annotated local rebinds. Concrete facade imports
# belong to canonical alias enforcement; this gate never demands them.
id: facade-base-by-class-name
language: python
severity: error
files:
  - "**/*.py"
rule:
  all:
    - kind: assignment
    - has:
        field: left
        kind: identifier
        pattern: $L
    - has:
        field: right
        kind: identifier
        pattern: $C
    - any:
        - has:
            field: type
            regex: .
        - inside:
            kind: module
            stopBy: end
            has:
              kind: import_from_statement
              has:
                field: name
                kind: dotted_name
                pattern: $L
    - inside:
        kind: expression_statement
        inside:
          kind: module
    # The import binds $B before the class is inspected: ast-grep never
    # backtracks, so a class with several bases must meet an already bound $B.
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_from_statement
          has:
            field: name
            any:
              - all:
                  - kind: dotted_name
                  - pattern: $L
                  - pattern: $B
              - all:
                  - kind: aliased_import
                  - has:
                      field: name
                      pattern: $L
                  - has:
                      field: alias
                      pattern: $B
    - inside:
        kind: module
        stopBy: end
        has:
          kind: class_definition
          all:
            - has:
                field: name
                pattern: $C
            - has:
                field: superclasses
                has:
                  kind: identifier
                  pattern: $B
message: >-
  Facade `$C` must inherit through a distinct parent alias and publish `$L = $C`
  as a plain type alias, without rebinding the imported parent name.
note: >-
  Run `make mod`: the facade-base phase keeps the public letter import, separates
  its parent binding, and removes an annotated local rebind atomically.
