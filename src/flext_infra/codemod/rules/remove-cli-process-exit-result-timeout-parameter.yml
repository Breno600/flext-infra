id: remove-cli-process-exit-result-timeout-parameter
language: Python
severity: error
rule:
    pattern:
        context: |
            def _process_exit_result(
                cmd: $COMMAND_TYPE,
                $$$PARAMETERS,
                *,
                timed_out: $TIMED_OUT_TYPE,
                legacy_timeout: $LEGACY_TYPE,
                legacy_timeout_seconds: $SECONDS_TYPE,
                timeout_exit_code: $EXIT_CODE_TYPE,
            ) -> $RESULT_TYPE:
                $DOC
                if legacy_timeout and timed_out:
                    $$$LEGACY_FAILURE
                if received_signals:
                    $$$SIGNAL_EXIT
                elif timed_out:
                    primary_exit = timeout_exit_code
                elif return_code is None:
                    $$$MISSING_EXIT
                else:
                    $$$PROCESS_EXIT
                $$$OUTCOME
        selector: function_definition
fix: |
    def _process_exit_result(
        $$$PARAMETERS,
        *,
        timed_out: $TIMED_OUT_TYPE,
    ) -> $RESULT_TYPE:
        $DOC
        if received_signals:
            $$$SIGNAL_EXIT
        elif return_code is None:
            $$$MISSING_EXIT
        else:
            $$$PROCESS_EXIT
        $$$OUTCOME
message: Remove per-call timeout policy from the causal outcome owner.
