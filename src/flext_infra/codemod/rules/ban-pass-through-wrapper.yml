# Ban pass-through wrapper functions (epic i2h4 flext-core refactor).
#
# FLEXT law: deduplicate via FLEXT / facade projections. A function whose entire
# body is `return other.fn(<the exact same args>)` adds an indirection layer
# with zero behavior — it hides the real owner, breaks rename/refactor
# chains, and violates "root cause, one owner".
#
# Detection is SHAPE-BASED: the wrapper forwards its parameters unchanged
# (same metavariable on both sides) to a single callee. Wrappers that add
# behavior (logging, adaptation, defaults, type conversion) never match.
#
# Detection-only: the correct replacement is to delete the wrapper and call
# the real owner directly, updating every consumer in the same cutover.

id: ban-pass-through-wrapper
language: Python
severity: error
rule:
  any:
    - pattern: |
        def $FN($$$ARGS):
            return $CALLEE($$$ARGS)
    - pattern: |
        def $FN($ARG: $TYPE) -> $RET:
            return $CALLEE($ARG)
    - pattern: |
        def $FN($ARG: $TYPE = $DEFAULT) -> $RET:
            return $CALLEE($ARG)
    - pattern: |
        def $FN(*$ARGS: $ATYPE, **$KWARGS: $KTYPE) -> $RET:
            return $CALLEE(*$ARGS, **$KWARGS)
    - pattern: |
        async def $FN($$$ARGS):
            return await $CALLEE($$$ARGS)
    - pattern: |
        async def $FN($ARG: $TYPE) -> $RET:
            return await $CALLEE($ARG)
    - pattern: |
        async def $FN($ARG: $TYPE = $DEFAULT) -> $RET:
            return await $CALLEE($ARG)
    - pattern: |
        async def $FN(*$ARGS: $ATYPE, **$KWARGS: $KTYPE) -> $RET:
            return await $CALLEE(*$ARGS, **$KWARGS)
message: >-
  Pass-through wrapper: this function only forwards its arguments unchanged
  to $CALLEE. Delete it and call the real owner directly.
note: >-
  Rewire every caller to $CALLEE before deleting the wrapper. If the wrapper
  only renames the callee, expose the canonical name on the owning facade.
files:
  - "**/*.py"
