id: rewire-cli-internal-process-outcome-success-check
language: Python
severity: error
files:
  - "flext-cli/src/flext_cli/_utilities/_toml_parts/flextcliutilitiestoml_part_06.py"
rule:
  pattern: $OUTCOME.raw_return_code == $SUCCESS
constraints:
  SUCCESS:
    regex: "^(?:0|c\\.Cli\\.EXIT_CODE_SUCCESS)$"
fix: ur.process_succeeded($OUTCOME)
message: Use the causal predicate inside runtime utility composition.
